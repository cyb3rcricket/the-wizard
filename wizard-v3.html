      updateHatMesh() {
        if (!this.nodes.hatContinuousMesh) return;
        const RINGS = this.HAT_RINGS;
        const RADIAL = this.HAT_RADIAL;
        const positions = this.nodes.hatContinuousMesh.geometry.attributes.position.array;

        // Precompute cumulative joint matrices relative to head using zero-allocation scratch matrices
        for (let i = 0; i < 5; i++) {
          this.nodes.hatSegments[i].updateMatrix();
          if (i === 0) {
            _hatJointMats[0].copy(this.nodes.hatSegments[0].matrix);
          } else {
            _hatJointMats[i].multiplyMatrices(_hatJointMats[i - 1], this.nodes.hatSegments[i].matrix);
          }
        }

        const totalH = 2.20;
        const sLimits = [0, 0.52 / totalH, 1.00 / totalH, 1.44 / totalH, 1.84 / totalH, 1.0];

        for (let r = 0; r <= RINGS; r++) {
          const t = r / RINGS;
          const radius = 0.68 * Math.pow(Math.max(0, 1.0 - t), 0.80) + 0.025;

          // Locate segment
          let s = 0;
          for (let i = 0; i < 5; i++) {
            if (t >= sLimits[i] && t <= sLimits[i + 1]) {
              s = i;
              break;
            }
          }
          if (s >= 5) s = 4;

          const sSpan = sLimits[s + 1] - sLimits[s];
          const u = Math.min(1.0, Math.max(0.0, (t - sLimits[s]) / (sSpan || 0.001)));
          const h = this.hatSpineJoints[s].height;

          for (let c = 0; c <= RADIAL; c++) {
            const angle = (c / RADIAL) * Math.PI * 2;
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);

            _hatPVec.set(cosA * radius, u * h, sinA * radius).applyMatrix4(_hatJointMats[s]);

            if (s < 4 && u > 0.65) {
              const blendW = (u - 0.65) / 0.35;
              const smoothW = blendW * blendW * (3 - 2 * blendW);
              _hatPNext.set(cosA * radius, (u - 1.0) * this.hatSpineJoints[s + 1].height, sinA * radius).applyMatrix4(_hatJointMats[s + 1]);
              _hatPVec.lerp(_hatPNext, smoothW * 0.5);
            }

            const idx = (r * (RADIAL + 1) + c) * 3;
            positions[idx] = _hatPVec.x;
            positions[idx + 1] = _hatPVec.y;
            positions[idx + 2] = _hatPVec.z;
          }
        }

        this.nodes.hatContinuousMesh.geometry.attributes.position.needsUpdate = true;
        this.nodes.hatContinuousMesh.geometry.computeVertexNormals();
      }

      getGemWorldPosition(targetVec) {
        if (this.nodes.gemMesh) {
          this.nodes.gemMesh.getWorldPosition(targetVec);
        } else {
          targetVec.copy(this.nodes.root.position).add(new THREE.Vector3(1, 3.5, 0));
        }
        return targetVec;
      }

      // --- Complete Parametric Posing & Transform Ownership ---
      setPoseIdle(t, breath = 0) {
        const b = Math.sin(breath * 2.2);
        const w = Math.sin(breath * 1.4);

        this.nodes.root.position.copy(this.restPose.rootPos);
        this.nodes.body.position.set(0, b * 0.04, 0);
        this.nodes.chest.rotation.set(0, 0, b * 0.015);
        this.nodes.head.rotation.set(-0.02 + b * 0.02, 0.08, 0);

        // Gentle cascading beard sway
        this.nodes.beardSegments[0].rotation.set(-0.22, 0, w * 0.04);
        this.nodes.beardSegments[1].rotation.set(-0.12, 0, Math.sin(breath * 1.4 - 0.4) * 0.07);
        this.nodes.beardSegments[2].rotation.set(0.08, 0, Math.sin(breath * 1.4 - 0.8) * 0.11);

        // Hat joint rest alignment & tip flutter
        for (let i = 0; i < 5; i++) {
          const restTiltX = this.hatSpineJoints[i] ? this.hatSpineJoints[i].restTiltX : -0.15;
          const restTiltZ = this.hatSpineJoints[i] ? this.hatSpineJoints[i].restTiltZ : 0.05;
          if (i === 3) {
            this.nodes.hatSegments[i].rotation.set(restTiltX, 0, restTiltZ + Math.sin(breath * 1.2) * 0.03);
          } else if (i === 4) {
            this.nodes.hatSegments[i].rotation.set(restTiltX, 0, restTiltZ + Math.sin(breath * 1.2 - 0.5) * 0.06);
          } else {
            this.nodes.hatSegments[i].rotation.set(restTiltX, 0, restTiltZ);
          }
        }

        // Right arm & staff held upright, clear of face
        this.nodes.rightArm.rotation.copy(this.restPose.rightArmRot);
        this.nodes.rightForearm.rotation.copy(this.restPose.rightForearmRot);
        this.nodes.staffGroup.rotation.copy(this.restPose.staffGroupRot);

        // Somatic left arm relaxed at side
        this.nodes.leftArm.rotation.copy(this.restPose.leftArmRot);
        this.nodes.leftForearm.rotation.copy(this.restPose.leftForearmRot);

        // Staff Gem Ambient Glow (Restrained)
        const gemPulse = 1.6 + 0.4 * Math.sin(breath * 2.8);
        this.nodes.gemMesh.material.emissiveIntensity = gemPulse;
        this.nodes.gemLight.intensity = gemPulse * 1.0;
        this.nodes.orbitalRing1.rotation.z += 0.015;
        this.nodes.orbitalRing2.rotation.x += 0.02;

        this.nodes.robeMesh.rotation.y = Math.sin(breath * 0.8) * 0.03;

        this.updateHatMesh();
      }

      setPoseCharge(progress, totalTime) {
        const ease = Math.min(1.0, Math.max(0.0, progress));
        const smooth = ease * ease * (3.0 - 2.0 * ease);

        this.nodes.root.position.set(-4.5 - smooth * 0.38, 0, 0);
        this.nodes.body.position.set(0, smooth * 0.12, 0);
        this.nodes.chest.rotation.set(-0.25 * smooth, 0, 0); // Arched back
        this.nodes.head.rotation.set(-0.38 * smooth, 0.08 * (1.0 - smooth), 0);  // Look up toward gem

        // Right arm raises staff high overhead, clear of face
        this.nodes.rightArm.rotation.set(
          0.32 + smooth * 2.05,
          -0.20 + smooth * 0.25,
          0.40 - smooth * 0.25
        );
        this.nodes.rightForearm.rotation.set(
          0.55 - smooth * 0.30,
          0,
          0
        );
        this.nodes.staffGroup.rotation.set(
          -0.25 - smooth * 1.15,
          0,
          -0.20 * (1.0 - smooth)
        );

        // Left arm gathers and weaves energy threads in front
        this.nodes.leftArm.rotation.set(
          -0.15 + smooth * 0.95,
          -0.30 * smooth,
          -0.32 - smooth * 0.10
        );
        this.nodes.leftForearm.rotation.set(
          0.38 + smooth * 0.52,
          0,
          0.12 + smooth * 0.18
        );

        // Beard lifted forward & upward by gathering magical draft
        const vortexFlutter = Math.sin(totalTime * 18.0) * (0.05 + smooth * 0.12);
        this.nodes.beardSegments[0].rotation.set(-0.22 - 0.12 * smooth, 0, 0);
        this.nodes.beardSegments[1].rotation.set(-0.12 - 0.20 * smooth + vortexFlutter, 0, 0);
        this.nodes.beardSegments[2].rotation.set(0.08 - 0.28 * smooth + vortexFlutter * 1.4, 0, 0);

        // Hat curves back with gathering magical tension
        for (let i = 0; i < 5; i++) {
          const restTiltX = this.hatSpineJoints[i].restTiltX;
          const restTiltZ = this.hatSpineJoints[i].restTiltZ;
          const curveBack = i >= 2 ? (i - 1) * 0.08 * smooth : 0;
          this.nodes.hatSegments[i].rotation.set(restTiltX - curveBack, 0, restTiltZ);
        }

        // Blazing Energy Surge (Controlled HDR highlight)
        const jitter = (rng.next() - 0.5) * 0.6 * smooth;
        const gemPower = 1.8 + smooth * 7.5 + jitter;
        this.nodes.gemMesh.material.emissiveIntensity = gemPower;
        this.nodes.gemLight.intensity = gemPower * 1.2;
        this.nodes.orbitalRing1.rotation.z += 0.04 + smooth * 0.15;
        this.nodes.orbitalRing2.rotation.x += 0.05 + smooth * 0.18;

        this.updateHatMesh();
      }

      setPoseCast(progress, totalTime) {
        const t = Math.min(1.0, Math.max(0.0, progress));

        if (t < 0.15) {
          const snapT = t / 0.15;
          const thrust = Math.sin(snapT * Math.PI * 0.5);

          this.nodes.root.position.set(-4.9 + thrust * 1.5, 0, 0);
          this.nodes.body.position.set(0, -0.12 * thrust, 0);
          this.nodes.chest.rotation.set(-0.25 + thrust * 0.57, 0, 0);
          this.nodes.head.rotation.set(-0.38 + thrust * 0.53, 0.08 * thrust, 0);

          this.nodes.rightArm.rotation.set(
            2.37 - thrust * 1.02,
            0.05 - thrust * 0.20,
            0.15 - thrust * 0.10
          );
          this.nodes.rightForearm.rotation.set(
            0.25 - thrust * 0.20,
            0,
            0
          );
          this.nodes.staffGroup.rotation.set(
            -1.40 + thrust * 1.25,
            0,
            0
          );

          this.nodes.leftArm.rotation.set(
            -0.15 - 0.60 * thrust,
            0,
            -0.32 - 0.15 * thrust
          );
          this.nodes.leftForearm.rotation.set(
            0.38 - 0.08 * thrust,
            0,
            0.10
          );

          // Beard trails back along the violent forward strike
          this.nodes.beardSegments[0].rotation.set(-0.22 + 0.35 * thrust, 0, 0);
          this.nodes.beardSegments[1].rotation.set(-0.12 + 0.55 * thrust, 0, 0);
          this.nodes.beardSegments[2].rotation.set(0.08 + 0.75 * thrust, 0, 0);

          // Hat whips back on release gesture
          for (let i = 0; i < 5; i++) {
            const restTiltX = this.hatSpineJoints[i].restTiltX;
            const restTiltZ = this.hatSpineJoints[i].restTiltZ;
            const whip = i >= 2 ? (i - 1) * 0.10 * thrust : 0;
            this.nodes.hatSegments[i].rotation.set(restTiltX - whip, 0, restTiltZ);
          }

          // Explosive Flash Peak
          this.nodes.gemMesh.material.emissiveIntensity = 18.0;
          this.nodes.gemLight.intensity = 22.0;
        } else {
          const ft = (t - 0.15) / 0.85;
          const ripple = Math.sin(totalTime * 14.0) * Math.exp(-ft * 3.5) * 0.15;

          this.nodes.root.position.set(-3.4 - ft * 0.2, 0, 0);
          this.nodes.body.position.set(0, -0.12 * (1.0 - ft * 0.2), 0);
          this.nodes.chest.rotation.set(0.32 - ft * 0.12, 0, 0);
          this.nodes.head.rotation.set(0.15 - ft * 0.08, 0.08, 0);

          this.nodes.rightArm.rotation.set(1.35, -0.15, 0.05);
          this.nodes.rightForearm.rotation.set(0.05, 0, 0);
          this.nodes.staffGroup.rotation.set(-0.15, 0, 0);

          this.nodes.leftArm.rotation.set(-0.75, 0, -0.42);
          this.nodes.leftForearm.rotation.set(0.30, 0, 0.10);

          // Beard relaxes after forward strike
          this.nodes.beardSegments[0].rotation.set(-0.22 + 0.35 * (1.0 - ft * 0.7), 0, 0);
          this.nodes.beardSegments[1].rotation.set(-0.12 + 0.55 * (1.0 - ft * 0.7) + ripple, 0, 0);
          this.nodes.beardSegments[2].rotation.set(0.08 + 0.75 * (1.0 - ft * 0.7) + ripple * 1.4, 0, 0);

          for (let i = 0; i < 5; i++) {
            const restTiltX = this.hatSpineJoints[i].restTiltX;
            const restTiltZ = this.hatSpineJoints[i].restTiltZ;
            const whip = i >= 2 ? (i - 1) * 0.10 * (1.0 - ft * 0.8) : 0;
            this.nodes.hatSegments[i].rotation.set(restTiltX - whip, 0, restTiltZ);
          }

          this.nodes.gemMesh.material.emissiveIntensity = Math.max(1.8, 12.0 * (1.0 - ft));
          this.nodes.gemLight.intensity = Math.max(2.0, 14.0 * (1.0 - ft));
        }

        this.nodes.orbitalRing1.rotation.z += 0.03;
        this.nodes.orbitalRing2.rotation.x += 0.04;

        this.updateHatMesh();
      }

      setPoseRecover(progress, totalTime) {
        const ease = Math.min(1.0, Math.max(0.0, progress));
        const smooth = ease * ease * (3.0 - 2.0 * ease);
        const inv = 1.0 - smooth;

        this.nodes.root.position.set(-3.6 * inv - 4.5 * smooth, 0, 0);
        this.nodes.body.position.set(0, -0.12 * inv, 0); // Smoothly restores body Y to 0!
        this.nodes.chest.rotation.set(0.20 * inv, 0, 0);
        this.nodes.head.rotation.set(0.07 * inv - 0.02 * smooth, 0.08, 0);

        // Hat smoothly returns from cast/recoil to rest tilt (complete transform restoration)
        for (let i = 0; i < 5; i++) {
          const restTiltX = this.hatSpineJoints[i].restTiltX;
          const restTiltZ = this.hatSpineJoints[i].restTiltZ;
          const residualWhip = i >= 2 ? (i - 1) * 0.05 * inv : 0;
          this.nodes.hatSegments[i].rotation.set(restTiltX - residualWhip, 0, restTiltZ);
        }

        this.nodes.rightArm.rotation.set(
          1.35 * inv + 0.10 * smooth,
          -0.15 * inv - 0.15 * smooth,
          0.05 * inv + 0.10 * smooth
        );
        this.nodes.rightForearm.rotation.set(0.05 * inv + 0.30 * smooth, 0, 0);
        this.nodes.staffGroup.rotation.set(-0.15 * inv - 0.20 * smooth, 0, 0.25 * smooth);

        this.nodes.leftArm.rotation.set(-0.75 * inv - 0.15 * smooth, 0, -0.42 * inv - 0.32 * smooth);
        this.nodes.leftForearm.rotation.set(0.30 * inv + 0.38 * smooth, 0, 0.10 * inv + 0.12 * smooth);

        const settle = Math.sin(smooth * Math.PI * 2) * 0.15 * inv;
        this.nodes.beardSegments[0].rotation.set(-0.22 + 0.10 * inv, 0, 0);
        this.nodes.beardSegments[1].rotation.set(-0.12 + 0.25 * inv + settle, 0, 0);
        this.nodes.beardSegments[2].rotation.set(0.08 + 0.35 * inv + settle * 1.4, 0, 0);

        this.nodes.gemMesh.material.emissiveIntensity = 2.0 * inv + 1.8 * smooth;
        this.nodes.gemLight.intensity = 2.5 * inv + 1.8 * smooth;

        this.updateHatMesh();
      }
    }

    // Narrow Character Adapter boundary for future Phase 4+ and GLB interoperability
    class CharacterAdapter {
      constructor(character) {
        this.character = character;
      }
      applyPose(state, progress, totalTime) {
        if (state === 0) this.character.setPoseIdle(progress, totalTime);
        else if (state === 1) this.character.setPoseCharge(progress, totalTime);
        else if (state === 2) this.character.setPoseCast(progress, totalTime);
        else if (state === 3) this.character.setPoseRecover(progress, totalTime);
      }
      getGemWorldPosition(outVec) {
        return this.character.getGemWorldPosition(outVec);
      }
      getSpellDirection(outVec) {
        return outVec.set(1, 0, 0).normalize();
      }
      getAttachment(name, outTransform) {
        if (name === 'gem' && this.character.nodes.gemMesh) {
          outTransform.copy(this.character.nodes.gemMesh.matrixWorld);
        } else if (name === 'head' && this.character.nodes.head) {
          outTransform.copy(this.character.nodes.head.matrixWorld);
        }
        return outTransform;
      }
      getBounds(outBox) {
        outBox.setFromObject(this.character.group);
        return outBox;
      }
      dispose() {
        this.character.group.traverse((obj) => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
            else obj.material.dispose();
          }
        });
      }
    }

    // =========================================================================
    // 4. ENVIRONMENT & TARGET MONOLITH BUILDER (Phases 1 & 2)
    // =========================================================================
    class EnvironmentBuilder {
      constructor(scene) {
        this.scene = scene;
        this.runesMesh = null;
        this.monolithRunes = [];
        this.monolithLight = null;
        this.targetMonolith = null;
        this.mistPlanes = [];
        this.starsMesh = null;
        this.stoneTex = null;
        this.runeTex = null;
        this.moonTex = null;

        this.buildEnvironment();
      }

      buildEnvironment() {
        // --- 1. Ancient Stone Altar Dais ---
        this.stoneTex = Textures.createStoneTexture();
        const matAltar = new THREE.MeshStandardMaterial({
          map: this.stoneTex,
          roughness: 0.88,
          metalness: 0.02,
          color: 0x8892af
        });

        // Stepped Circular Dais (Radius 11.5, Height 1.2)
        const daisGeo = new THREE.CylinderGeometry(11.5, 12.8, 1.2, 32);
        const daisMesh = new THREE.Mesh(daisGeo, matAltar);
        daisMesh.position.set(0, -0.6, 0);
        daisMesh.receiveShadow = true;
        this.scene.add(daisMesh);

        // Lower Stepped Rim Base
        const baseGeo = new THREE.CylinderGeometry(13.5, 14.5, 1.4, 32);
        const baseMesh = new THREE.Mesh(baseGeo, matAltar);
        baseMesh.position.set(0, -1.8, 0);
        baseMesh.receiveShadow = true;
        this.scene.add(baseMesh);

        // Mountain Cliff Foundation
        const cliffGeo = new THREE.CylinderGeometry(14.8, 26.0, 5.0, 16);
        const matCliff = new THREE.MeshStandardMaterial({
          color: 0x141626,
          roughness: 0.92,
          metalness: 0.05,
          flatShading: true
        });
        const cliffMesh = new THREE.Mesh(cliffGeo, matCliff);
        cliffMesh.position.set(0, -4.6, 0);
        cliffMesh.receiveShadow = true;
        this.scene.add(cliffMesh);

        // --- 2. Carved Mystical Runic Circle Floor (Restrained Opacity per Phase 2) ---
        this.runeTex = Textures.createRuneDisc();
        const matRunes = new THREE.MeshBasicMaterial({
          map: this.runeTex,
          transparent: true,
          opacity: 0.22, // Subdued so floor does not overpower wizard
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const runeGeo = new THREE.PlaneGeometry(16, 16);
        this.runesMesh = new THREE.Mesh(runeGeo, matRunes);
        this.runesMesh.rotation.x = -Math.PI / 2;
        this.runesMesh.position.set(0, 0.015, 0);
        this.scene.add(this.runesMesh);

        // --- 3. Weathered Ancient Ruin Columns ---
        const columnGeo = new THREE.CylinderGeometry(0.7, 0.8, 6.5, 8);
        const columnPositions = [
          { x: -9.5, z: -5.5, h: 5.8, rot: 0.08 },
          { x: -5.5, z: -9.2, h: 6.5, rot: -0.05 },
          { x: 1.0,  z: -10.5, h: 7.5, rot: 0.04 },
          { x: 7.5,  z: -8.8, h: 5.2, rot: 0.12 },
          { x: 10.5, z: -4.5, h: 6.0, rot: -0.08 },
          { x: -11.0, z: 3.5, h: 4.2, rot: -0.15 },
          { x: 11.8,  z: 4.5, h: 3.8, rot: 0.18 }
        ];

        columnPositions.forEach((cp) => {
          const colMesh = new THREE.Mesh(columnGeo, matAltar);
          colMesh.scale.y = cp.h / 6.5;
          colMesh.position.set(cp.x, cp.h / 2 - 0.2, cp.z);
          colMesh.rotation.z = cp.rot;
          colMesh.castShadow = true;
          colMesh.receiveShadow = true;
          this.scene.add(colMesh);

          const capGeo = new THREE.BoxGeometry(1.6, 0.35, 1.6);
          const capMesh = new THREE.Mesh(capGeo, matAltar);
          capMesh.position.set(cp.x, cp.h + 0.1, cp.z);
          capMesh.rotation.z = cp.rot;
          capMesh.castShadow = true;
          this.scene.add(capMesh);
        });

        // Weathered Fallen Column Drum
        const fallenGeo = new THREE.CylinderGeometry(0.7, 0.75, 2.2, 8);
        const fallenMesh = new THREE.Mesh(fallenGeo, matAltar);
        fallenMesh.position.set(-2.5, 0.45, 9.2);
        fallenMesh.rotation.set(0.1, 0.4, Math.PI / 2);
        fallenMesh.castShadow = true;
        fallenMesh.receiveShadow = true;
        this.scene.add(fallenMesh);

        // --- 4. The Target Monolith ---
        this.targetMonolith = new THREE.Group();
        this.targetMonolith.position.set(11.5, 0, 0);
        this.scene.add(this.targetMonolith);

        const monoGeo = new THREE.CylinderGeometry(0.8, 1.5, 7.5, 6);
        const matMono = new THREE.MeshStandardMaterial({
          color: 0x363b52,
          roughness: 0.82,
          metalness: 0.05,
          flatShading: true
        });
        const monoMesh = new THREE.Mesh(monoGeo, matMono);
        monoMesh.position.y = 3.75;
        monoMesh.castShadow = true;
        monoMesh.receiveShadow = true;
        this.targetMonolith.add(monoMesh);

        // Glowing Arcane Ward Sigils on Monolith Face
        for (let i = 0; i < 4; i++) {
          const wardGeo = new THREE.TorusGeometry(0.35 + i * 0.15, 0.03, 4, 8);
          const matWard = new THREE.MeshStandardMaterial({
            color: 0x00f0ff,
            emissive: 0x00d4ff,
            emissiveIntensity: 1.2,
            roughness: 0.2
          });
          const wardMesh = new THREE.Mesh(wardGeo, matWard);
          wardMesh.position.set(-0.95, 2.5 + i * 0.9, 0);
          wardMesh.rotation.y = Math.PI / 2;
          this.targetMonolith.add(wardMesh);
          this.monolithRunes.push(wardMesh);
        }

        // Target Impact Detonation Light
        this.monolithLight = new THREE.PointLight(0x00f0ff, 0, 28, 2.0);
        this.monolithLight.position.set(-1.0, 3.5, 0);
        this.targetMonolith.add(this.monolithLight);

        // --- 5. Massive Radiant Moon ---
        this.moonTex = Textures.createMoonTexture();
        const moonGeo = new THREE.SphereGeometry(7.5, 32, 32);
        const matMoon = new THREE.MeshBasicMaterial({
          map: this.moonTex,
          color: 0xddeaff
        });
        const moonMesh = new THREE.Mesh(moonGeo, matMoon);
        moonMesh.position.set(-8.5, 15.5, -36.0);
        this.scene.add(moonMesh);

        // Soft Moon Atmospheric Halo
        const haloGeo = new THREE.SphereGeometry(8.6, 32, 32);
        const matHalo = new THREE.MeshBasicMaterial({
          color: 0x608ad8,
          transparent: true,
          opacity: 0.18,
          blending: THREE.AdditiveBlending,
          side: THREE.BackSide
        });
        const haloMesh = new THREE.Mesh(haloGeo, matHalo);
        haloMesh.position.copy(moonMesh.position);
        this.scene.add(haloMesh);

        // --- 6. Distant Mountain Silhouette Ranges ---
        const mountainMats = [
          new THREE.MeshBasicMaterial({ color: 0x121428 }),
          new THREE.MeshBasicMaterial({ color: 0x090a16 })
        ];

        for (let m = 0; m < 2; m++) {
          const numPeaks = 9;
          const dist = m === 0 ? 55 : 85;
          const yBase = m === 0 ? -12 : -18;
          for (let p = 0; p < numPeaks; p++) {
            const peakGeo = new THREE.ConeGeometry(14 + p * 3, 26 + (p % 4) * 8, 4);
            const peakMesh = new THREE.Mesh(peakGeo, mountainMats[m]);
            const angle = ((p - numPeaks / 2) * 0.28);
            peakMesh.position.set(
              Math.sin(angle) * dist,
              yBase + (p % 3) * 3,
              -Math.cos(angle) * dist
            );
            peakMesh.rotation.y = p * 0.8;
            this.scene.add(peakMesh);
          }
        }

        // --- 7. Twinkling Starfield ---
        const starCount = 1400;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        const paletteStars = [
          new THREE.Color(0xffffff),
          new THREE.Color(0xb2d4ff),
          new THREE.Color(0x8ee8ff),
          new THREE.Color(0xffd5a3)
        ];

        for (let i = 0; i < starCount; i++) {
          const theta = rng.next() * Math.PI * 2;
          const phi = Math.acos(rng.next() * 0.95);
          const r = 95 + rng.next() * 15;

          starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          starPositions[i * 3 + 1] = r * Math.cos(phi) - 2;
          starPositions[i * 3 + 2] = -Math.abs(r * Math.sin(phi) * Math.sin(theta));

          const col = paletteStars[Math.floor(rng.next() * paletteStars.length)];
          starColors[i * 3] = col.r;
          starColors[i * 3 + 1] = col.g;
          starColors[i * 3 + 2] = col.b;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const matStar = new THREE.PointsMaterial({
          size: 1.3,
          vertexColors: true,
          transparent: true,
          opacity: 0.82,
          map: Textures.createSparkleSprite(),
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        this.starsMesh = new THREE.Points(starGeo, matStar);
        this.scene.add(this.starsMesh);

        // --- 8. Ground Mist Layers ---
        for (let i = 0; i < 3; i++) {
          const mistGeo = new THREE.PlaneGeometry(36, 36);
          const matMist = new THREE.MeshBasicMaterial({
            color: 0x141e38,
            transparent: true,
            opacity: 0.10 - i * 0.025,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const mistPlane = new THREE.Mesh(mistGeo, matMist);
          mistPlane.rotation.x = -Math.PI / 2;
          mistPlane.position.set(0, 0.1 + i * 0.35, 0);
          this.scene.add(mistPlane);
          this.mistPlanes.push(mistPlane);
        }
      }

      update(time, chargeIntensity) {
        if (this.runesMesh) {
          this.runesMesh.rotation.z = time * 0.05;
          const baseAlpha = 0.20 + 0.05 * Math.sin(time * 2.0);
          this.runesMesh.material.opacity = baseAlpha + chargeIntensity * 0.35;
        }

        this.mistPlanes.forEach((plane, idx) => {
          plane.rotation.z = time * (0.015 + idx * 0.01);
        });

        if (this.starsMesh) {
          this.starsMesh.material.size = 1.2 + 0.25 * Math.sin(time * 3.5);
        }
      }

      triggerImpactFlash() {
        if (this.monolithLight) {
          this.monolithLight.intensity = 24.0;
        }
        this.monolithRunes.forEach((r) => {
          r.material.emissiveIntensity = 8.0;
        });
      }

      decayImpactLight(dt) {
        if (this.monolithLight && this.monolithLight.intensity > 0.01) {
          this.monolithLight.intensity = THREE.MathUtils.lerp(this.monolithLight.intensity, 0, dt * 6.0);
        }
        this.monolithRunes.forEach((r) => {
          if (r.material.emissiveIntensity > 1.2) {
            r.material.emissiveIntensity = THREE.MathUtils.lerp(r.material.emissiveIntensity, 1.2, dt * 5.0);
          }
        });
      }

      dispose() {
        if (this.stoneTex) this.stoneTex.dispose();
        if (this.runeTex) this.runeTex.dispose();
        if (this.moonTex) this.moonTex.dispose();
      }
    }

    // =========================================================================
    // 5. MAGIC & PARTICLE SYSTEM (Phase 0 Defect Repairs & Bounds Safety)
    // =========================================================================
    const _scratchVec1 = new THREE.Vector3();
    const _scratchVec2 = new THREE.Vector3();
    const _scratchDir = new THREE.Vector3();
    const _burstOrigin = new THREE.Vector3();
    const _burstDir = new THREE.Vector3();
    const _burstNoise = new THREE.Vector3();
    const _burstVel = new THREE.Vector3();

    class ParticleEngine {
      constructor(scene) {
        this.scene = scene;
        this.glowTex = Textures.createGlowSprite();
        this.sparkTex = Textures.createSparkleSprite();

        // 1. Inward Spiral Vortex Particles
        this.MAX_VORTEX = 280;
        this.vortexGeo = new THREE.BufferGeometry();
        this.vortexPos = new Float32Array(this.MAX_VORTEX * 3);
        this.vortexCol = new Float32Array(this.MAX_VORTEX * 3);
        this.vortexRadii = new Float32Array(this.MAX_VORTEX);
        this.vortexAngles = new Float32Array(this.MAX_VORTEX);
        this.vortexY = new Float32Array(this.MAX_VORTEX);
        this.vortexSpeed = new Float32Array(this.MAX_VORTEX);

        for (let i = 0; i < this.MAX_VORTEX; i++) {
          this.resetVortexParticle(i, 0);
          this.vortexPos[i * 3] = 0;
          this.vortexPos[i * 3 + 1] = -100;
          this.vortexPos[i * 3 + 2] = 0;
        }

        this.vortexGeo.setAttribute('position', new THREE.BufferAttribute(this.vortexPos, 3));
        this.vortexGeo.setAttribute('color', new THREE.BufferAttribute(this.vortexCol, 3));

        const matVortex = new THREE.PointsMaterial({
          size: 1.1,
          vertexColors: true,
          transparent: true,
          opacity: 0.9,
          map: this.glowTex,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        this.vortexPoints = new THREE.Points(this.vortexGeo, matVortex);
        // Phase 0: Disable frustum culling to prevent stale bounds from culling active particles
        this.vortexPoints.frustumCulled = false;
        this.vortexPoints.visible = false;
        this.scene.add(this.vortexPoints);

        // 2. High-Velocity Sparks Pool
        this.MAX_SPARKS = 220;
        this.sparks = [];
        const sparkGeo = new THREE.BufferGeometry();
        this.sparkPos = new Float32Array(this.MAX_SPARKS * 3);
        this.sparkCol = new Float32Array(this.MAX_SPARKS * 3);
        sparkGeo.setAttribute('position', new THREE.BufferAttribute(this.sparkPos, 3));
        sparkGeo.setAttribute('color', new THREE.BufferAttribute(this.sparkCol, 3));

        for (let i = 0; i < this.MAX_SPARKS; i++) {
          this.sparks.push({
            active: false,
            pos: new THREE.Vector3(0, -100, 0),
            vel: new THREE.Vector3(),
            life: 0,
            maxLife: 1.0,
            color: new THREE.Color()
          });
          this.sparkPos[i * 3 + 1] = -100;
        }

        const matSparks = new THREE.PointsMaterial({
          size: 1.4,
          vertexColors: true,
          transparent: true,
          opacity: 1.0,
          map: this.sparkTex,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        this.sparkPoints = new THREE.Points(sparkGeo, matSparks);
        // Phase 0: Disable frustum culling on sparks pool
        this.sparkPoints.frustumCulled = false;
        this.sparkPoints.visible = false;
        this.scene.add(this.sparkPoints);

        // 3. Shockwave Expanding Rings
        this.shockwaves = [];
        for (let i = 0; i < 4; i++) {
          const ringGeo = new THREE.RingGeometry(0.1, 0.45, 32);
          const matRing = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const ringMesh = new THREE.Mesh(ringGeo, matRing);
          ringMesh.visible = false;
          this.scene.add(ringMesh);
          this.shockwaves.push({
            mesh: ringMesh,
            active: false,
            radius: 0.1,
            maxRadius: 6.5,
            life: 0,
            maxLife: 0.6
          });
        }
      }

      resetVortexParticle(i, gemPos) {
        this.vortexRadii[i] = 2.5 + rng.next() * 4.5;
        this.vortexAngles[i] = rng.next() * Math.PI * 2;
        this.vortexY[i] = (rng.next() - 0.5) * 3.5;
        this.vortexSpeed[i] = 1.6 + rng.next() * 3.2;

        const isElectric = rng.next() > 0.4;
        this.vortexCol[i * 3] = isElectric ? 0.3 : 0.8;
        this.vortexCol[i * 3 + 1] = isElectric ? 0.95 : 0.2;
        this.vortexCol[i * 3 + 2] = 1.0;
      }

      updateVortex(dt, gemPos, chargeIntensity) {
        if (chargeIntensity <= 0.01) {
          if (this.vortexPoints.visible) {
            this.vortexPoints.visible = false;
          }
          return;
        }

        this.vortexPoints.visible = true;

        for (let i = 0; i < this.MAX_VORTEX; i++) {
          this.vortexRadii[i] -= this.vortexSpeed[i] * dt * (1.0 + chargeIntensity * 2.5);
          this.vortexAngles[i] += (3.5 + chargeIntensity * 6.0) * dt;
          this.vortexY[i] *= Math.max(0, 1.0 - dt * 2.8);

          if (this.vortexRadii[i] <= 0.25) {
            this.resetVortexParticle(i, gemPos);
          }

          const r = this.vortexRadii[i];
          const a = this.vortexAngles[i];
          this.vortexPos[i * 3] = gemPos.x + Math.cos(a) * r;
          this.vortexPos[i * 3 + 1] = gemPos.y + this.vortexY[i];
          this.vortexPos[i * 3 + 2] = gemPos.z + Math.sin(a) * r;
        }

        this.vortexGeo.attributes.position.needsUpdate = true;
        // Phase 0: Mark color dirty so dynamic particle color variations reach GPU
        this.vortexGeo.attributes.color.needsUpdate = true;
      }

      spawnShockwave(pos, normal, maxRadius, duration, colorHex) {
        for (let i = 0; i < this.shockwaves.length; i++) {
          const sw = this.shockwaves[i];
          if (!sw.active) {
            sw.active = true;
            sw.radius = 0.2;
            sw.maxRadius = maxRadius;
            sw.life = 0;
            sw.maxLife = duration;
            sw.mesh.position.copy(pos);
            sw.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
            sw.mesh.material.color.setHex(colorHex || 0x00f0ff);
            sw.mesh.material.opacity = 0.95;
            sw.mesh.scale.set(1, 1, 1);
            sw.mesh.visible = true;
            return;
          }
        }
      }

      spawnBurst(pos, count, speed, spreadConeDir, colorHex) {
        // Dedicated storage: never alias or mutate input pos or callers' scratch vectors!
        _burstOrigin.copy(pos);

        let spawned = 0;
        if (spreadConeDir) {
          _burstDir.copy(spreadConeDir).normalize();
        }

        for (let i = 0; i < this.MAX_SPARKS; i++) {
          const sp = this.sparks[i];
          if (!sp.active) {
            sp.active = true;
            sp.pos.copy(_burstOrigin);
            sp.life = 0;
            sp.maxLife = 0.45 + rng.next() * 0.6;
            sp.color.setHex(colorHex || 0x00f0ff);

            if (spreadConeDir) {
              _burstNoise.set(
                (rng.next() - 0.5) * 0.9,
                (rng.next() - 0.5) * 0.9,
                (rng.next() - 0.5) * 0.9
              );
              _burstVel.copy(_burstDir).add(_burstNoise).normalize().multiplyScalar(speed * (0.6 + rng.next() * 0.8));
              sp.vel.copy(_burstVel);
            } else {
              const theta = rng.next() * Math.PI * 2;
              const phi = Math.acos(rng.next() * 2 - 1);
              sp.vel.set(
                Math.sin(phi) * Math.cos(theta),
                Math.sin(phi) * Math.sin(theta),
                Math.cos(phi)
              ).multiplyScalar(speed * (0.4 + rng.next() * 0.9));
            }

            spawned++;
            if (spawned >= count) break;
          }
        }
      }

      getActiveSparkCount() {
        let count = 0;
        for (let i = 0; i < this.MAX_SPARKS; i++) {
          if (this.sparks[i].active) count++;
        }
        return count;
      }

      updateSparks(dt) {
        let activeCount = 0;
        for (let i = 0; i < this.MAX_SPARKS; i++) {
          const sp = this.sparks[i];
          if (sp.active) {
            activeCount++;
            sp.life += dt;
            if (sp.life >= sp.maxLife) {
              sp.active = false;
              this.sparkPos[i * 3 + 1] = -100;
              continue;
            }

            sp.vel.y -= 7.5 * dt;
            sp.vel.multiplyScalar(0.96);
            sp.pos.addScaledVector(sp.vel, dt);

            if (sp.pos.y < 0.05) {
              sp.pos.y = 0.05;
              sp.vel.y *= -0.45;
            }

            const alpha = 1.0 - sp.life / sp.maxLife;
            this.sparkPos[i * 3] = sp.pos.x;
            this.sparkPos[i * 3 + 1] = sp.pos.y;
            this.sparkPos[i * 3 + 2] = sp.pos.z;

            this.sparkCol[i * 3] = sp.color.r * alpha;
            this.sparkCol[i * 3 + 1] = sp.color.g * alpha;
            this.sparkCol[i * 3 + 2] = sp.color.b * alpha;
          }
        }

        // Toggle spark cloud visibility to skip drawing inactive particles
        this.sparkPoints.visible = activeCount > 0;
        if (activeCount > 0) {
          this.sparkPoints.geometry.attributes.position.needsUpdate = true;
          this.sparkPoints.geometry.attributes.color.needsUpdate = true;
        }

        this.shockwaves.forEach((sw) => {
          if (sw.active) {
            sw.life += dt;
            const progress = sw.life / sw.maxLife;
            if (progress >= 1.0) {
              sw.active = false;
              sw.mesh.visible = false;
            } else {
              const currentR = THREE.MathUtils.lerp(0.2, sw.maxRadius, Math.sin(progress * Math.PI * 0.5));
              sw.mesh.scale.set(currentR, currentR, currentR);
              sw.mesh.material.opacity = (1.0 - progress) * 0.9;
            }
          }
        });
      }

      dispose() {
        if (this.vortexGeo) this.vortexGeo.dispose();
        if (this.vortexPoints && this.vortexPoints.material) this.vortexPoints.material.dispose();
        if (this.sparkPoints) {
          if (this.sparkPoints.geometry) this.sparkPoints.geometry.dispose();
          if (this.sparkPoints.material) this.sparkPoints.material.dispose();
        }
        this.shockwaves.forEach(sw => {
          if (sw.mesh.geometry) sw.mesh.geometry.dispose();
          if (sw.mesh.material) sw.mesh.material.dispose();
        });
        if (this.glowTex) this.glowTex.dispose();
        if (this.sparkTex) this.sparkTex.dispose();
      }
    }

    // =========================================================================
    // 6. HIGH-POWER PROJECTILE SYSTEM (Phase 0 Trail Reset & Launch Correctness)
    // =========================================================================
    class ProjectileSystem {
      constructor(scene, particles, env) {
        this.scene = scene;
        this.particles = particles;
        this.env = env;

        this.group = new THREE.Group();
        this.group.visible = false;
        this.scene.add(this.group);

        const coreGeo = new THREE.SphereGeometry(0.42, 16, 16);
        const matCore = new THREE.MeshBasicMaterial({ color: 0xffffff });
        this.coreMesh = new THREE.Mesh(coreGeo, matCore);
        this.group.add(this.coreMesh);

        const haloGeo = new THREE.SphereGeometry(0.85, 16, 16);
        const matHalo = new THREE.MeshBasicMaterial({
          color: 0x00f0ff,
          transparent: true,
          opacity: 0.65,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        this.haloMesh = new THREE.Mesh(haloGeo, matHalo);
        this.group.add(this.haloMesh);

        const filamentGeo = new THREE.TorusGeometry(0.75, 0.06, 6, 24);
        const matFilament = new THREE.MeshBasicMaterial({
          color: 0x67ffeb,
          wireframe: true
        });
        this.filament1 = new THREE.Mesh(filamentGeo, matFilament);
        this.filament2 = new THREE.Mesh(filamentGeo, matFilament);
        this.filament2.rotation.x = Math.PI / 2;
        this.group.add(this.filament1);
        this.group.add(this.filament2);

        this.light = new THREE.PointLight(0x00f0ff, 6.0, 18, 1.8);
        this.group.add(this.light);

        this.active = false;
        this.pos = new THREE.Vector3();
        this.vel = new THREE.Vector3();
        this.targetX = 10.5;
        this.trailTimer = 0;
      }

      launch(originPos, targetPos) {
        this.active = true;
        this.group.visible = true;
        this.pos.copy(originPos);
        this.group.position.copy(this.pos);

        // Phase 0: Reset projectile trail timer and state cleanly
        this.trailTimer = 0;

        _scratchDir.subVectors(targetPos, originPos).normalize();
        this.vel.copy(_scratchDir).multiplyScalar(28.0);
        this.targetX = targetPos.x;
      }

      update(dt) {
        if (!this.active) return;

        this.pos.addScaledVector(this.vel, dt);
        this.group.position.copy(this.pos);

        this.filament1.rotation.z += 18.0 * dt;
        this.filament2.rotation.y += 22.0 * dt;
        this.coreMesh.scale.setScalar(1.0 + 0.15 * Math.sin(this.pos.x * 8.0));

        // Spawn spark trail with protected vectors
        this.trailTimer += dt;
        if (this.trailTimer > 0.018) {
          this.trailTimer = 0;
          _scratchVec1.copy(this.pos);
          _scratchVec1.x -= 0.4;
          _scratchVec1.y += (rng.next() - 0.5) * 0.2;
          _scratchVec1.z += (rng.next() - 0.5) * 0.2;
          _scratchDir.set(-1, 0, 0);
          this.particles.spawnBurst(
            _scratchVec1,
            3,
            2.5,
            _scratchDir,
            0x00f0ff
          );
        }

        if (this.pos.x >= this.targetX) {
          this.detonate();
        }
      }

      detonate() {
        this.active = false;
        this.group.visible = false;

        const impactPoint = new THREE.Vector3(this.targetX, this.pos.y, this.pos.z);

        this.env.triggerImpactFlash();
        this.particles.spawnShockwave(impactPoint, new THREE.Vector3(1, 0, 0), 8.5, 0.75, 0x00f0ff);
        this.particles.spawnShockwave(impactPoint, new THREE.Vector3(0, 1, 0), 7.0, 0.65, 0x67ffeb);
        this.particles.spawnBurst(impactPoint, 95, 14.0, null, 0x00f0ff);
        this.particles.spawnBurst(impactPoint, 45, 8.5, null, 0xffffff);

        audio.playImpactBoom();

        if (window.director) {
          window.director.addTrauma(0.85);
        }

        if (window.app && window.app.eventCounts) {
          window.app.eventCounts.detonations++;
        }
      }
    }

    // =========================================================================
    // 7. CINEMATIC CAMERA DIRECTOR (Presets, Damping, Framing)
    // =========================================================================
    class CameraDirector {
      constructor(camera, domElement) {
        this.camera = camera;
        this.domElement = domElement;

        // Framing: Wizard positioned comfortably on the left (~55% viewport height)
        // with breathing room from border, clear line of fire to target on the right
        this.currentPos = new THREE.Vector3(-0.2, 3.4, 12.8);
        this.targetPos = new THREE.Vector3(-0.2, 3.4, 12.8);
        this.currentLookAt = new THREE.Vector3(1.4, 2.6, 0);
        this.targetLookAt = new THREE.Vector3(1.4, 2.6, 0);

        this.trauma = 0.0;
        this.shakeTimer = 0;
        this.mode = 'cinematic';

        this.orbitRadius = 14;
        this.orbitTheta = 0.24;
        this.orbitPhi = 1.35;
        this.isDragging = false;
        this.prevMouse = { x: 0, y: 0 };

        this.initMouseControls();
      }

      initMouseControls() {
        const onDown = (e) => {
          this.isDragging = true;
          this.prevMouse.x = e.clientX;
          this.prevMouse.y = e.clientY;
          if (this.mode !== 'orbit') {
            this.setPreset('orbit');
          }
        };

        const onMove = (e) => {
          if (!this.isDragging) return;
          const dx = e.clientX - this.prevMouse.x;
          const dy = e.clientY - this.prevMouse.y;
          this.prevMouse.x = e.clientX;
          this.prevMouse.y = e.clientY;

          this.orbitTheta -= dx * 0.007;
          this.orbitPhi = Math.max(0.2, Math.min(Math.PI * 0.48, this.orbitPhi - dy * 0.007));
          this.updateOrbitPosition();
        };

        const onUp = () => {
          this.isDragging = false;
        };

        const onWheel = (e) => {
          e.preventDefault();
          this.orbitRadius = Math.max(4, Math.min(28, this.orbitRadius + e.deltaY * 0.015));
          if (this.mode !== 'orbit') this.setPreset('orbit');
          this.updateOrbitPosition();
        };

        this.domElement.addEventListener('pointerdown', onDown);
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        this.domElement.addEventListener('wheel', onWheel, { passive: false });
      }

      updateOrbitPosition() {
        const x = this.targetLookAt.x + this.orbitRadius * Math.sin(this.orbitPhi) * Math.sin(this.orbitTheta);
        const y = this.targetLookAt.y + this.orbitRadius * Math.cos(this.orbitPhi);
        const z = this.targetLookAt.z + this.orbitRadius * Math.sin(this.orbitPhi) * Math.cos(this.orbitTheta);
        this.targetPos.set(x, y, z);
      }

      setPreset(name) {
        this.mode = name;
        document.querySelectorAll('.btn-chip[data-cam]').forEach((b) => {
          b.classList.toggle('active', b.dataset.cam === name);
        });

        switch (name) {
          case 'cinematic':
            // Cinematic: Balanced composition framing wizard (~55% height) with left margin and clear projectile path
            this.targetPos.set(-0.2, 3.4, 12.8);
            this.targetLookAt.set(1.4, 2.6, 0);
            break;
          case 'classic':
            // Classic: V1 tribute overview
            this.targetPos.set(2.5, 3.2, 16.0);
            this.targetLookAt.set(2.5, 2.8, 0);
            break;
          case 'hero':
            // Hero Portrait: Clear three-quarter portrait with readable face, flowing beard, ornate hat, staff alongside
            this.targetPos.set(-1.8, 3.4, 5.8);
            this.targetLookAt.set(-4.3, 3.2, 0.0);
            break;
          case 'target':
            // Target Monolith impact vantage
            this.targetPos.set(14.5, 3.2, 5.5);
            this.targetLookAt.set(7.5, 3.0, 0);
            break;
          case 'orbit':
            this.updateOrbitPosition();
            break;
        }
      }

      addTrauma(amount) {
        this.trauma = Math.min(1.0, this.trauma + amount);
      }

      update(dt, totalTime) {
        this.currentPos.lerp(this.targetPos, dt * 4.5);
        this.currentLookAt.lerp(this.targetLookAt, dt * 5.0);

        const driftX = this.mode === 'cinematic' ? Math.sin(totalTime * 0.4) * 0.25 : 0;
        const driftY = this.mode === 'cinematic' ? Math.cos(totalTime * 0.3) * 0.15 : 0;

        let shakeX = 0, shakeY = 0, shakeZ = 0;
        if (this.trauma > 0.001) {
          this.shakeTimer += dt * 36.0;
          const shakeFactor = this.trauma * this.trauma;
          shakeX = (Math.sin(this.shakeTimer * 1.3) + (rng.next() - 0.5) * 0.4) * 0.45 * shakeFactor;
          shakeY = (Math.cos(this.shakeTimer * 1.7) + (rng.next() - 0.5) * 0.4) * 0.45 * shakeFactor;
          shakeZ = (Math.sin(this.shakeTimer * 0.9)) * 0.28 * shakeFactor;

          this.trauma = Math.max(0, this.trauma - dt * 1.8);
        }

        this.camera.position.set(
          this.currentPos.x + driftX + shakeX,
          this.currentPos.y + driftY + shakeY,
          this.currentPos.z + shakeZ
        );

        this.camera.lookAt(
          this.currentLookAt.x + shakeX * 0.5,
          this.currentLookAt.y + shakeY * 0.5,
          this.currentLookAt.z
        );
      }
    }

    // =========================================================================
    // 8. MASTER APPLICATION & HDR POST-PROCESSING PIPELINE (Phases 1-3)
    // =========================================================================
    const STATE_IDLE = 0;
    const STATE_CHARGE = 1;
    const STATE_CAST = 2;
    const STATE_RECOVER = 3;

    // Render comparison modes
    const RENDER_MODE_COMPOSER_BLOOM_ON = 0;
    const RENDER_MODE_COMPOSER_BLOOM_OFF = 1;
    const RENDER_MODE_DIRECT = 2;

    class App {
      constructor() {
        this.canvas = document.getElementById('webgl-canvas');
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        // Modern WebGLRenderer with ACES tone mapping & explicit sRGB color space
        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: true,
          powerPreference: 'high-performance'
        });
        this.renderer.setSize(this.width, this.height);
        this.dpr = Math.min(window.devicePixelRatio || 1, 1.5); // Capped DPR per Astra spec
        this.renderer.setPixelRatio(this.dpr);

        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Color Management & ACES Tone Mapping
        this.renderer.outputColorSpace = THREE.SRGBColorSpace;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.0;

        // Scene, Background & Fog
        this.scene = new THREE.Scene();
        this.origBgColor = new THREE.Color(0x060514);
        this.directBgColor = computeAcesToneMappedColor(this.origBgColor, 1.0);
        this.scene.background = this.origBgColor;
        this.scene.fog = new THREE.FogExp2(0x070618, 0.024);

        // Perspective Camera
        this.camera = new THREE.PerspectiveCamera(46, this.width / this.height, 0.2, 300);

        // Procedural PMREM Environment Bake (Phase 2)
        this.initEnvironmentMap();

        // Lighting System
        this.initLighting();

        // Subsystems
        this.env = new EnvironmentBuilder(this.scene);
        this.wizard = new WizardCharacter(this.scene);
        this.characterAdapter = new CharacterAdapter(this.wizard);
        this.particles = new ParticleEngine(this.scene);
        this.projectiles = new ProjectileSystem(this.scene, this.particles, this.env);
        this.director = new CameraDirector(this.camera, this.canvas);
        window.director = this.director;
        window.app = this;

        // Post-Processing Pipeline (Phase 1)
        this.renderMode = RENDER_MODE_COMPOSER_BLOOM_ON;
        this.initPostProcessing();

        // State Machine Timing
        this.state = STATE_IDLE;
        this.stateTime = 0;
        this.totalTime = 0;
        this.timeScale = 1.0;
        this.autoLoop = true;

        this.DUR_IDLE = 2.0;
        this.DUR_CHARGE = 1.8;
        this.DUR_CAST = 1.3;
        this.DUR_RECOVER = 1.0;

        this.gemWorldPos = new THREE.Vector3();

        // Track event counts for Phase 0 inspection
        this.eventCounts = {
          casts: 0,
          releases: 0,
          detonations: 0
        };

        // UI references
        this.uiDot = document.getElementById('state-dot');
        this.uiText = document.getElementById('state-text');
        this.uiFill = document.getElementById('state-fill');
        this.btnRenderMode = document.getElementById('btn-render-mode');

        this.initEventListeners();
        this.updateUIState();

        // Initial Transform & Scalar Sanity Validation (Phase 0)
        this.validateInitialState();

        this.clock = new THREE.Clock();
        this.animate = this.animate.bind(this);
        this.animationFrameId = requestAnimationFrame(this.animate);

        // Expose inspection interface for Phase 0
        window.__WIZARD_V3__ = {
          app: this,
          getState: () => ({
            state: ['IDLE', 'CHARGE', 'CAST', 'RECOVER'][this.state],
            stateTime: this.stateTime,
            totalTime: this.totalTime,
            progress: this.getProgress(),
            renderMode: ['BLOOM_ON', 'BLOOM_OFF', 'DIRECT'][this.renderMode],
            vortexActive: this.particles.vortexPoints.visible,
            sparksActive: this.particles.sparkPoints.visible,
            gemPosition: this.gemWorldPos.toArray(),
            eventCounts: { ...this.eventCounts },
            poolOccupancy: {
              vortexActive: this.particles.vortexPoints.visible ? this.particles.MAX_VORTEX : 0,
              sparksActive: this.particles.getActiveSparkCount(),
              maxVortex: this.particles.MAX_VORTEX,
              maxSparks: this.particles.MAX_SPARKS
            },
            renderStatistics: {
              calls: this.renderer.info.render.calls,
              triangles: this.renderer.info.render.triangles,
              points: this.renderer.info.render.points,
              geometries: this.renderer.info.memory.geometries,
              textures: this.renderer.info.memory.textures
            }
          }),
          setRenderMode: (mode) => this.setRenderMode(mode),
          step: (dt = 1/60) => this.stepSimulation(dt)
        };
      }

      // Procedural PMREM Environment (Phase 2 - Provides gold specular catches without external HDRI)
      initEnvironmentMap() {
        const pmremGenerator = new THREE.PMREMGenerator(this.renderer);
        pmremGenerator.compileEquirectangularShader();

        const envScene = new THREE.Scene();
        envScene.background = new THREE.Color(0x0a0c1a);

        // Soft cool overhead card
        const topLight = new THREE.DirectionalLight(0x5a7ab5, 1.2);
        topLight.position.set(0, 10, 0);
        envScene.add(topLight);

        // Warm ground bounce
        const groundLight = new THREE.DirectionalLight(0x282035, 0.6);
        groundLight.position.set(0, -10, 0);
        envScene.add(groundLight);

        // Restrained rim card
        const sideLight = new THREE.DirectionalLight(0x405580, 0.8);
        sideLight.position.set(10, 4, -10);
        envScene.add(sideLight);

        this.envTexture = pmremGenerator.fromScene(envScene, 0.04).texture;
        this.scene.environment = this.envTexture;
        this.scene.environmentIntensity = 0.22;

        pmremGenerator.dispose();
      }

      initLighting() {
        // Ambient fill
        const ambLight = new THREE.AmbientLight(0x1e1a38, 0.50);
        this.scene.add(ambLight);

        // Moonlight key / shadow light (Calibrated shadow bounds for character & stage)
        this.moonLight = new THREE.DirectionalLight(0xd4e6ff, 1.5);
        this.moonLight.position.set(-8, 22, 14);
        this.moonLight.castShadow = true;
        this.moonLight.shadow.mapSize.width = 2048;
        this.moonLight.shadow.mapSize.height = 2048;
        this.moonLight.shadow.camera.near = 2.0;
        this.moonLight.shadow.camera.far = 65;
        this.moonLight.shadow.camera.left = -14;
        this.moonLight.shadow.camera.right = 14;
        this.moonLight.shadow.camera.top = 14;
        this.moonLight.shadow.camera.bottom = -14;
        this.moonLight.shadow.bias = -0.0005;
        this.moonLight.shadow.normalBias = 0.02;
        this.scene.add(this.moonLight);

        // Targeted frontal key/fill light to keep wizard face, beard, hat and robe clear and readable
        const frontFill = new THREE.DirectionalLight(0x7c94ca, 0.95);
        frontFill.position.set(-2.0, 5.5, 10.5);
        this.scene.add(frontFill);

        // Subtle character accent fill to bring out peach skin and deep plum robe folds
        const charFill = new THREE.PointLight(0xa56885, 0.55, 10, 1.8);
        charFill.position.set(-4.2, 2.2, 3.2);
        this.scene.add(charFill);

        // Soft under-brim portrait fill light to ensure face, eye sockets, and beard are clearly readable
        const faceFill = new THREE.PointLight(0xeef4ff, 1.2, 8, 2.0);
        faceFill.position.set(-3.2, 3.4, 2.4);
        this.scene.add(faceFill);

        // Cool silvery rim light for character silhouette (associated with visible moon behind scene)
        const rimLight = new THREE.DirectionalLight(0x8eb2f5, 1.40);
        rimLight.position.set(-9.0, 16.0, -18.0);
        rimLight.target.position.set(-4.5, 3.2, 0.0);
        this.scene.add(rimLight.target);
        this.scene.add(rimLight);
      }

      // HDR Post-Processing Pipeline (Phase 1)
      initPostProcessing() {
        const w = this.width;
        const h = this.height;

        // Half-float render target with 4x MSAA
        this.renderTarget = new THREE.WebGLRenderTarget(w, h, {
          type: THREE.HalfFloatType,
          format: THREE.RGBAFormat,
          samples: 4
        });

        this.composer = new EffectComposer(this.renderer, this.renderTarget);
        this.composer.setPixelRatio(this.dpr);
        this.composer.setSize(w, h);

        // 1. Scene RenderPass
        this.renderPass = new RenderPass(this.scene, this.camera);
        this.composer.addPass(this.renderPass);

        // 2. Restrained UnrealBloomPass (threshold 1.1, strength 0.35, radius 0.35)
        // High threshold ensures bloom only catches the gem, magical runes and sparks!
        this.bloomPass = new UnrealBloomPass(
          new THREE.Vector2(w * this.dpr, h * this.dpr),
          0.35, // strength
          0.35, // radius
          1.10  // threshold
        );
        this.composer.addPass(this.bloomPass);

        // 3. OutputPass for ACES tone mapping & sRGB conversion
        this.outputPass = new OutputPass();
        this.composer.addPass(this.outputPass);
      }

      setRenderMode(mode) {
        this.renderMode = mode;
        const labels = ['Mode: Bloom ON', 'Mode: Bloom OFF', 'Mode: Direct'];
        this.btnRenderMode.textContent = labels[this.renderMode];

        if (this.renderMode === RENDER_MODE_COMPOSER_BLOOM_ON) {
          this.bloomPass.enabled = true;
        } else if (this.renderMode === RENDER_MODE_COMPOSER_BLOOM_OFF) {
          this.bloomPass.enabled = false;
        }
      }

      cycleRenderMode() {
        const nextMode = (this.renderMode + 1) % 3;
        this.setRenderMode(nextMode);
      }

      resizeRendering() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio || 1, 1.5);

        this.camera.aspect = this.width / this.height;
        this.camera.updateProjectionMatrix();

        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(this.dpr);

        if (this.composer) {
          this.composer.setPixelRatio(this.dpr);
          this.composer.setSize(this.width, this.height);
          this.bloomPass.resolution.set(this.width * this.dpr, this.height * this.dpr);
        }
      }

      validateInitialState() {
        // Phase 0: Validate that all initial transforms and lights are finite (no NaNs)
        const checkFinite = (val, name) => {
          if (!Number.isFinite(val)) {
            console.error(`Non-finite transform/scalar detected in ${name}:`, val);
          }
        };

        checkFinite(this.wizard.group.position.x, 'wizard.group.position.x');
        checkFinite(this.wizard.nodes.body.position.y, 'wizard.nodes.body.position.y');
        checkFinite(this.wizard.nodes.gemMesh.material.emissiveIntensity, 'gemMesh.emissiveIntensity');
        checkFinite(this.wizard.nodes.gemLight.intensity, 'gemLight.intensity');
        checkFinite(this.moonLight.intensity, 'moonLight.intensity');
      }

      initEventListeners() {
        window.addEventListener('resize', () => this.resizeRendering());

        const btnCast = document.getElementById('btn-cast-now');
        const triggerCast = () => {
          audio.handleUserInteraction();
          if (this.state === STATE_IDLE || this.state === STATE_RECOVER) {
            this.setState(STATE_CHARGE);
          } else if (this.state === STATE_CHARGE) {
            this.setState(STATE_CAST);
          }
        };

        window.addEventListener('pointerdown', () => audio.handleUserInteraction());
        btnCast.addEventListener('click', triggerCast);

        window.addEventListener('keydown', (e) => {
          audio.handleUserInteraction();
          if (e.code === 'Space') {
            e.preventDefault();
            triggerCast();
          } else if (e.code === 'KeyH') {
            document.getElementById('ui-container').classList.toggle('ui-hidden');
          } else if (e.code === 'KeyP') {
            this.cycleRenderMode();
          }
        });

        this.btnRenderMode.addEventListener('click', () => this.cycleRenderMode());

        document.querySelectorAll('.btn-chip[data-cam]').forEach((btn) => {
          btn.addEventListener('click', () => this.director.setPreset(btn.dataset.cam));
        });

        document.querySelectorAll('.btn-chip[data-speed]').forEach((btn) => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.btn-chip[data-speed]').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            this.timeScale = parseFloat(btn.dataset.speed);
          });
        });

        const btnLoop = document.getElementById('btn-loop');
        btnLoop.addEventListener('click', () => {
          this.autoLoop = !this.autoLoop;
          btnLoop.classList.toggle('active', this.autoLoop);
        });

        const btnAudio = document.getElementById('btn-audio');
        btnAudio.addEventListener('click', () => {
          const isEnabled = audio.toggle();
          btnAudio.textContent = isEnabled ? '🔊' : '🔇';
          btnAudio.classList.toggle('active', isEnabled);
        });

        const btnUI = document.getElementById('btn-ui-toggle');
        btnUI.addEventListener('click', () => {
          document.getElementById('ui-container').classList.toggle('ui-hidden');
        });
      }

      setState(newState) {
        this.state = newState;
        this.stateTime = 0;
        this.updateUIState();

        if (this.state === STATE_CHARGE) {
          this.eventCounts.casts++;
          audio.playChargeStart(this.DUR_CHARGE / this.timeScale);
        } else if (this.state === STATE_CAST) {
          this.eventCounts.releases++;
          this.wizard.setPoseCast(0.10, this.totalTime);
          this.wizard.getGemWorldPosition(this.gemWorldPos);

          audio.playCastBurst();
          this.director.addTrauma(0.85);

          this.particles.spawnShockwave(
            this.gemWorldPos,
            new THREE.Vector3(1, 0, 0),
            5.5,
            0.5,
            0x00f0ff
          );

          this.particles.spawnBurst(
            this.gemWorldPos,
            75,
            12.0,
            new THREE.Vector3(1, 0.15, 0),
            0x00f0ff
          );

          const targetPos = new THREE.Vector3(11.0, 3.5, 0);
          this.projectiles.launch(this.gemWorldPos, targetPos);
        }
      }

      updateUIState() {
        const stateConfig = [
          { name: 'IDLE', color: '#7388aa' },
          { name: 'CHARGE', color: '#00f0ff' },
          { name: 'CAST', color: '#ff3d85' },
          { name: 'RECOVER', color: '#ffd147' }
        ];

        const cfg = stateConfig[this.state];
        this.uiText.textContent = cfg.name;
        this.uiText.style.color = cfg.color;
        this.uiDot.style.background = cfg.color;
        this.uiDot.style.boxShadow = `0 0 12px ${cfg.color}`;
      }

      getProgress() {
        switch (this.state) {
          case STATE_IDLE: return this.stateTime / this.DUR_IDLE;
          case STATE_CHARGE: return this.stateTime / this.DUR_CHARGE;
          case STATE_CAST: return this.stateTime / this.DUR_CAST;
          case STATE_RECOVER: return this.stateTime / this.DUR_RECOVER;
          default: return 0;
        }
      }

      stepSimulation(dt) {
        this.totalTime += dt;
        this.stateTime += dt;

        let chargeIntensity = 0.0;
        let progress = 0.0;

        switch (this.state) {
          case STATE_IDLE:
            progress = this.stateTime / this.DUR_IDLE;
            this.wizard.setPoseIdle(progress, this.totalTime);
            chargeIntensity = 0.0;
            if (this.autoLoop && this.stateTime >= this.DUR_IDLE) {
              this.setState(STATE_CHARGE);
            }
            break;

          case STATE_CHARGE:
            progress = this.stateTime / this.DUR_CHARGE;
            chargeIntensity = progress;
            this.wizard.setPoseCharge(progress, this.totalTime);
            if (this.stateTime >= this.DUR_CHARGE) {
              this.setState(STATE_CAST);
            }
            break;

          case STATE_CAST:
            progress = this.stateTime / this.DUR_CAST;
            this.wizard.setPoseCast(progress, this.totalTime);
            chargeIntensity = Math.max(0, 1.0 - progress * 2.0);
            if (this.stateTime >= this.DUR_CAST) {
              this.setState(STATE_RECOVER);
            }
            break;

          case STATE_RECOVER:
            progress = this.stateTime / this.DUR_RECOVER;
            this.wizard.setPoseRecover(progress, this.totalTime);
            chargeIntensity = 0.0;
            if (this.stateTime >= this.DUR_RECOVER) {
              this.setState(STATE_IDLE);
            }
            break;
        }

        this.wizard.getGemWorldPosition(this.gemWorldPos);

        const displayProgress = this.autoLoop
          ? Math.min(100, Math.max(0, progress * 100))
          : (this.state === STATE_IDLE ? 0 : Math.min(100, Math.max(0, progress * 100)));
        this.uiFill.style.width = `${displayProgress}%`;

        this.particles.updateVortex(dt, this.gemWorldPos, chargeIntensity);
        this.projectiles.update(dt);
        this.particles.updateSparks(dt);
        this.env.update(this.totalTime, chargeIntensity);
        this.env.decayImpactLight(dt);
        this.director.update(dt, this.totalTime);
      }

      renderFrame() {
        if (this.renderMode === RENDER_MODE_DIRECT) {
          // Direct render bypass with matching tone-mapped background clear color
          this.scene.background = this.directBgColor;
          this.renderer.render(this.scene, this.camera);
        } else {
          // EffectComposer pipeline (Bloom ON or Bloom OFF with OutputPass conversion)
          this.scene.background = this.origBgColor;
          this.composer.render();
        }
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(this.animate);
        const rawDt = this.clock.getDelta();
        const dt = Math.min(rawDt, 0.1) * this.timeScale;
        this.stepSimulation(dt);
        this.renderFrame();
      }

      dispose() {
        if (this.animationFrameId) {
          cancelAnimationFrame(this.animationFrameId);
        }
        if (this.characterAdapter) {
          this.characterAdapter.dispose();
        }
        if (this.composer) {
          this.composer.dispose();
        }
        if (this.renderTarget) {
          this.renderTarget.dispose();
        }
        if (this.envTexture) {
          this.envTexture.dispose();
        }
        if (this.particles) {
          this.particles.dispose();
        }
        if (this.env) {
          this.env.dispose();
        }
        if (this.renderer) {
          this.renderer.dispose();
        }
      }
    }

    // Launch Application
    window.addEventListener('DOMContentLoaded', () => {
      try {
        new App();
      } catch (err) {
        console.error('Fatal initialization error in Wizard V3:', err);
        const banner = document.createElement('div');
        banner.style.position = 'fixed';
        banner.style.top = '50%';
        banner.style.left = '50%';
        banner.style.transform = 'translate(-50%, -50%)';
        banner.style.padding = '24px 36px';
        banner.style.background = 'rgba(15, 10, 32, 0.96)';
        banner.style.border = '2px solid #ff3875';
        banner.style.borderRadius = '14px';
        banner.style.color = '#ffffff';
        banner.style.textAlign = 'center';
        banner.style.zIndex = '99999';
        banner.innerHTML = `
          <h2 style="font-size:22px;color:#ff3875;margin-bottom:12px;">Initialization Error</h2>
          <p style="color:#c5d8f7;font-size:14px;line-height:1.6;max-width:440px;">
            ${err.message || 'WebGL2 or Three.js module load failed.'}
          </p>
        `;
        document.body.appendChild(banner);
      }
    });
  </script>
</body>
</html>
