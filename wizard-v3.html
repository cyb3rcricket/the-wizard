        if (this.localRunesMesh) {
          if (this.localRunesMesh.geometry) this.localRunesMesh.geometry.dispose();
          if (this.localRunesMesh.material) this.localRunesMesh.material.dispose();
        }
      }
    }

    // =========================================================================
    // 5. MAGIC & PARTICLE SYSTEM (Phase 5 Charge VFX & Phase 6 Hero VFX)
    // =========================================================================
    const _scratchVec1 = new THREE.Vector3();
    const _scratchVec2 = new THREE.Vector3();
    const _scratchDir = new THREE.Vector3();
    const _burstOrigin = new THREE.Vector3();
    const _burstDir = new THREE.Vector3();
    const _burstNoise = new THREE.Vector3();
    const _burstVel = new THREE.Vector3();
    const _trailSide = new THREE.Vector3();
    const _trailCamDir = new THREE.Vector3();
    const _trailSegDir = new THREE.Vector3();
    const _zAxis = new THREE.Vector3(0, 0, 1);
    const _yAxis = new THREE.Vector3(0, 1, 0);
    const _defaultCamPos = new THREE.Vector3(0, 3, 12);

    class ParticleEngine {
      constructor(scene) {
        this.scene = scene;
        this.glowTex = Textures.createGlowSprite();
        this.sparkTex = Textures.createSparkleSprite();

        // --- Phase 5: Bounded Inward Vortex Pool with Dual Roles & Per-Particle Shader ---
        this.MAX_VORTEX = 280;
        this.vortexGeo = new THREE.BufferGeometry();
        this.vortexPos = new Float32Array(this.MAX_VORTEX * 3);
        this.vortexCol = new Float32Array(this.MAX_VORTEX * 3);
        this.vortexSize = new Float32Array(this.MAX_VORTEX);
        this.vortexAlpha = new Float32Array(this.MAX_VORTEX);

        this.vortexRadii = new Float32Array(this.MAX_VORTEX);
        this.vortexAngles = new Float32Array(this.MAX_VORTEX);
        this.vortexY = new Float32Array(this.MAX_VORTEX);
        this.vortexSpeed = new Float32Array(this.MAX_VORTEX);
        this.vortexPath = new Uint8Array(this.MAX_VORTEX); // 0, 1, 2 (3 intentional orbit paths)
        this.vortexRole = new Uint8Array(this.MAX_VORTEX); // 0 = inward spark (80%), 1 = soft wisp (20%)

        for (let i = 0; i < this.MAX_VORTEX; i++) {
          this.vortexRole[i] = i >= 224 ? 1 : 0; // 80% sparks, 20% soft wisps
          this.vortexPath[i] = i % 3;
          this.resetVortexParticle(i, 0, 0);
          this.vortexPos[i * 3] = 0;
          this.vortexPos[i * 3 + 1] = -100;
          this.vortexPos[i * 3 + 2] = 0;
          this.vortexAlpha[i] = 0.0;
        }

        this.vortexGeo.setAttribute('position', new THREE.BufferAttribute(this.vortexPos, 3));
        this.vortexGeo.setAttribute('color', new THREE.BufferAttribute(this.vortexCol, 3));
        this.vortexGeo.setAttribute('aSize', new THREE.BufferAttribute(this.vortexSize, 1));
        this.vortexGeo.setAttribute('aAlpha', new THREE.BufferAttribute(this.vortexAlpha, 1));

        // Custom ShaderMaterial providing per-particle size, alpha, and additive HDR bloom contribution
        const matVortex = new THREE.ShaderMaterial({
          uniforms: {
            uTexture: { value: this.glowTex }
          },
          vertexShader: `
            attribute float aSize;
            attribute float aAlpha;
            varying vec3 vColor;
            varying float vAlpha;
            void main() {
              vColor = color;
              vAlpha = aAlpha;
              vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
              gl_PointSize = aSize * (190.0 / -mvPos.z);
              gl_Position = projectionMatrix * mvPos;
            }
          `,
          fragmentShader: `
            uniform sampler2D uTexture;
            varying vec3 vColor;
            varying float vAlpha;
            void main() {
              vec4 tex = texture2D(uTexture, gl_PointCoord);
              gl_FragColor = vec4(vColor * tex.rgb, tex.a * vAlpha);
            }
          `,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          vertexColors: true
        });

        this.vortexPoints = new THREE.Points(this.vortexGeo, matVortex);
        this.vortexPoints.frustumCulled = false;
        this.vortexPoints.visible = false;
        this.scene.add(this.vortexPoints);

        // --- Phase 5: Luminous Orbital Ribbon Arc around Gem ---
        const arcSegs = 28;
        const arcGeo = new THREE.BufferGeometry();
        const arcPositions = new Float32Array((arcSegs + 1) * 2 * 3);
        const arcColors = new Float32Array((arcSegs + 1) * 2 * 3);
        const arcIndices = [];

        const arcSpan = Math.PI * 1.35; // 243 degree graceful arc
        for (let i = 0; i <= arcSegs; i++) {
          const t = i / arcSegs;
          const angle = t * arcSpan;
          const rInner = 0.52;
          const rOuter = 0.68;
          const xIn = Math.cos(angle) * rInner;
          const zIn = Math.sin(angle) * rInner;
          const xOut = Math.cos(angle) * rOuter;
          const zOut = Math.sin(angle) * rOuter;

          const vIdx = i * 2;
          arcPositions[vIdx * 3] = xIn;
          arcPositions[vIdx * 3 + 1] = 0;
          arcPositions[vIdx * 3 + 2] = zIn;

          arcPositions[(vIdx + 1) * 3] = xOut;
          arcPositions[(vIdx + 1) * 3 + 1] = 0;
          arcPositions[(vIdx + 1) * 3 + 2] = zOut;

          const taper = Math.sin(t * Math.PI);
          const colR = 0.2 + 0.8 * taper;
          const colG = 0.9 + 0.1 * taper;
          const colB = 1.0;

          arcColors[vIdx * 3] = colR;
          arcColors[vIdx * 3 + 1] = colG;
          arcColors[vIdx * 3 + 2] = colB;

          arcColors[(vIdx + 1) * 3] = colR * 0.7;
          arcColors[(vIdx + 1) * 3 + 1] = colG * 0.7;
          arcColors[(vIdx + 1) * 3 + 2] = colB * 0.7;

          if (i < arcSegs) {
            arcIndices.push(vIdx, vIdx + 1, vIdx + 2);
            arcIndices.push(vIdx + 1, vIdx + 3, vIdx + 2);
          }
        }
        arcGeo.setAttribute('position', new THREE.BufferAttribute(arcPositions, 3));
        arcGeo.setAttribute('color', new THREE.BufferAttribute(arcColors, 3));
        arcGeo.setIndex(arcIndices);

        const arcMat = new THREE.MeshBasicMaterial({
          vertexColors: true,
          transparent: true,
          opacity: 0.0,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        });
        this.orbitalArc = new THREE.Mesh(arcGeo, arcMat);
        this.orbitalArc.visible = false;
        this.orbitRibbonMesh = this.orbitalArc;
        this.scene.add(this.orbitalArc);

        // --- Phase 6: High-Velocity Sparks Pool with Priority Policy ---
        this.MAX_SPARKS = 220;
        this.sparks = [];
        const sparkGeo = new THREE.BufferGeometry();
        this.sparkPos = new Float32Array(this.MAX_SPARKS * 3);
        this.sparkCol = new Float32Array(this.MAX_SPARKS * 3);
        sparkGeo.setAttribute('position', new THREE.BufferAttribute(this.sparkPos, 3));
        sparkGeo.setAttribute('color', new THREE.BufferAttribute(this.sparkCol, 3));

        for (let i = 0; i < this.MAX_SPARKS; i++) {
          this.sparks.push({
            active: false,
            priority: 0, // 0 = low priority (trail sparks), 1 = hero (release/impact)
            pos: new THREE.Vector3(0, -100, 0),
            vel: new THREE.Vector3(),
            life: 0,
            maxLife: 1.0,
            color: new THREE.Color()
          });
          this.sparkPos[i * 3 + 1] = -100;
        }

        const matSparks = new THREE.PointsMaterial({
          size: 1.35,
          vertexColors: true,
          transparent: true,
          opacity: 1.0,
          map: this.sparkTex,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        this.sparkPoints = new THREE.Points(sparkGeo, matSparks);
        this.sparkPoints.frustumCulled = false;
        this.sparkPoints.visible = false;
        this.scene.add(this.sparkPoints);

        // --- Phase 6: Unit-Radius Shockwave Expanding Rings ---
        // Base geometry has outer radius = 1.0, so scale directly equals world-unit radius!
        this.shockwaves = [];
        for (let i = 0; i < 4; i++) {
          const ringGeo = new THREE.RingGeometry(0.1, 1.0, 32);
          const matRing = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const ringMesh = new THREE.Mesh(ringGeo, matRing);
          ringMesh.visible = false;
          this.scene.add(ringMesh);
          this.shockwaves.push({
            mesh: ringMesh,
            active: false,
            radius: 0.1,
            maxRadius: 6.5,
            life: 0,
            maxLife: 0.55
          });
        }

        // --- Phase 6: Dark Stone Debris Chips Pool (Preallocated 12 chips) ---
        this.MAX_CHIPS = 12;
        this.chips = [];
        const chipGeo = new THREE.DodecahedronGeometry(0.08, 0);
        const chipMat = new THREE.MeshStandardMaterial({
          color: 0x242833, // Muted slate stone
          roughness: 0.95,
          metalness: 0.0
        });

        for (let i = 0; i < 12; i++) {
          const chipMesh = new THREE.Mesh(chipGeo, chipMat);
          chipMesh.visible = false;
          chipMesh.castShadow = true;
          this.scene.add(chipMesh);
          this.chips.push({
            mesh: chipMesh,
            active: false,
            pos: new THREE.Vector3(),
            vel: new THREE.Vector3(),
            rotVel: new THREE.Vector3(),
            life: 0,
            maxLife: 0.85
          });
        }

        this.releaseClearing = false;
        this.releaseClearTimer = 0;
      }

      resetVortexParticle(i, gemPos, chargeEnergy) {
        const isWisp = this.vortexRole[i] === 1;

        if (chargeEnergy >= 0.80) {
          // Peak charge: tightly compressed field
          this.vortexRadii[i] = 0.35 + rng.next() * 0.75;
        } else {
          this.vortexRadii[i] = 2.2 + rng.next() * 3.2;
        }

        this.vortexAngles[i] = rng.next() * Math.PI * 2;
        this.vortexY[i] = (rng.next() - 0.5) * (isWisp ? 2.4 : 1.6);
        this.vortexSpeed[i] = isWisp ? (1.0 + rng.next() * 1.5) : (2.4 + rng.next() * 3.2);

        if (isWisp) {
          // Soft atmospheric wisps: faint violet/blue outer accents
          this.vortexCol[i * 3] = 0.45;
          this.vortexCol[i * 3 + 1] = 0.35;
          this.vortexCol[i * 3 + 2] = 0.95;
          this.vortexSize[i] = 2.6 + rng.next() * 1.4;
          this.vortexAlpha[i] = 0.45;
        } else {
          // Small inward sparks: tiny near-white core & dominant cyan
          const isWhiteCore = rng.next() > 0.65;
          this.vortexCol[i * 3] = isWhiteCore ? 0.92 : 0.15;
          this.vortexCol[i * 3 + 1] = isWhiteCore ? 0.98 : 0.92;
          this.vortexCol[i * 3 + 2] = 1.0;
          this.vortexSize[i] = 1.0 + rng.next() * 0.6;
          this.vortexAlpha[i] = 0.85;
        }
      }

      updateVortex(dt, gemPos, chargeEnergy, isReleased) {
        if (isReleased) {
          // Phase 5 Release Cleanup: Rapidly clear visual space around staff within 0.15s
          this.releaseClearing = true;
          this.releaseClearTimer += dt;
          if (this.orbitalArc) this.orbitalArc.visible = false;

          let anyVisible = false;
          for (let i = 0; i < this.MAX_VORTEX; i++) {
            this.vortexAlpha[i] = Math.max(0, this.vortexAlpha[i] - dt * 6.5);
            if (this.vortexAlpha[i] > 0.01) {
              anyVisible = true;
              this.vortexRadii[i] += this.vortexSpeed[i] * dt * 2.5; // disperse outwards
              const a = this.vortexAngles[i];
              const r = this.vortexRadii[i];
              this.vortexPos[i * 3] = gemPos.x + Math.cos(a) * r;
              this.vortexPos[i * 3 + 1] = gemPos.y + this.vortexY[i];
              this.vortexPos[i * 3 + 2] = gemPos.z + Math.sin(a) * r;
            } else {
              this.vortexPos[i * 3 + 1] = -100;
            }
          }

          this.vortexPoints.visible = anyVisible;
          if (anyVisible) {
            this.vortexGeo.attributes.position.needsUpdate = true;
            this.vortexGeo.attributes.aAlpha.needsUpdate = true;
          }
          return;
        }

        this.releaseClearing = false;
        this.releaseClearTimer = 0;

        if (chargeEnergy <= 0.005) {
          if (this.vortexPoints.visible) {
            this.vortexPoints.visible = false;
          }
          if (this.orbitalArc) {
            this.orbitalArc.visible = false;
          }
          return;
        }

        this.vortexPoints.visible = true;

        // Target active particle population based on choreography curve
        // 0–30%: ~40–70; 30–80%: ~70–170; 80–100%: ~180–220 compressed!
        let targetActive = 40;
        if (chargeEnergy < 0.25) {
          targetActive = Math.round(40 + (chargeEnergy / 0.25) * 35);
        } else if (chargeEnergy < 0.80) {
          const u = (chargeEnergy - 0.25) / 0.55;
          targetActive = Math.round(75 + u * 105);
        } else {
          const u = (chargeEnergy - 0.80) / 0.20;
          targetActive = Math.round(180 + u * 35);
        }

        const isCompressing = chargeEnergy >= 0.80;

        for (let i = 0; i < this.MAX_VORTEX; i++) {
          if (i >= targetActive) {
            this.vortexPos[i * 3 + 1] = -100;
            this.vortexAlpha[i] = 0;
            continue;
          }

          const isWisp = this.vortexRole[i] === 1;
          const path = this.vortexPath[i];

          // Angular velocity & inward progression
          const angSpeed = (3.2 + chargeEnergy * 7.5) * (path === 1 ? -1.0 : 1.0);
          this.vortexAngles[i] += angSpeed * dt;

          if (isCompressing) {
            // Phase 5: Peak Charge Compression — Outer field thins, core tightens toward gem
            const targetR = 0.25 + (i / targetActive) * 0.65;
            this.vortexRadii[i] = THREE.MathUtils.lerp(this.vortexRadii[i], targetR, dt * 5.5);
            this.vortexY[i] *= Math.max(0, 1.0 - dt * 5.0);
          } else {
            this.vortexRadii[i] -= this.vortexSpeed[i] * dt * (0.85 + chargeEnergy * 2.2);
            this.vortexY[i] *= Math.max(0, 1.0 - dt * 2.2);
          }

          if (this.vortexRadii[i] <= 0.20) {
            this.resetVortexParticle(i, gemPos, chargeEnergy);
          }

          const r = this.vortexRadii[i];
          const a = this.vortexAngles[i];
          const y = this.vortexY[i];

          // 3 Distinct Orbital Paths with varying inclination & tilt
          let px = 0, py = 0, pz = 0;
          if (path === 0) {
            // Path 0: Gentle equatorial inclination (~18 deg)
            px = Math.cos(a) * r;
            py = y + Math.sin(a) * r * 0.31;
            pz = Math.sin(a) * r * 0.95;
          } else if (path === 1) {
            // Path 1: Steep inclined plane (~58 deg, counter-rotating)
            px = Math.cos(a) * r * 0.53;
            py = y + Math.sin(a) * r * 0.85;
            pz = Math.cos(a) * r * 0.85;
          } else {
            // Path 2: Polar ascending/descending spiral (~-42 deg)
            px = Math.cos(a) * r * 0.74;
            py = y - Math.sin(a) * r * 0.67;
            pz = Math.sin(a) * r * 0.74;
          }

          this.vortexPos[i * 3] = gemPos.x + px;
          this.vortexPos[i * 3 + 1] = gemPos.y + py;
          this.vortexPos[i * 3 + 2] = gemPos.z + pz;

          // Alpha fade near core and outer boundary
          const distNorm = THREE.MathUtils.clamp((r - 0.2) / 2.0, 0, 1);
          const baseAlpha = isWisp ? 0.45 : 0.85;
          this.vortexAlpha[i] = baseAlpha * Math.sin(distNorm * Math.PI) * Math.min(1.0, chargeEnergy * 1.5);
        }

        this.vortexGeo.attributes.position.needsUpdate = true;
        this.vortexGeo.attributes.color.needsUpdate = true;
        this.vortexGeo.attributes.aSize.needsUpdate = true;
        this.vortexGeo.attributes.aAlpha.needsUpdate = true;

        // Update Orbital Arc Mesh
        if (this.orbitalArc) {
          this.orbitalArc.visible = true;
          this.orbitalArc.position.copy(gemPos);
          this.orbitalArc.rotation.z += (2.2 + chargeEnergy * 7.0) * dt;
          this.orbitalArc.rotation.x = 0.35 + Math.sin(this.orbitalArc.rotation.z * 0.5) * 0.1;
          const arcScale = THREE.MathUtils.lerp(1.15, 0.55, chargeEnergy);
          this.orbitalArc.scale.set(arcScale, arcScale, arcScale);
          this.orbitalArc.material.opacity = Math.min(0.85, chargeEnergy * 0.95);
        }
      }

      onRelease(gemPos, dir) {
        // Stop gathering vortex and clear staff space immediately
        this.releaseClearing = true;
        if (this.orbitalArc) this.orbitalArc.visible = false;

        // Directional flash shockwave aligned to spell direction
        this.spawnShockwave(gemPos, dir, 3.8, 0.35, 0x00f0ff);

        // Focused directional cone burst forward (45 sparks)
        this.spawnBurst(gemPos, 45, 14.0, dir, 0x00f0ff, 1);
      }

      onImpact(impactPoint, normal) {
        // Stage 1: Compact near-white flash (0-0.06s)
        this.spawnBurst(impactPoint, 45, 10.0, null, 0xffffff, 1);

        // Stage 2: Surface-facing shockwave aligned strictly to monolith strike normal (with z-offset to avoid z-fighting)
        this.spawnShockwave(impactPoint, normal, 6.5, 0.45, 0x00f0ff, 0.04);

        // Stage 2: Outward directional sparks reflected off monolith face into scene
        // (normal is outward-facing (-1,0,0); do NOT invert into monolith wall)
        this.spawnBurst(impactPoint, 70, 13.5, normal, 0x00f0ff, 1);

        // Stage 3: Ground ring centered at ground height (y = 0.05), aligned to +Y (with z-offset)
        _scratchVec2.set(impactPoint.x - 1.2, 0.05, impactPoint.z);
        this.spawnShockwave(_scratchVec2, _yAxis, 5.5, 0.55, 0x67ffeb, 0.02);

        // Stage 3: Dark stone debris chips tumbling from monolith outward into scene
        this.spawnDebrisChips(impactPoint, normal);

        // Stage 4: Lingering embers fading over 0.2-0.9s
        this.spawnBurst(impactPoint, 30, 3.5, null, 0x4dfcff, 1);
      }

      spawnShockwave(pos, normal, maxRadius, duration, colorHex, normalOffset = 0.04) {
        for (let i = 0; i < this.shockwaves.length; i++) {
          const sw = this.shockwaves[i];
          if (!sw.active) {
            sw.active = true;
            sw.radius = 0.15;
            sw.maxRadius = maxRadius;
            sw.life = 0;
            sw.maxLife = duration;
            _scratchDir.copy(normal).normalize();
            sw.mesh.position.copy(pos).addScaledVector(_scratchDir, normalOffset);
            sw.mesh.quaternion.setFromUnitVectors(_zAxis, _scratchDir);
            sw.mesh.material.color.setHex(colorHex || 0x00f0ff);
            sw.mesh.material.opacity = 0.95;
            sw.mesh.scale.set(0.15, 0.15, 0.15);
            sw.mesh.visible = true;
            return;
          }
        }
      }

      spawnBurst(pos, count, speed, spreadConeDir, colorHex, priority = 0) {
        _burstOrigin.copy(pos);
        if (spreadConeDir) {
          _burstDir.copy(spreadConeDir).normalize();
        }

        let spawned = 0;

        // If pool is near capacity and priority is high (hero effect), recycle low-priority sparks first
        for (let pass = 0; pass < 2; pass++) {
          for (let i = 0; i < this.MAX_SPARKS; i++) {
            const sp = this.sparks[i];
            const canUse = !sp.active || (pass === 1 && sp.priority === 0 && priority > 0);

            if (canUse) {
              sp.active = true;
              sp.priority = priority;
              sp.pos.copy(_burstOrigin);
              sp.life = 0;
              sp.maxLife = 0.35 + rng.next() * 0.45;
              sp.color.setHex(colorHex || 0x00f0ff);

              if (spreadConeDir) {
                _burstNoise.set(
                  (rng.next() - 0.5) * 0.75,
                  (rng.next() - 0.5) * 0.75,
                  (rng.next() - 0.5) * 0.75
                );
                _burstVel.copy(_burstDir).add(_burstNoise).normalize().multiplyScalar(speed * (0.65 + rng.next() * 0.7));
                sp.vel.copy(_burstVel);
              } else {
                const theta = rng.next() * Math.PI * 2;
                const phi = Math.acos(rng.next() * 2 - 1);
                sp.vel.set(
                  Math.sin(phi) * Math.cos(theta),
                  Math.sin(phi) * Math.sin(theta),
                  Math.cos(phi)
                ).multiplyScalar(speed * (0.4 + rng.next() * 0.8));
              }

              spawned++;
              if (spawned >= count) return;
            }
          }
        }
        if (spawned < count) {
          this.droppedSparksCount = (this.droppedSparksCount || 0) + (count - spawned);
        }
      }

      spawnDebrisChips(impactPoint, dir) {
        for (let i = 0; i < this.chips.length; i++) {
          const chip = this.chips[i];
          chip.active = true;
          chip.life = 0;
          chip.maxLife = 0.75 + rng.next() * 0.25;
          chip.pos.copy(impactPoint);
          chip.mesh.position.copy(chip.pos);

          _burstNoise.set(
            (rng.next() - 0.5) * 0.8,
            rng.next() * 0.6 + 0.2, // bias upwards
            (rng.next() - 0.5) * 0.8
          );
          chip.vel.copy(dir).add(_burstNoise).normalize().multiplyScalar(4.5 + rng.next() * 4.5);
          chip.rotVel.set(
            (rng.next() - 0.5) * 12.0,
            (rng.next() - 0.5) * 12.0,
            (rng.next() - 0.5) * 12.0
          );
          chip.mesh.visible = true;
        }
      }

      getActiveSparkCount() {
        let count = 0;
        for (let i = 0; i < this.MAX_SPARKS; i++) {
          if (this.sparks[i].active) count++;
        }
        return count;
      }

      updateSparks(dt) {
        let activeCount = 0;
        const dragFactor = Math.exp(-2.2 * dt);

        for (let i = 0; i < this.MAX_SPARKS; i++) {
          const sp = this.sparks[i];
          if (sp.active) {
            activeCount++;
            sp.life += dt;
            if (sp.life >= sp.maxLife) {
              sp.active = false;
              this.sparkPos[i * 3 + 1] = -100;
              continue;
            }

            sp.vel.y -= 8.5 * dt;
            sp.vel.multiplyScalar(dragFactor);
            sp.pos.addScaledVector(sp.vel, dt);

            if (sp.pos.y < 0.05) {
              sp.pos.y = 0.05;
              sp.vel.y *= -0.45;
              sp.vel.x *= 0.8;
              sp.vel.z *= 0.8;
            }

            const alpha = Math.max(0, 1.0 - sp.life / sp.maxLife);
            this.sparkPos[i * 3] = sp.pos.x;
            this.sparkPos[i * 3 + 1] = sp.pos.y;
            this.sparkPos[i * 3 + 2] = sp.pos.z;

            this.sparkCol[i * 3] = sp.color.r * alpha;
            this.sparkCol[i * 3 + 1] = sp.color.g * alpha;
            this.sparkCol[i * 3 + 2] = sp.color.b * alpha;
          }
        }

        this.sparkPoints.visible = activeCount > 0;
        if (activeCount > 0) {
          this.sparkPoints.geometry.attributes.position.needsUpdate = true;
          this.sparkPoints.geometry.attributes.color.needsUpdate = true;
        }

        // Update Shockwaves (using exact world-unit scaling)
        this.shockwaves.forEach((sw) => {
          if (sw.active) {
            sw.life += dt;
            const progress = sw.life / sw.maxLife;
            if (progress >= 1.0) {
              sw.active = false;
              sw.mesh.visible = false;
            } else {
              const currentR = THREE.MathUtils.lerp(0.15, sw.maxRadius, Math.sin(progress * Math.PI * 0.5));
              sw.mesh.scale.set(currentR, currentR, currentR);
              sw.mesh.material.opacity = (1.0 - progress) * 0.92;
            }
          }
        });

        // Update Debris Chips
        this.chips.forEach((chip) => {
          if (chip.active) {
            chip.life += dt;
            if (chip.life >= chip.maxLife) {
              chip.active = false;
              chip.mesh.visible = false;
            } else {
              chip.vel.y -= 14.0 * dt;
              chip.pos.addScaledVector(chip.vel, dt);

              if (chip.pos.y < 0.05) {
                chip.pos.y = 0.05;
                chip.vel.y *= -0.40;
                chip.vel.x *= 0.70;
                chip.vel.z *= 0.70;
              }

              chip.mesh.position.copy(chip.pos);
              chip.mesh.rotation.x += chip.rotVel.x * dt;
              chip.mesh.rotation.y += chip.rotVel.y * dt;
              chip.mesh.rotation.z += chip.rotVel.z * dt;
            }
          }
        });
      }

      dispose() {
        if (this.vortexGeo) this.vortexGeo.dispose();
        if (this.vortexPoints && this.vortexPoints.material) this.vortexPoints.material.dispose();
        if (this.orbitalArc) {
          if (this.orbitalArc.geometry) this.orbitalArc.geometry.dispose();
          if (this.orbitalArc.material) this.orbitalArc.material.dispose();
        }
        if (this.sparkPoints) {
          if (this.sparkPoints.geometry) this.sparkPoints.geometry.dispose();
          if (this.sparkPoints.material) this.sparkPoints.material.dispose();
        }
        this.shockwaves.forEach(sw => {
          if (sw.mesh.geometry) sw.mesh.geometry.dispose();
          if (sw.mesh.material) sw.mesh.material.dispose();
        });
        this.chips.forEach(c => {
          if (c.mesh.geometry) c.mesh.geometry.dispose();
          if (c.mesh.material) c.mesh.material.dispose();
        });
        if (this.glowTex) this.glowTex.dispose();
        if (this.sparkTex) this.sparkTex.dispose();
      }
    }

    // =========================================================================
    // 6. HERO PROJECTILE & CAMERA-FACING RIBBON TRAIL SYSTEM (Phase 6)
    // =========================================================================
    class ProjectileSystem {
      constructor(scene, particles, env) {
        this.scene = scene;
        this.particles = particles;
        this.env = env;

        this.group = new THREE.Group();
        this.group.visible = false;
        this.scene.add(this.group);

        // Directional Projectile Core: Elongated spindle aligned with velocity
        const coreGeo = new THREE.CylinderGeometry(0.06, 0.22, 1.1, 12);
        coreGeo.rotateX(Math.PI / 2); // Orient along Z
        const matCore = new THREE.MeshBasicMaterial({ color: 0xffffff });
        this.coreMesh = new THREE.Mesh(coreGeo, matCore);
        this.group.add(this.coreMesh);

        // Restrained Directional Plasma Envelope (depthWrite: false, depthTest: true)
        const envelopeGeo = new THREE.CylinderGeometry(0.14, 0.42, 1.35, 12);
        envelopeGeo.rotateX(Math.PI / 2);
        const matEnvelope = new THREE.MeshBasicMaterial({
          color: 0x00f0ff,
          transparent: true,
          opacity: 0.65,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          depthTest: true
        });
        this.envelopeMesh = new THREE.Mesh(envelopeGeo, matEnvelope);
        this.group.add(this.envelopeMesh);

        // Rotating Energy Filament Rings
        const filamentGeo = new THREE.TorusGeometry(0.55, 0.04, 6, 20);
        const matFilament = new THREE.MeshBasicMaterial({
          color: 0x67ffeb,
          wireframe: true
        });
        this.filament1 = new THREE.Mesh(filamentGeo, matFilament);
        this.filament2 = new THREE.Mesh(filamentGeo, matFilament);
        this.filament2.rotation.x = Math.PI / 2;
        this.group.add(this.filament1);
        this.group.add(this.filament2);

        this.light = new THREE.PointLight(0x00f0ff, 6.0, 16, 1.8);
        this.group.add(this.light);

        // --- Phase 6: Preallocated 48-Sample Camera-Facing Ribbon Strip ---
        this.MAX_TRAIL = 48;
        this.trailPoints = new Float32Array(this.MAX_TRAIL * 3);
        this.trailAges = new Float32Array(this.MAX_TRAIL);
        this.trailCount = 0;

        // Ribbon strip geometry: 48 pairs of vertices = 96 vertices, 47 quads = 94 triangles
        this.ribbonGeo = new THREE.BufferGeometry();
        this.ribbonPositions = new Float32Array(this.MAX_TRAIL * 2 * 3);
        this.ribbonColors = new Float32Array(this.MAX_TRAIL * 2 * 3);
        const ribbonIndices = [];

        for (let i = 0; i < this.MAX_TRAIL - 1; i++) {
          const v = i * 2;
          ribbonIndices.push(v, v + 1, v + 2);
          ribbonIndices.push(v + 1, v + 3, v + 2);
        }

        this.ribbonGeo.setAttribute('position', new THREE.BufferAttribute(this.ribbonPositions, 3));
        this.ribbonGeo.setAttribute('color', new THREE.BufferAttribute(this.ribbonColors, 3));
        this.ribbonGeo.setIndex(ribbonIndices);

        const ribbonMat = new THREE.MeshBasicMaterial({
          vertexColors: true,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          depthTest: true,
          side: THREE.DoubleSide
        });
        this.ribbonMesh = new THREE.Mesh(this.ribbonGeo, ribbonMat);
        this.ribbonMesh.frustumCulled = false;
        this.ribbonMesh.visible = false;
        this.scene.add(this.ribbonMesh);

        this.active = false;
        this.justLaunched = false;
        this.originPos = new THREE.Vector3();
        this.targetPos = new THREE.Vector3();
        this.targetNormal = new THREE.Vector3(-1, 0, 0);
        this.pos = new THREE.Vector3();
        this.dir = new THREE.Vector3();
        this.speed = 28.0; // Astra specified nominal speed
        this.totalDistance = 0;
        this.traveledDistance = 0;
        this.lastSamplePos = new THREE.Vector3();
        this.trailSparkRemainder = 0;
        this.castId = 0;

        this.pendingImpact = null;
      }

      launch(originPos, targetPos, targetNormal, castId) {
        if (this.active) return; // Do not permit a new active projectile to overwrite an old one
        this.active = true;
        this.justLaunched = true;
        this.castId = castId;
        this.group.visible = true;

        this.originPos.copy(originPos);
        this.targetPos.copy(targetPos);
        this.targetNormal.copy(targetNormal || new THREE.Vector3(-1, 0, 0));
        this.pos.copy(originPos);
        this.group.position.copy(this.pos);

        this.dir.subVectors(targetPos, originPos).normalize();
        this.totalDistance = originPos.distanceTo(targetPos);
        this.traveledDistance = 0;

        // Orient core and plasma envelope along velocity
        this.group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), this.dir);

        // Reset ribbon trail history cleanly
        this.trailCount = 1;
        this.trailPoints[0] = originPos.x;
        this.trailPoints[1] = originPos.y;
        this.trailPoints[2] = originPos.z;
        this.trailAges[0] = 0;
        this.lastSamplePos.copy(originPos);
        this.trailSparkRemainder = 0;

        this.ribbonMesh.visible = true;
        this.pendingImpact = null;
      }

      addTrailPoint(x, y, z) {
        if (this.trailCount < this.MAX_TRAIL) {
          // Shift existing points back
          for (let i = this.trailCount; i > 0; i--) {
            this.trailPoints[i * 3] = this.trailPoints[(i - 1) * 3];
            this.trailPoints[i * 3 + 1] = this.trailPoints[(i - 1) * 3 + 1];
            this.trailPoints[i * 3 + 2] = this.trailPoints[(i - 1) * 3 + 2];
            this.trailAges[i] = this.trailAges[i - 1];
          }
          this.trailCount++;
        } else {
          for (let i = this.MAX_TRAIL - 1; i > 0; i--) {
            this.trailPoints[i * 3] = this.trailPoints[(i - 1) * 3];
            this.trailPoints[i * 3 + 1] = this.trailPoints[(i - 1) * 3 + 1];
            this.trailPoints[i * 3 + 2] = this.trailPoints[(i - 1) * 3 + 2];
            this.trailAges[i] = this.trailAges[i - 1];
          }
        }
        this.trailPoints[0] = x;
        this.trailPoints[1] = y;
        this.trailPoints[2] = z;
        this.trailAges[0] = 0;
      }

      update(dt, camera) {
        // 1. Advance active ribbon samples aging
        for (let i = 0; i < this.trailCount; i++) {
          this.trailAges[i] += dt;
        }

        // Cull expired samples (>0.25s)
        while (this.trailCount > 1 && this.trailAges[this.trailCount - 1] > 0.25) {
          this.trailCount--;
        }

        if (this.active) {
          if (this.justLaunched) {
            // Birth step at simulation boundary: position strictly at origin coinciding with gem (distance 0.0000)
            this.justLaunched = false;
            this.group.position.copy(this.pos);
          } else {
            const stepDist = this.speed * dt;

            if (this.traveledDistance + stepDist >= this.totalDistance) {
              // Exact impact contact resolution (interpolated endpoint crossing!)
              this.traveledDistance = this.totalDistance;
              this.pos.copy(this.targetPos);
              this.addTrailPoint(this.pos.x, this.pos.y, this.pos.z);

              this.active = false;
              this.group.visible = false;

              // Queue impact event once for SpellDirector dispatch
              this.pendingImpact = {
                castId: this.castId,
                point: this.targetPos.clone(),
                normal: this.targetNormal.clone()
              };
            } else {
              // Travel along line of fire
              this.traveledDistance += stepDist;
              this.pos.lerpVectors(this.originPos, this.targetPos, this.traveledDistance / this.totalDistance);
              this.group.position.copy(this.pos);

              // Resample trail distance: add samples every ~0.18 units
              const distSinceLast = this.pos.distanceTo(this.lastSamplePos);
              const sampleThreshold = 0.18;

              if (distSinceLast >= sampleThreshold) {
                const numSamples = Math.min(6, Math.floor(distSinceLast / sampleThreshold));
                for (let s = 1; s <= numSamples; s++) {
                  const subT = s / numSamples;
                  _scratchVec1.lerpVectors(this.lastSamplePos, this.pos, subT);
                  this.addTrailPoint(_scratchVec1.x, _scratchVec1.y, _scratchVec1.z);
                }
                this.lastSamplePos.copy(this.pos);
              }

              // Sparse residual trail sparks along travel segment with remainder preserved
              this.trailSparkRemainder += dt * 38.0;
              const sparkCount = Math.floor(this.trailSparkRemainder);
              if (sparkCount > 0) {
                this.trailSparkRemainder -= sparkCount;
                _scratchVec1.copy(this.pos).addScaledVector(this.dir, -0.4);
                _scratchVec1.x += (rng.next() - 0.5) * 0.15;
                _scratchVec1.y += (rng.next() - 0.5) * 0.15;
                _scratchVec1.z += (rng.next() - 0.5) * 0.15;
                _scratchDir.copy(this.dir).multiplyScalar(-1.0);
                this.particles.spawnBurst(_scratchVec1, sparkCount, 2.8, _scratchDir, 0x00f0ff, 0);
              }

              // Core visual rotations
              this.filament1.rotation.z += 16.0 * dt;
              this.filament2.rotation.x += 18.0 * dt;
              this.coreMesh.scale.set(1.0, 1.0, 1.0 + 0.15 * Math.sin(this.traveledDistance * 4.0));
            }
          }
        }

        // 2. Construct camera-facing ribbon strip vertices
        this.updateRibbonMesh(camera);
      }

      updateRibbonMesh(camera) {
        if (this.trailCount < 2) {
          this.ribbonMesh.visible = false;
          return;
        }

        this.ribbonMesh.visible = true;
        const camPos = camera ? camera.position : _defaultCamPos;

        for (let i = 0; i < this.trailCount; i++) {
          const px = this.trailPoints[i * 3];
          const py = this.trailPoints[i * 3 + 1];
          const pz = this.trailPoints[i * 3 + 2];
          const age = this.trailAges[i];
          const f = i / (this.trailCount - 1);

          // Vector to camera
          _trailCamDir.set(camPos.x - px, camPos.y - py, camPos.z - pz).normalize();

          // Segment travel direction
          if (i === 0) {
            _trailSegDir.set(
              px - this.trailPoints[3],
              py - this.trailPoints[4],
              pz - this.trailPoints[5]
            ).normalize();
          } else {
            _trailSegDir.set(
              this.trailPoints[(i - 1) * 3] - px,
              this.trailPoints[(i - 1) * 3 + 1] - py,
              this.trailPoints[(i - 1) * 3 + 2] - pz
            ).normalize();
          }

          // Camera-facing strip lateral perpendicular: normalize(dir x toCamera)
          _trailSide.crossVectors(_trailSegDir, _trailCamDir).normalize();

          // Tapered width from 0.34 at head down to 0 at tail
          const ageFade = Math.max(0, 1.0 - age / 0.25);
          const halfWidth = 0.17 * (1.0 - f * 0.85) * ageFade;

          const vIdx = i * 2;
          this.ribbonPositions[vIdx * 3] = px + _trailSide.x * halfWidth;
          this.ribbonPositions[vIdx * 3 + 1] = py + _trailSide.y * halfWidth;
          this.ribbonPositions[vIdx * 3 + 2] = pz + _trailSide.z * halfWidth;

          this.ribbonPositions[(vIdx + 1) * 3] = px - _trailSide.x * halfWidth;
          this.ribbonPositions[(vIdx + 1) * 3 + 1] = py - _trailSide.y * halfWidth;
          this.ribbonPositions[(vIdx + 1) * 3 + 2] = pz - _trailSide.z * halfWidth;

          // Tapered Alpha: 1.0 at head down to 0 at tail & age decay
          const alpha = (1.0 - f * 0.95) * ageFade;
          const colR = 0.2 + (1.0 - f) * 0.8;
          const colG = 0.95;
          const colB = 1.0;

          this.ribbonColors[vIdx * 3] = colR * alpha;
          this.ribbonColors[vIdx * 3 + 1] = colG * alpha;
          this.ribbonColors[vIdx * 3 + 2] = colB * alpha;

          this.ribbonColors[(vIdx + 1) * 3] = colR * alpha;
          this.ribbonColors[(vIdx + 1) * 3 + 1] = colG * alpha;
          this.ribbonColors[(vIdx + 1) * 3 + 2] = colB * alpha;
        }

        this.ribbonGeo.setDrawRange(0, (this.trailCount - 1) * 6);
        this.ribbonGeo.attributes.position.needsUpdate = true;
        this.ribbonGeo.attributes.color.needsUpdate = true;
      }

      consumeImpact() {
        const imp = this.pendingImpact;
        this.pendingImpact = null;
        return imp;
      }

      dispose() {
        if (this.ribbonGeo) this.ribbonGeo.dispose();
        if (this.ribbonMesh && this.ribbonMesh.material) this.ribbonMesh.material.dispose();
        if (this.coreMesh && this.coreMesh.geometry) this.coreMesh.geometry.dispose();
        if (this.envelopeMesh && this.envelopeMesh.geometry) this.envelopeMesh.geometry.dispose();
      }
    }

    // =========================================================================
    // 7. CINEMATIC CAMERA DIRECTOR (Phase 7 Camera & Cinematic Response)
    // =========================================================================
    class CameraDirector {
      constructor(camera, domElement) {
        this.camera = camera;
        this.domElement = domElement;

        // Base preset transforms kept strictly separate from dynamic spell offsets
        this.basePos = new THREE.Vector3(-0.2, 3.4, 12.8);
        this.baseLookAt = new THREE.Vector3(1.4, 2.6, 0);
        this.baseFov = 46.0;

        this.currentPos = this.basePos.clone();
        this.targetPos = this.basePos.clone();
        this.currentLookAt = this.baseLookAt.clone();
        this.targetLookAt = this.baseLookAt.clone();

        // Dynamic spell offsets (recalculated each frame, zeroed at rest)
        this.spellOffsetPos = new THREE.Vector3();
        this.spellOffsetLookAt = new THREE.Vector3();
        this.spellFovOffset = 0.0;
        this._viewDir = new THREE.Vector3();

        this.trauma = 0.0;
        this.shakeTimer = 0;
        this.mode = 'cinematic';

        // Check reduced motion user preference (Phase 7 requirement)
        this.reducedMotion = false;
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            this.reducedMotion = true;
          }
        } catch (e) {}

        this.orbitRadius = 14;
        this.orbitTheta = 0.24;
        this.orbitPhi = 1.35;
        this.isDragging = false;
        this.prevMouse = { x: 0, y: 0 };

        this.initMouseControls();
      }

      initMouseControls() {
        const onDown = (e) => {
          this.isDragging = true;
          this.prevMouse.x = e.clientX;
          this.prevMouse.y = e.clientY;
          if (this.mode !== 'orbit') {
            this.setPreset('orbit');
          }
        };

        const onMove = (e) => {
          if (!this.isDragging) return;
          const dx = e.clientX - this.prevMouse.x;
          const dy = e.clientY - this.prevMouse.y;
          this.prevMouse.x = e.clientX;
          this.prevMouse.y = e.clientY;

          this.orbitTheta -= dx * 0.007;
          this.orbitPhi = Math.max(0.2, Math.min(Math.PI * 0.48, this.orbitPhi - dy * 0.007));
          this.updateOrbitPosition();
        };

        const onUp = () => {
          this.isDragging = false;
        };

        const onWheel = (e) => {
          e.preventDefault();
          this.orbitRadius = Math.max(4, Math.min(28, this.orbitRadius + e.deltaY * 0.015));
          if (this.mode !== 'orbit') this.setPreset('orbit');
          this.updateOrbitPosition();
        };

        this.domElement.addEventListener('pointerdown', onDown);
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        this.domElement.addEventListener('wheel', onWheel, { passive: false });
      }

      updateOrbitPosition() {
        const x = this.targetLookAt.x + this.orbitRadius * Math.sin(this.orbitPhi) * Math.sin(this.orbitTheta);
        const y = this.targetLookAt.y + this.orbitRadius * Math.cos(this.orbitPhi);
        const z = this.targetLookAt.z + this.orbitRadius * Math.sin(this.orbitPhi) * Math.cos(this.orbitTheta);
        this.basePos.set(x, y, z);
        this.targetPos.set(x, y, z);
        // Suppress scripted offsets immediately in orbit
        this.spellOffsetPos.set(0, 0, 0);
        this.spellOffsetLookAt.set(0, 0, 0);
        this.spellFovOffset = 0.0;
      }

      setPreset(name) {
        this.mode = name;
        document.querySelectorAll('.btn-chip[data-cam]').forEach((b) => {
          b.classList.toggle('active', b.dataset.cam === name);
        });

        // Set base preset transforms (never modified by spell animations)
        switch (name) {
          case 'cinematic':
            this.basePos.set(-0.2, 3.4, 12.8);
            this.baseLookAt.set(1.4, 2.6, 0);
            this.baseFov = 46.0;
            break;
          case 'classic':
            this.basePos.set(2.5, 3.2, 16.0);
            this.baseLookAt.set(2.5, 2.8, 0);
            this.baseFov = 46.0;
            break;
          case 'hero':
            this.basePos.set(-1.8, 3.4, 5.8);
            this.baseLookAt.set(-4.3, 3.2, 0.0);
            this.baseFov = 46.0;
            break;
          case 'target':
            this.basePos.set(14.5, 3.2, 5.5);
            this.baseLookAt.set(7.5, 3.0, 0);
            this.baseFov = 46.0;
            break;
          case 'orbit':
            this.updateOrbitPosition();
            break;
        }

        // When switching preset, reset scripted offsets immediately
        this.spellOffsetPos.set(0, 0, 0);
        this.spellOffsetLookAt.set(0, 0, 0);
        this.spellFovOffset = 0.0;
        this.targetPos.copy(this.basePos);
        this.targetLookAt.copy(this.baseLookAt);
      }

      addTrauma(amount) {
        if (this.reducedMotion) return;
        this.trauma = Math.min(1.0, this.trauma + amount);
      }

      onRelease() {
        if (!this.reducedMotion) {
          this.addTrauma(0.32); // Restrained trauma impulse per Astra spec
        }
      }

      onImpact() {
        if (!this.reducedMotion) {
          this.addTrauma(0.38); // Restrained trauma impulse per Astra spec
        }
      }

      update(realDt, sample) {
        this.spellOffsetPos.set(0, 0, 0);
        this.spellOffsetLookAt.set(0, 0, 0);
        this.spellFovOffset = 0.0;

        // Scripted framing offsets: Cinematic preset only
        if (this.mode === 'cinematic' && sample && !this.reducedMotion) {
          // CHARGE 0–80%: Restrained 5–8% push-in toward raised focus (-4.5, 3.8, 0.0)
          // FOV eases 46 -> 43.5 deg
          const push = sample.cameraPush;
          if (push > 0.001) {
            // Restrained 5-8% push-in along view direction toward action center
            this._viewDir.subVectors(this.baseLookAt, this.basePos).normalize();
            this.spellOffsetPos.addScaledVector(this._viewDir, 0.68 * push);
            this.spellOffsetLookAt.set(-1.4 * push, 0.65 * push, 0);
            this.spellFovOffset = -1.5 * push;
          }

          // RELEASE: Small recoil along view direction (-0.28 units)
          if (sample.releaseAge >= 0 && sample.releaseAge < 0.35) {
            const recoil = -0.28 * Math.exp(-sample.releaseAge * 8.0);
            this._viewDir.subVectors(this.baseLookAt, this.basePos).normalize();
            this.spellOffsetPos.addScaledVector(this._viewDir, recoil);
          }

          // IMPACT: Modest look target shift toward monolith
          if (sample.impactAge >= 0 && sample.impactAge < 0.65) {
            const shift = 1.15 * Math.exp(-sample.impactAge * 4.0);
            this.spellOffsetLookAt.x += shift;
          }
        }

        // Target camera transform composed cleanly from base + spell offset
        this.targetPos.copy(this.basePos).add(this.spellOffsetPos);
        this.targetLookAt.copy(this.baseLookAt).add(this.spellOffsetLookAt);

        // Exponential damping using real delta (responsive at all timeScales)
        const damp = 1.0 - Math.exp(-5.5 * realDt);
        this.currentPos.lerp(this.targetPos, damp);
        this.currentLookAt.lerp(this.targetLookAt, damp);

        // Subtle ambient cinematic breathing drift
        const totalTime = sample ? sample.totalTime : 0;
        const driftX = (this.mode === 'cinematic' && !this.reducedMotion) ? Math.sin(totalTime * 0.35) * 0.18 : 0;
        const driftY = (this.mode === 'cinematic' && !this.reducedMotion) ? Math.cos(totalTime * 0.28) * 0.10 : 0;

        // Controlled deterministic trauma shake using low-frequency harmonic sines (no PRNG desync across FPS)
        let shakeX = 0, shakeY = 0, shakeZ = 0;
        if (this.trauma > 0.001 && !this.reducedMotion) {
          this.shakeTimer += realDt * 32.0;
          const shakeFactor = this.trauma * this.trauma;
          shakeX = (Math.sin(this.shakeTimer * 1.35) + 0.35 * Math.sin(this.shakeTimer * 3.1)) * 0.38 * shakeFactor;
          shakeY = (Math.cos(this.shakeTimer * 1.65) + 0.35 * Math.sin(this.shakeTimer * 2.7)) * 0.38 * shakeFactor;
          shakeZ = (Math.sin(this.shakeTimer * 0.95) + 0.25 * Math.cos(this.shakeTimer * 2.1)) * 0.22 * shakeFactor;

          this.trauma = Math.max(0, this.trauma - realDt * 2.2);
        }

        this.camera.position.set(
          this.currentPos.x + driftX + shakeX,
          this.currentPos.y + driftY + shakeY,
          this.currentPos.z + shakeZ
        );

        this.camera.lookAt(
          this.currentLookAt.x + shakeX * 0.4,
          this.currentLookAt.y + shakeY * 0.4,
          this.currentLookAt.z
        );

        // Apply FOV modulation with projection update
        const effectiveFov = this.baseFov + this.spellFovOffset;
        if (Math.abs(this.camera.fov - effectiveFov) > 0.05) {
          this.camera.fov = effectiveFov;
          this.camera.updateProjectionMatrix();
        }
      }
    }

    // =========================================================================
    // 8. SPELL DIRECTOR (Phase 4 Timing, Orchestration & Event-Once Ownership)
    // =========================================================================
    class SpellDirector {
      constructor() {
        this.state = STATE_IDLE;
        this.stateTime = 0.0;
        this.totalTime = 0.0;
        this.castId = 0;
        this.autoLoop = true;

        this.DUR_IDLE = 2.0;
        this.DUR_CHARGE = 1.8;
        this.DUR_CAST = 1.3;
        this.DUR_RECOVER = 1.0;
        this.RELEASE_PROGRESS = 0.15; // Release occurs at exactly 15% of CAST (0.195s)

        this.releaseFired = false;
        this.impactFired = false;
        this.releaseAge = -1.0;
        this.impactAge = -1.0;

        this.earlyReleaseSnapshot = null;
        this.recoverySnapshot = null;
        this.pendingEvents = [];

      }

      requestCast(characterAdapter) {
        if (this.state === STATE_IDLE) {
          this.transitionTo(STATE_CHARGE);
        } else if (this.state === STATE_RECOVER) {
          // Retriggering during RECOVER: snapshot current recovery pose to blend smoothly (Phase 4 spec)
          if (characterAdapter) {
            this.recoverySnapshot = characterAdapter.capturePoseSnapshot();
          }
          this.transitionTo(STATE_CHARGE);
        } else if (this.state === STATE_CHARGE) {
          // Manual early release: snapshot current pose to blend smoothly without teleporting
          if (characterAdapter) {
            this.earlyReleaseSnapshot = characterAdapter.capturePoseSnapshot();
          }
          this.transitionTo(STATE_CAST);
        }
      }

      setLoop(enabled) {
        this.autoLoop = enabled;
      }

      transitionTo(newState, initialTime = 0.0) {
        this.state = newState;
        this.stateTime = initialTime;

        if (this.state === STATE_CHARGE) {
          this.castId++;
          this.releaseFired = false;
          this.impactFired = false;
          this.releaseAge = -1.0;
          this.impactAge = -1.0;
          this.pendingEvents.push({ type: 'CHARGE_START', castId: this.castId });
        } else if (this.state === STATE_CAST) {
          this.releaseFired = false;
          this.releaseAge = -1.0;
        } else if (this.state === STATE_RECOVER) {
          this.earlyReleaseSnapshot = null;
        } else if (this.state === STATE_IDLE) {
          this.earlyReleaseSnapshot = null;
          this.recoverySnapshot = null;
        }
      }

      advance(simDt) {
        this.totalTime += simDt;
        if (this.releaseFired) {
          this.releaseAge += simDt;
        }
        if (this.impactFired) {
          this.impactAge += simDt;
        }

        // Phase 4 Requirement: Carry time across state boundaries; process threshold crossings in order
        let remainingDt = simDt;
        let loopGuard = 0;
        while (remainingDt > 0.00001 && loopGuard < 8) {
          loopGuard++;
          let timeToBoundary = Infinity;
          let nextState = -1;

          switch (this.state) {
            case STATE_IDLE:
              if (this.autoLoop) {
                timeToBoundary = Math.max(0, this.DUR_IDLE - this.stateTime);
                nextState = STATE_CHARGE;
              }
              break;

            case STATE_CHARGE:
              timeToBoundary = Math.max(0, this.DUR_CHARGE - this.stateTime);
              nextState = STATE_CAST;
              break;

            case STATE_CAST:
              if (!this.releaseFired) {
                const releaseThreshold = this.DUR_CAST * this.RELEASE_PROGRESS;
                if (this.stateTime < releaseThreshold) {
                  timeToBoundary = releaseThreshold - this.stateTime;
                  nextState = -2; // Event threshold crossing marker
                }
              }
              if (timeToBoundary === Infinity) {
                timeToBoundary = Math.max(0, this.DUR_CAST - this.stateTime);
                nextState = STATE_RECOVER;
              }
              break;

            case STATE_RECOVER:
              timeToBoundary = Math.max(0, this.DUR_RECOVER - this.stateTime);
              nextState = STATE_IDLE;
              break;
          }

          if (remainingDt < timeToBoundary) {
            this.stateTime += remainingDt;
            remainingDt = 0;
          } else {
            this.stateTime += timeToBoundary;
            remainingDt -= timeToBoundary;

            if (nextState === -2) {
              // Release threshold crossed exactly at 15% CAST
              this.releaseFired = true;
              this.releaseAge = remainingDt;
              this.pendingEvents.push({ type: 'RELEASE', castId: this.castId });
            } else if (nextState >= 0) {
              this.transitionTo(nextState, 0.0);
            } else {
              this.stateTime += remainingDt;
              remainingDt = 0;
            }
          }
        }
      }

      notifyImpact(event) {
        if (!this.impactFired && event.castId === this.castId) {
          this.impactFired = true;
          this.impactAge = 0.0;
          this.pendingEvents.push({
            type: 'IMPACT',
            castId: this.castId,
            point: event.point,
            normal: event.normal
          });
        }
      }

      sample() {
        let progress = 0.0;
        let chargeEnergy = 0.0;

        switch (this.state) {
          case STATE_IDLE:
            progress = Math.min(1.0, this.stateTime / this.DUR_IDLE);
            chargeEnergy = 0.0;
            break;

          case STATE_CHARGE:
            progress = Math.min(1.0, this.stateTime / this.DUR_CHARGE);
            if (progress >= 0.30) {
              this.recoverySnapshot = null;
            }
            if (progress < 0.30) {
              const u = progress / 0.30;
              chargeEnergy = u * u * 0.25;
            } else if (progress < 0.80) {
              const u = (progress - 0.30) / 0.50;
              chargeEnergy = 0.25 + u * u * (3 - 2 * u) * 0.55;
            } else {
              const u = (progress - 0.80) / 0.20;
              chargeEnergy = 0.80 + u * 0.20;
            }
            break;

          case STATE_CAST:
            progress = Math.min(1.0, this.stateTime / this.DUR_CAST);
            if (progress < this.RELEASE_PROGRESS) {
              chargeEnergy = 1.0;
            } else if (progress < 0.35) {
              const u = (progress - this.RELEASE_PROGRESS) / (0.35 - this.RELEASE_PROGRESS);
              chargeEnergy = Math.max(0, 1.0 - u);
            } else {
              chargeEnergy = 0.0;
            }
            break;

          case STATE_RECOVER:
            progress = Math.min(1.0, this.stateTime / this.DUR_RECOVER);
            chargeEnergy = 0.0;
            break;
        }

        // Camera push envelope (0-80% push, hold 80-100% and CAST 0-15%, smooth ease-out across CAST 15-100%)
        let cameraPush = 0.0;
        if (this.state === STATE_CHARGE) {
          if (progress < 0.80) {
            const u = progress / 0.80;
            cameraPush = u * u * (3 - 2 * u);
          } else {
            cameraPush = 1.0;
          }
        } else if (this.state === STATE_CAST) {
          if (progress < this.RELEASE_PROGRESS) {
            cameraPush = 1.0;
          } else {
            const u = (progress - this.RELEASE_PROGRESS) / (1.0 - this.RELEASE_PROGRESS);
            cameraPush = Math.max(0.0, 1.0 - u * u);
          }
        }

        // Exposure offset envelope (impact flash <= 0.18 EV decaying in 0.12s, release <= 0.04 EV)
        let exposureOffset = 0.0;
        if (this.releaseAge >= 0 && this.releaseAge < 0.08) {
          exposureOffset += 0.04 * (1.0 - this.releaseAge / 0.08);
        }
        if (this.impactAge >= 0 && this.impactAge < 0.12) {
          exposureOffset += 0.18 * (1.0 - this.impactAge / 0.12);
        }
        exposureOffset = Math.min(0.20, exposureOffset);

        // Floor rune response envelope
        let floorRuneResponse = 0.0;
        if (this.state === STATE_CHARGE) {
          floorRuneResponse = chargeEnergy * 0.45;
        } else if (this.state === STATE_CAST && progress < 0.35) {
          floorRuneResponse = chargeEnergy * 0.45;
        }

        return {
          castId: this.castId,
          state: this.state,
          stateTime: this.stateTime,
          totalTime: this.totalTime,
          progress,
          chargeEnergy,
          releaseFired: this.releaseFired,
          impactFired: this.impactFired,
          releaseAge: this.releaseAge,
          impactAge: this.impactAge,
          cameraPush,
          exposureOffset,
          floorRuneResponse,
          earlyReleaseSnapshot: this.earlyReleaseSnapshot,
          recoverySnapshot: this.recoverySnapshot
        };
      }

      reset() {
        this.state = STATE_IDLE;
        this.stateTime = 0.0;
        this.releaseFired = false;
        this.impactFired = false;
        this.releaseAge = -1.0;
        this.impactAge = -1.0;
        this.earlyReleaseSnapshot = null;
        this.recoverySnapshot = null;
        this.pendingEvents = [];
      }
    }

    // =========================================================================
    // 8. MASTER APPLICATION & HDR POST-PROCESSING PIPELINE (Phases 1-3)
    // =========================================================================
    const STATE_IDLE = 0;
    const STATE_CHARGE = 1;
    const STATE_CAST = 2;
    const STATE_RECOVER = 3;

    // Render comparison modes
    const RENDER_MODE_COMPOSER_BLOOM_ON = 0;
    const RENDER_MODE_COMPOSER_BLOOM_OFF = 1;
    const RENDER_MODE_DIRECT = 2;

    class App {
      constructor() {
        this.canvas = document.getElementById('webgl-canvas');
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        // Modern WebGLRenderer with ACES tone mapping & explicit sRGB color space
        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: true,
          powerPreference: 'high-performance'
        });
        this.renderer.setSize(this.width, this.height);
        this.dpr = Math.min(window.devicePixelRatio || 1, 1.5); // Capped DPR per Astra spec
        this.renderer.setPixelRatio(this.dpr);

        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Color Management & ACES Tone Mapping
        this.renderer.outputColorSpace = THREE.SRGBColorSpace;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.0;

        // Scene, Background & Fog
        this.scene = new THREE.Scene();
        this.origBgColor = new THREE.Color(0x060514);
        this.directBgColor = computeAcesToneMappedColor(this.origBgColor, 1.0);
        this.scene.background = this.origBgColor;
        this.scene.fog = new THREE.FogExp2(0x070618, 0.024);

        // Perspective Camera
        this.camera = new THREE.PerspectiveCamera(46, this.width / this.height, 0.2, 300);

        // Procedural PMREM Environment Bake (Phase 2)
        this.initEnvironmentMap();

        // Lighting System
        this.initLighting();

        // Subsystems
        this.env = new EnvironmentBuilder(this.scene);
        this.wizard = new WizardCharacter(this.scene);
        this.characterAdapter = new CharacterAdapter(this.wizard);
        this.particles = new ParticleEngine(this.scene);
        this.projectiles = new ProjectileSystem(this.scene, this.particles, this.env);
        this.director = new CameraDirector(this.camera, this.canvas);
        window.director = this.director;
        window.app = this;

        // Post-Processing Pipeline (Phase 1)
        this.renderMode = RENDER_MODE_COMPOSER_BLOOM_ON;
        this.initPostProcessing();

        // Phase 4: SpellDirector and Fixed Simulation Architecture
        this.spellDirector = new SpellDirector();
        window.spellDirector = this.spellDirector;
        this.fixedDelta = 1 / 120; // Astra specified 1/120s fixed simulation step
        this.accumulator = 0.0;
        this.maxBacklogSteps = 24; // Up to 24 simulation steps per rendered frame

        this.timeScale = 1.0;
        this.autoLoop = true;
        this.spellDirector.setLoop(this.autoLoop);

        this.gemWorldPos = new THREE.Vector3();
        this.strikeTargetPos = new THREE.Vector3(10.2, 3.4, 0.0);
        this.strikeNormal = new THREE.Vector3(-1.0, 0.0, 0.0);
        this.strikeDir = new THREE.Vector3();

        // Track event counts for deterministic inspection
        this.eventCounts = {
          casts: 0,
          releases: 0,
          detonations: 0
        };

        // UI references
        this.uiDot = document.getElementById('state-dot');
        this.uiText = document.getElementById('state-text');
        this.uiFill = document.getElementById('state-fill');
        this.btnRenderMode = document.getElementById('btn-render-mode');

        this.initEventListeners();
        this.updateUIFromSample(this.spellDirector.sample());

        // Initial Transform & Scalar Sanity Validation (Phase 0)
        this.validateInitialState();

        this.clock = new THREE.Clock();
        this.animate = this.animate.bind(this);
        this.animationFrameId = requestAnimationFrame(this.animate);

        // Expose inspection interface for testing & verification
        window.__WIZARD_V3__ = {
          app: this,
          director: this.spellDirector,
          getState: () => {
            const sample = this.spellDirector.sample();
            return {
              state: ['IDLE', 'CHARGE', 'CAST', 'RECOVER'][sample.state],
              stateTime: sample.stateTime,
              totalTime: sample.totalTime,
              progress: sample.progress,
              chargeEnergy: sample.chargeEnergy,
              castId: sample.castId,
              releaseAge: sample.releaseAge,
              impactAge: sample.impactAge,
              renderMode: ['BLOOM_ON', 'BLOOM_OFF', 'DIRECT'][this.renderMode],
              vortexActive: this.particles.vortexPoints.visible,
              sparksActive: this.particles.sparkPoints.visible,
              projectileActive: this.projectiles.active,
              gemPosition: this.gemWorldPos.toArray(),
              eventCounts: { ...this.eventCounts },
              poolOccupancy: {
                vortexActive: this.particles.vortexPoints.visible ? this.particles.MAX_VORTEX : 0,
                sparksActive: this.particles.getActiveSparkCount(),
                maxVortex: this.particles.MAX_VORTEX,
                maxSparks: this.particles.MAX_SPARKS
              },
              renderStatistics: {
                calls: this.renderer.info.render.calls,
                triangles: this.renderer.info.render.triangles,
                points: this.renderer.info.render.points,
                geometries: this.renderer.info.memory.geometries,
                textures: this.renderer.info.memory.textures
              }
            };
          },
          setRenderMode: (mode) => this.setRenderMode(mode),
          step: (dt = 1/120) => this.stepSimulation(dt)
        };
      }

      // Procedural PMREM Environment (Phase 2 - Provides gold specular catches without external HDRI)
      initEnvironmentMap() {
        const pmremGenerator = new THREE.PMREMGenerator(this.renderer);
        pmremGenerator.compileEquirectangularShader();

        const envScene = new THREE.Scene();
        envScene.background = new THREE.Color(0x0a0c1a);

        // Soft cool overhead card
        const topLight = new THREE.DirectionalLight(0x5a7ab5, 1.2);
        topLight.position.set(0, 10, 0);
        envScene.add(topLight);

        // Warm ground bounce
        const groundLight = new THREE.DirectionalLight(0x282035, 0.6);
        groundLight.position.set(0, -10, 0);
        envScene.add(groundLight);

        // Restrained rim card
        const sideLight = new THREE.DirectionalLight(0x405580, 0.8);
        sideLight.position.set(10, 4, -10);
        envScene.add(sideLight);

        this.envTexture = pmremGenerator.fromScene(envScene, 0.04).texture;
        this.scene.environment = this.envTexture;
        this.scene.environmentIntensity = 0.22;

        pmremGenerator.dispose();
      }

      initLighting() {
        // Ambient fill
        const ambLight = new THREE.AmbientLight(0x1e1a38, 0.50);
        this.scene.add(ambLight);

        // Moonlight key / shadow light (Calibrated shadow bounds for character & stage)
        this.moonLight = new THREE.DirectionalLight(0xd4e6ff, 1.5);
        this.moonLight.position.set(-8, 22, 14);
        this.moonLight.castShadow = true;
        this.moonLight.shadow.mapSize.width = 2048;
        this.moonLight.shadow.mapSize.height = 2048;
        this.moonLight.shadow.camera.near = 2.0;
        this.moonLight.shadow.camera.far = 65;
        this.moonLight.shadow.camera.left = -14;
        this.moonLight.shadow.camera.right = 14;
        this.moonLight.shadow.camera.top = 14;
        this.moonLight.shadow.camera.bottom = -14;
        this.moonLight.shadow.bias = -0.0005;
        this.moonLight.shadow.normalBias = 0.02;
        this.scene.add(this.moonLight);

        // Targeted frontal key/fill light to keep wizard face, beard, hat and robe clear and readable
        const frontFill = new THREE.DirectionalLight(0x7c94ca, 0.95);
        frontFill.position.set(-2.0, 5.5, 10.5);
        this.scene.add(frontFill);

        // Subtle character accent fill to bring out peach skin and deep plum robe folds
        const charFill = new THREE.PointLight(0xa56885, 0.55, 10, 1.8);
        charFill.position.set(-4.2, 2.2, 3.2);
        this.scene.add(charFill);

        // Soft under-brim portrait fill light to ensure face, eye sockets, and beard are clearly readable
        const faceFill = new THREE.PointLight(0xeef4ff, 1.2, 8, 2.0);
        faceFill.position.set(-3.2, 3.4, 2.4);
        this.scene.add(faceFill);

        // Cool silvery rim light for character silhouette (associated with visible moon behind scene)
        const rimLight = new THREE.DirectionalLight(0x8eb2f5, 1.40);
        rimLight.position.set(-9.0, 16.0, -18.0);
        rimLight.target.position.set(-4.5, 3.2, 0.0);
        this.scene.add(rimLight.target);
        this.scene.add(rimLight);
      }

      // HDR Post-Processing Pipeline (Phase 1)
      initPostProcessing() {
        const w = this.width;
        const h = this.height;

        // Half-float render target with 4x MSAA
        this.renderTarget = new THREE.WebGLRenderTarget(w, h, {
          type: THREE.HalfFloatType,
          format: THREE.RGBAFormat,
          samples: 4
        });

        this.composer = new EffectComposer(this.renderer, this.renderTarget);
        this.composer.setPixelRatio(this.dpr);
        this.composer.setSize(w, h);

        // 1. Scene RenderPass
        this.renderPass = new RenderPass(this.scene, this.camera);
        this.composer.addPass(this.renderPass);

        // 2. Restrained UnrealBloomPass (threshold 1.1, strength 0.35, radius 0.35)
        this.bloomPass = new UnrealBloomPass(
          new THREE.Vector2(w * this.dpr, h * this.dpr),
          0.35, // strength
          0.35, // radius
          1.10  // threshold
        );
        this.composer.addPass(this.bloomPass);

        // 3. OutputPass for ACES tone mapping & sRGB conversion
        this.outputPass = new OutputPass();
        this.composer.addPass(this.outputPass);
      }

      setRenderMode(mode) {
        this.renderMode = mode;
        const labels = ['Mode: Bloom ON', 'Mode: Bloom OFF', 'Mode: Direct'];
        this.btnRenderMode.textContent = labels[this.renderMode];

        if (this.renderMode === RENDER_MODE_COMPOSER_BLOOM_ON) {
          this.bloomPass.enabled = true;
        } else if (this.renderMode === RENDER_MODE_COMPOSER_BLOOM_OFF) {
          this.bloomPass.enabled = false;
        }
      }

      cycleRenderMode() {
        const nextMode = (this.renderMode + 1) % 3;
        this.setRenderMode(nextMode);
      }

      resizeRendering() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio || 1, 1.5);

        this.camera.aspect = this.width / this.height;
        this.camera.updateProjectionMatrix();

        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(this.dpr);

        if (this.composer) {
          this.composer.setPixelRatio(this.dpr);
          this.composer.setSize(this.width, this.height);
          this.bloomPass.resolution.set(this.width * this.dpr, this.height * this.dpr);
        }
      }

      validateInitialState() {
        const checkFinite = (val, name) => {
          if (!Number.isFinite(val)) {
            console.error(`Non-finite transform/scalar detected in ${name}:`, val);
          }
        };

        checkFinite(this.wizard.group.position.x, 'wizard.group.position.x');
        checkFinite(this.wizard.nodes.body.position.y, 'wizard.nodes.body.position.y');
        checkFinite(this.wizard.nodes.gemMesh.material.emissiveIntensity, 'gemMesh.emissiveIntensity');
        checkFinite(this.wizard.nodes.gemLight.intensity, 'gemLight.intensity');
        checkFinite(this.moonLight.intensity, 'moonLight.intensity');
      }

      initEventListeners() {
        window.addEventListener('resize', () => this.resizeRendering());

        const btnCast = document.getElementById('btn-cast-now');
        const triggerCast = () => {
          audio.handleUserInteraction();
          this.spellDirector.requestCast(this.characterAdapter);
        };

        window.addEventListener('pointerdown', () => audio.handleUserInteraction());
        btnCast.addEventListener('click', triggerCast);

        window.addEventListener('keydown', (e) => {
          audio.handleUserInteraction();
          if (e.code === 'Space') {
            e.preventDefault();
            triggerCast();
          } else if (e.code === 'KeyH') {
            document.getElementById('ui-container').classList.toggle('ui-hidden');
          } else if (e.code === 'KeyP') {
            this.cycleRenderMode();
          }
        });

        this.btnRenderMode.addEventListener('click', () => this.cycleRenderMode());

        document.querySelectorAll('.btn-chip[data-cam]').forEach((btn) => {
          btn.addEventListener('click', () => this.director.setPreset(btn.dataset.cam));
        });

        document.querySelectorAll('.btn-chip[data-speed]').forEach((btn) => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.btn-chip[data-speed]').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            this.timeScale = parseFloat(btn.dataset.speed);
          });
        });

        const btnLoop = document.getElementById('btn-loop');
        btnLoop.addEventListener('click', () => {
          this.autoLoop = !this.autoLoop;
          btnLoop.classList.toggle('active', this.autoLoop);
          this.spellDirector.setLoop(this.autoLoop);
        });

        const btnAudio = document.getElementById('btn-audio');
        btnAudio.addEventListener('click', () => {
          const isEnabled = audio.toggle();
          btnAudio.textContent = isEnabled ? '🔊' : '🔇';
          btnAudio.classList.toggle('active', isEnabled);
        });

        const btnUI = document.getElementById('btn-ui-toggle');
        btnUI.addEventListener('click', () => {
          document.getElementById('ui-container').classList.toggle('ui-hidden');
        });

        // Page Visibility Handling (Phase 4 requirement)
        document.addEventListener('visibilitychange', () => {
          const isVisible = !document.hidden;
          if (!isVisible) {
            this.accumulator = 0.0;
            audio.onVisibilityChange(false);
          } else {
            this.clock.getDelta(); // Clear delta jump upon tab return
            this.accumulator = 0.0;
            audio.onVisibilityChange(true);
          }
        });
      }

      updateUIFromSample(sample) {
        const stateConfig = [
          { name: 'IDLE', color: '#7388aa' },
          { name: 'CHARGE', color: '#00f0ff' },
          { name: 'CAST', color: '#ff3d85' },
          { name: 'RECOVER', color: '#ffd147' }
        ];

        const cfg = stateConfig[sample.state];
        this.uiText.textContent = cfg.name;
        this.uiText.style.color = cfg.color;
        this.uiDot.style.background = cfg.color;
        this.uiDot.style.boxShadow = `0 0 12px ${cfg.color}`;

        const displayProgress = this.autoLoop
          ? Math.min(100, Math.max(0, sample.progress * 100))
          : (sample.state === STATE_IDLE ? 0 : Math.min(100, Math.max(0, sample.progress * 100)));
        this.uiFill.style.width = `${displayProgress}%`;
      }

      // Exact 12-Step Simulation Pipeline (Astra Architecture Spec)
      stepSimulation(simDt) {
        // 1. Advance SpellDirector
        this.spellDirector.advance(simDt);
        const sample = this.spellDirector.sample();

        // 2. Identify due events
        const events = this.spellDirector.pendingEvents.splice(0);
        for (let i = 0; i < events.length; i++) {
          const ev = events[i];
          if (ev.type === 'CHARGE_START') {
            this.eventCounts.casts++;
            audio.startChargeVoice();
          }
        }

        // 3. Apply character pose and secondary motion
        this.characterAdapter.applyPose(sample, simDt, sample.earlyReleaseSnapshot, sample.recoverySnapshot);

        // 4. Update world matrices
        this.wizard.group.updateMatrixWorld(true);

        // 5. If release occurs: Sample gem once, sample spell direction, fire release event once
        for (let i = 0; i < events.length; i++) {
          const ev = events[i];
          if (ev.type === 'RELEASE') {
            this.eventCounts.releases++;
            this.wizard.getGemWorldPosition(this.gemWorldPos);
            this.env.getStrikeTarget(this.strikeTargetPos);
            this.env.getStrikeNormal(this.strikeNormal);
            this.strikeDir.subVectors(this.strikeTargetPos, this.gemWorldPos).normalize();

            // Emit to hero VFX, projectile, audio and camera response
            this.particles.onRelease(this.gemWorldPos, this.strikeDir);
            this.projectiles.launch(this.gemWorldPos, this.strikeTargetPos, this.strikeNormal, sample.castId);
            audio.playCastBurst();
            this.director.onRelease();
          }
        }

        // 6. Update projectile motion & ribbon
        this.projectiles.update(simDt, this.camera);

        // 7. Resolve exact impact crossing
        const impactEvent = this.projectiles.consumeImpact();

        // 8. Emit impact event once to SpellDirector
        if (impactEvent) {
          this.spellDirector.notifyImpact(impactEvent);
        }

        // 9. Apply event reactions if impact occurred
        const postEvents = this.spellDirector.pendingEvents.splice(0);
        for (let i = 0; i < postEvents.length; i++) {
          const ev = postEvents[i];
          if (ev.type === 'IMPACT') {
            this.eventCounts.detonations++;
            this.env.triggerImpactFlash();
            this.particles.onImpact(ev.point, ev.normal);
            audio.playImpactBoom();
            this.director.onImpact();
          }
        }

        // 10. Update audio voice modulation
        audio.updateChargeVoice(sample.chargeEnergy);
        if ((sample.state === STATE_IDLE || sample.state === STATE_RECOVER) && audio.chargeOsc) {
          audio.stopChargeVoice();
        }

        // 11. Update particle and environment envelopes
        this.wizard.getGemWorldPosition(this.gemWorldPos);
        this.particles.updateVortex(simDt, this.gemWorldPos, sample.chargeEnergy, sample.releaseFired);
        this.particles.updateSparks(simDt);
        this.env.update(sample.totalTime, sample.floorRuneResponse, simDt);
        this.env.decayImpactLight(simDt);

        // 12. Publish one consistent snapshot to HUD
        this.updateUIFromSample(sample);
      }

      renderFrame() {
        if (this.renderMode === RENDER_MODE_DIRECT) {
          this.scene.background = this.directBgColor;
          this.renderer.render(this.scene, this.camera);
        } else {
          this.scene.background = this.origBgColor;
          this.composer.render();
        }
      }

      animate() {
        this.animationFrameId = requestAnimationFrame(this.animate);

        // Guard against tab suspension / frame freeze runaway
        if (document.hidden) {
          this.accumulator = 0.0;
          this.clock.getDelta();
          return;
        }

        const rawDt = this.clock.getDelta();
        const realDt = Math.min(rawDt, 0.1);

        // Fixed 1/120s simulation accumulator
        this.accumulator += realDt * this.timeScale;

        // Discard excessive backlog after tab suspension or frame freeze
        if (this.accumulator > this.maxBacklogSteps * this.fixedDelta) {
          this.accumulator = this.maxBacklogSteps * this.fixedDelta;
        }

        while (this.accumulator >= this.fixedDelta) {
          this.stepSimulation(this.fixedDelta);
          this.accumulator -= this.fixedDelta;
        }

        // Camera convergence uses real delta, spell offsets use timeline sample
        const sample = this.spellDirector.sample();
        this.director.update(realDt, sample);

        // Tone mapping exposure adjustment (bounded impact flash <= 0.20 EV)
        this.renderer.toneMappingExposure = 1.0 + sample.exposureOffset;

        // Restrained bloom modulation on impact flash
        if (this.bloomPass && this.renderMode === RENDER_MODE_COMPOSER_BLOOM_ON) {
          this.bloomPass.strength = 0.35 + sample.exposureOffset * 0.35;
        }

        this.renderFrame();
      }

      dispose() {
        if (this.animationFrameId) {
          cancelAnimationFrame(this.animationFrameId);
        }
        if (this.characterAdapter) {
          this.characterAdapter.dispose();
        }
        if (this.composer) {
          this.composer.dispose();
        }
        if (this.renderTarget) {
          this.renderTarget.dispose();
        }
        if (this.envTexture) {
          this.envTexture.dispose();
        }
        if (this.particles) {
          this.particles.dispose();
        }
        if (this.env) {
          this.env.dispose();
        }
        if (this.renderer) {
          this.renderer.dispose();
        }
      }
    }

    // Launch Application
    window.addEventListener('DOMContentLoaded', () => {
      try {
        new App();
      } catch (err) {
        console.error('Fatal initialization error in Wizard V3:', err);
        const banner = document.createElement('div');
        banner.style.position = 'fixed';
        banner.style.top = '50%';
        banner.style.left = '50%';
        banner.style.transform = 'translate(-50%, -50%)';
        banner.style.padding = '24px 36px';
        banner.style.background = 'rgba(15, 10, 32, 0.96)';
        banner.style.border = '2px solid #ff3875';
        banner.style.borderRadius = '14px';
        banner.style.color = '#ffffff';
        banner.style.textAlign = 'center';
        banner.style.zIndex = '99999';
        banner.innerHTML = `
          <h2 style="font-size:22px;color:#ff3875;margin-bottom:12px;">Initialization Error</h2>
          <p style="color:#c5d8f7;font-size:14px;line-height:1.6;max-width:440px;">
            ${err.message || 'WebGL2 or Three.js module load failed.'}
          </p>
        `;
        document.body.appendChild(banner);
      }
    });
  </script>
</body>
</html>
