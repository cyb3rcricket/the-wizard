<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Wizard V3 - Arcane Sovereign (Pass 1)</title>
  <style>
    :root {
      --bg-color: #05040d;
      --accent-cyan: #00f0ff;
      --accent-gold: #ffbe3b;
      --accent-magenta: #e03875;
      --panel-bg: rgba(10, 8, 24, 0.82);
      --panel-border: rgba(0, 240, 255, 0.35);
      --font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: var(--font-family);
      color: #e5ebff;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: grab;
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* Calibrated Vignette Overlay - Reduced extent/opacity so wizard silhouette is not clipped */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 55%, rgba(4, 3, 12, 0.35) 85%, rgba(2, 1, 8, 0.68) 100%);
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.45);
    }

    /* UI Overlay */
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 30px;
      transition: opacity 0.35s ease;
    }

    .ui-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: auto;
    }

    .title-group {
      text-shadow: 0 0 16px rgba(0, 240, 255, 0.45), 0 2px 6px #000;
    }

    .title-group h1 {
      font-size: 26px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 20%, #9beaff 60%, #00e1ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-group p {
      font-size: 12px;
      letter-spacing: 2px;
      color: #9cb2db;
      margin-top: 4px;
      font-style: italic;
    }

    /* State Badge */
    .state-badge-container {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 30px;
      padding: 8px 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .state-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #7388aa;
      box-shadow: 0 0 8px currentColor;
      transition: all 0.3s ease;
    }

    .state-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      min-width: 80px;
    }

    .state-progress-bar {
      width: 90px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .state-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f0ff, #fff);
      box-shadow: 0 0 8px #00f0ff;
      border-radius: 3px;
      transition: width 0.05s linear;
    }

    /* Center Action Trigger */
    .center-action {
      position: absolute;
      bottom: 125px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .cast-button {
      background: linear-gradient(135deg, rgba(224, 56, 117, 0.88) 0%, rgba(135, 20, 75, 0.95) 100%);
      color: #ffffff;
      border: 2px solid #ff7fae;
      border-radius: 40px;
      padding: 14px 38px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 74, 143, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.3);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .cast-button:hover {
      transform: scale(1.06);
      background: linear-gradient(135deg, #ff4d91 0%, #a81c5f 100%);
      box-shadow: 0 0 35px rgba(255, 90, 160, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.6);
      border-color: #ffffff;
    }

    .cast-button:active {
      transform: scale(0.96);
    }

    .cast-button::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: rgba(255, 255, 255, 0.4);
      transform: rotate(30deg);
      transition: all 0.6s ease;
    }

    .cast-button:hover::after {
      left: 140%;
    }

    .cast-hint {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #9cb2db;
      text-shadow: 0 2px 4px #000;
    }

    /* Help Tooltip - Positioned between center action and footer to prevent overlapping */
    .help-tooltip {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(200, 215, 255, 0.7);
      pointer-events: none;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    /* Footer Controls */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: auto;
      flex-wrap: wrap;
      gap: 16px;
    }

    .control-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 10px 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel-label {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #8da4d0;
      text-transform: uppercase;
      font-weight: 700;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #c9d8f5;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-chip:hover {
      background: rgba(0, 240, 255, 0.25);
      border-color: #00f0ff;
      color: #fff;
    }

    .btn-chip.active {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.35), rgba(76, 0, 255, 0.35));
      border-color: #00f0ff;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #c9d8f5;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 16px;
    }

    .icon-btn:hover {
      background: rgba(0, 240, 255, 0.3);
      border-color: #00f0ff;
      color: #fff;
    }

    .icon-btn.active {
      background: rgba(0, 240, 255, 0.25);
      border-color: #00f0ff;
      color: #00f0ff;
    }

    /* Dev Banner for Render Comparison */
    .render-mode-badge {
      font-size: 11px;
      letter-spacing: 1px;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #9beaff;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 700;
    }

    .render-mode-badge:hover {
      background: rgba(0, 240, 255, 0.3);
      color: #ffffff;
    }

    @media (max-width: 860px) {
      #ui-container { padding: 14px 16px; }
      .title-group h1 { font-size: 18px; }
      .title-group p { display: none; }
      .footer-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .center-action { bottom: 170px; }
      .cast-button { padding: 10px 24px; font-size: 14px; }
      .help-tooltip { display: none; }
    }
  </style>

<body>

  <!-- V3 Module Script -->
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // Expose THREE globally on window for tooling, inspection, and tests
    window.THREE = THREE;

    // =========================================================================
    // 0. DETERMINISTIC PSEUDO-RANDOM NUMBER GENERATOR (Phase 0)
    // =========================================================================
    class DeterministicRandom {
      constructor(seed = 1337) {
        this.s = seed >>> 0;
      }
      next() {
        // Mulberry32
        let t = (this.s += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      range(min, max) {
        return min + this.next() * (max - min);
      }
    }
    const rng = new DeterministicRandom(42);

    // =========================================================================
    // COLOR UTILITY: Precise ACES Filmic Tone Mapping matching OutputPass
    // =========================================================================
    function computeAcesToneMappedColor(color, exposure = 1.0) {
      let r = color.r * exposure;
      let g = color.g * exposure;
      let b = color.b * exposure;

      const inR = 0.59719 * r + 0.35458 * g + 0.04823 * b;
      const inG = 0.07600 * r + 0.90834 * g + 0.01566 * b;
      const inB = 0.02840 * r + 0.13383 * g + 0.83777 * b;

      const fit = (v) => {
        const num = v * (v + 0.0245786) - 0.000090537;
        const den = v * (0.983729 * v + 0.4329510) + 0.238081;
        return Math.max(0.0, num / den);
      };

      const fitR = fit(inR);
      const fitG = fit(inG);
      const fitB = fit(inB);

      const outR = Math.min(1.0, Math.max(0.0, 1.60475 * fitR - 0.53108 * fitG - 0.07367 * fitB));
      const outG = Math.min(1.0, Math.max(0.0, -0.10208 * fitR + 1.10813 * fitG - 0.00605 * fitB));
      const outB = Math.min(1.0, Math.max(0.0, -0.00327 * fitR - 0.07276 * fitG + 1.07602 * fitB));

      return new THREE.Color(outR, outG, outB);
    }

    // =========================================================================
    // 1. PROCEDURAL SOUND SYNTHESIZER (Web Audio API)
    // =========================================================================
    class ProceduralAudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = false;
        this.masterGain = null;
        this.windGain = null;
      }

      init() {
        if (this.ctx) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(this.enabled ? 0.75 : 0, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);
          this.startWindAmbience();
        } catch (e) {
          console.warn('Web Audio not available:', e);
        }
      }

      handleUserInteraction() {
        if (this.ctx && this.ctx.state === 'suspended' && this.enabled) {
          this.ctx.resume();
        }
      }

      toggle() {
        if (!this.ctx) this.init();
        if (!this.ctx) return false;

        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        this.enabled = !this.enabled;
        if (this.masterGain) {
          this.masterGain.gain.setTargetAtTime(this.enabled ? 0.75 : 0, this.ctx.currentTime, 0.05);
        }
        return this.enabled;
      }

      startWindAmbience() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 2;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + 0.02 * white) / 1.02;
          lastOut = output[i];
          output[i] *= 2.8;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(320, this.ctx.currentTime);
        filter.Q.setValueAtTime(2.5, this.ctx.currentTime);

        this.windGain = this.ctx.createGain();
        this.windGain.gain.setValueAtTime(0.18, this.ctx.currentTime);

        whiteNoise.connect(filter);
        filter.connect(this.windGain);
        this.windGain.connect(this.masterGain);

        whiteNoise.start();
      }

      playChargeStart(duration) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(740, now + duration);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.45, now + duration * 0.85);
        gain.gain.linearRampToValueAtTime(0.0, now + duration);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + duration);
      }

      playCastBurst() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.35);

        gain.gain.setValueAtTime(0.55, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.35);
      }

      playImpactBoom() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.65);

        gain.gain.setValueAtTime(0.85, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.65);
      }
    }

    const audio = new ProceduralAudioEngine();

    // =========================================================================
    // 2. PROCEDURAL TEXTURE GENERATOR (Phase 1 Color Management)
    // =========================================================================
    const Textures = {
      createRuneDisc: function () {
        const size = 1024;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;

        ctx.clearRect(0, 0, size, size);

        ctx.strokeStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 10;

        const radii = [480, 460, 410, 390, 280, 180, 100];
        radii.forEach((r, idx) => {
          ctx.beginPath();
          ctx.lineWidth = idx % 2 === 0 ? 4 : 2;
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
        });

        // 8-Point Mandala
        ctx.beginPath();
        ctx.lineWidth = 2.5;
        for (let i = 0; i < 8; i++) {
          const a = (i * Math.PI * 2) / 8;
          const r1 = 410;
          const r2 = 180;
          ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
          ctx.lineTo(cx + Math.cos(a + Math.PI / 4) * r2, cy + Math.sin(a + Math.PI / 4) * r2);
          ctx.lineTo(cx + Math.cos(a + Math.PI / 2) * r1, cy + Math.sin(a + Math.PI / 2) * r1);
        }
        ctx.stroke();

        // Radial glyphs
        for (let i = 0; i < 24; i++) {
          const a = (i * Math.PI * 2) / 24;
          const x1 = cx + Math.cos(a) * 410;
          const y1 = cy + Math.sin(a) * 410;
          const x2 = cx + Math.cos(a) * 460;
          const y2 = cy + Math.sin(a) * 460;

          ctx.beginPath();
          ctx.lineWidth = i % 2 === 0 ? 3 : 1.5;
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();

          if (i % 2 === 0) {
            ctx.save();
            ctx.translate(cx + Math.cos(a + 0.13) * 435, cy + Math.sin(a + 0.13) * 435);
            ctx.rotate(a + Math.PI / 2);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const runes = ['ᚦ', 'ᚨ', 'ᚱ', 'ᚲ', 'ᚷ', 'ᚹ', 'ᚺ', 'ᚾ', 'ᛁ', 'ᛃ', 'ᛈ', 'ᛉ'];
            ctx.fillText(runes[(i / 2) % runes.length], 0, 0);
            ctx.restore();
          }
        }

        ctx.beginPath();
        ctx.arc(cx, cy, 75, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 240, 255, 0.12)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 8;
        return tex;
      },

      // Weathered Ancient Flagstone Altar Surface (Subdued, coherent variation)
      createStoneTexture: function () {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Dark muted slate base
        ctx.fillStyle = '#212235';
        ctx.fillRect(0, 0, size, size);

        // Coherent, broad stone slabs (larger scale, subdued mortar lines)
        const tileSize = 128;
        for (let y = 0; y < size; y += tileSize) {
          const shift = (y / tileSize) % 2 === 0 ? 0 : tileSize / 2;
          for (let x = -shift; x < size + tileSize; x += tileSize) {
            const seed = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            const shade = Math.floor(30 + (seed - Math.floor(seed)) * 18);
            ctx.fillStyle = `rgb(${shade}, ${shade + 3}, ${shade + 12})`;
            ctx.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);

            // Subtle beveled edge highlight
            ctx.strokeStyle = `rgba(140, 160, 200, 0.10)`;
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
          }
        }

        // Soft grain overlay
        const imgData = ctx.getImageData(0, 0, size, size);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          const n = (rng.next() - 0.5) * 14;
          data[i] = Math.min(255, Math.max(0, data[i] + n));
          data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + n));
          data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + n + 2));
        }
        ctx.putImageData(imgData, 0, 0);

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(3, 3);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      },

      createMoonTexture: function () {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Pearlescent silver/lunar base (restrained luminance to avoid blowing out bloom)
        ctx.fillStyle = '#b8cde8';
        ctx.fillRect(0, 0, size, size);

        // Dark basalt plains (maria)
        const numMaria = 14;
        for (let i = 0; i < numMaria; i++) {
          const mx = (Math.sin(i * 9.3) * 0.4 + 0.5) * size;
          const my = (Math.cos(i * 7.1) * 0.4 + 0.5) * size;
          const rad = 40 + (i % 5) * 25;
          const grad = ctx.createRadialGradient(mx, my, 5, mx, my, rad);
          grad.addColorStop(0, 'rgba(95, 115, 145, 0.55)');
          grad.addColorStop(0.7, 'rgba(120, 138, 168, 0.28)');
          grad.addColorStop(1, 'rgba(184, 205, 232, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(mx, my, rad, 0, Math.PI * 2);
          ctx.fill();
        }

        // Craters with subtle rims
        for (let i = 0; i < 40; i++) {
          const cx = rng.next() * size;
          const cy = rng.next() * size;
          const r = 4 + rng.next() * 18;

          ctx.strokeStyle = 'rgba(230, 240, 255, 0.45)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(cx, cy, r, -Math.PI * 0.7, Math.PI * 0.3);
          ctx.stroke();

          ctx.fillStyle = 'rgba(70, 85, 112, 0.35)';
          ctx.beginPath();
          ctx.arc(cx, cy, r - 1.2, 0, Math.PI * 2);
          ctx.fill();
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      },

      createGlowSprite: function () {
        const size = 128;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const c = size / 2;

        const grad = ctx.createRadialGradient(c, c, 0, c, c, c);
        grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        grad.addColorStop(0.2, 'rgba(100, 245, 255, 0.85)');
        grad.addColorStop(0.55, 'rgba(0, 180, 255, 0.3)');
        grad.addColorStop(1, 'rgba(0, 80, 255, 0)');

        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      },

      createSparkleSprite: function () {
        const size = 128;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const c = size / 2;

        ctx.clearRect(0, 0, size, size);

        const grad = ctx.createRadialGradient(c, c, 0, c, c, 26);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.4, 'rgba(0, 240, 255, 0.9)');
        grad.addColorStop(1, 'rgba(0, 150, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(c, c, 26, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        for (let i = 0; i < 4; i++) {
          ctx.save();
          ctx.translate(c, c);
          ctx.rotate((i * Math.PI) / 2);
          ctx.beginPath();
          ctx.moveTo(-2, 0);
          ctx.lineTo(0, 56);
          ctx.lineTo(2, 0);
          ctx.fill();
          ctx.restore();
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

    // =========================================================================
    // 3. WIZARD PROCEDURAL CHARACTER & ADAPTER (Phases 2 & 3)
    // =========================================================================
    // Scratch math objects for zero-allocation procedural updates
    const _hatJointMats = [new THREE.Matrix4(), new THREE.Matrix4(), new THREE.Matrix4(), new THREE.Matrix4(), new THREE.Matrix4()];
    const _hatPVec = new THREE.Vector3();

    // Procedural Beard Lock Generator (Closed root dome, graceful taper, smooth normals, vertex color gradient)
    function createBeardLockGeo(length, rootRadiusX, rootRadiusZ, curveZ = 0.08, curveX = 0.0, radialSegs = 8, heightSegs = 8) {
      const geo = new THREE.BufferGeometry();
      const posArr = [];
      const colArr = [];
      const idxArr = [];

      const rootCol = new THREE.Color(0x9aa7bd); // Soft cool roots
      const midCol  = new THREE.Color(0xe2e9f6); // Ivory silver body
      const tipCol  = new THREE.Color(0xffffff); // Radiant ivory tip

      for (let r = 0; r <= heightSegs; r++) {
        const v = r / heightSegs; // 0 at root, 1 at tip
        // Rounded dome cap at root
        const domeY = v < 0.15 ? Math.cos((v / 0.15) * Math.PI * 0.5) * rootRadiusZ * 0.4 : 0;
        const y = -v * length + domeY;
        const zOffset = Math.sin(v * Math.PI * 0.75) * curveZ;
        const xOffset = Math.sin(v * Math.PI * 0.75) * curveX;

        // Smooth organic taper: dome at root, maintaining body width, tapering to sharp tip
        const taper = v < 0.15
          ? Math.sin((v / 0.15) * Math.PI * 0.5) * (1.0 - Math.pow(v, 1.25))
          : Math.max(0, 1.0 - Math.pow(v, 1.25));
        const rx = rootRadiusX * Math.max(0.001, taper);
        const rz = rootRadiusZ * Math.max(0.001, taper);

        const col = v < 0.35
          ? rootCol.clone().lerp(midCol, v / 0.35)
          : midCol.clone().lerp(tipCol, (v - 0.35) / 0.65);

        for (let c = 0; c <= radialSegs; c++) {
          const u = c / radialSegs;
          const angle = u * Math.PI * 2;
          const px = Math.cos(angle) * rx + xOffset;
          const pz = Math.sin(angle) * rz + zOffset;

          posArr.push(px, y, pz);
          colArr.push(col.r, col.g, col.b);
        }
      }

      for (let r = 0; r < heightSegs; r++) {
        for (let c = 0; c < radialSegs; c++) {
          const a = r * (radialSegs + 1) + c;
          const b = (r + 1) * (radialSegs + 1) + c;
          const d = (r + 1) * (radialSegs + 1) + (c + 1);
          const e = r * (radialSegs + 1) + (c + 1);
          idxArr.push(a, b, d);
          idxArr.push(a, d, e);
        }
      }

      geo.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colArr, 3));
      geo.setIndex(idxArr);
      geo.computeVertexNormals();
      return geo;
    }

        const getFoldOffset = (angle, normY) => {
          const f1 = Math.sin(angle * 6) * 0.14;
          const f2 = Math.sin(angle * 2 + 0.5) * 0.035; // slight organic asymmetry
          return (f1 + f2) * (1.0 - normY * 0.65);

        for (let i = 0; i < skirtPos.count; i++) {

          const zDrape = (1.0 - normY) * -0.15;
          const yGrounded = normY === 0 ? y + Math.sin(angle * 3) * 0.02 : y;

          const foldIntensity = (Math.sin(angle * 6) + 1.0) * 0.5;
