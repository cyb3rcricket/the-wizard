<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Wizard V3 - Arcane Sovereign (Pass 1)</title>
  <style>
    :root {
      --bg-color: #05040d;
      --accent-cyan: #00f0ff;
      --accent-gold: #ffbe3b;
      --accent-magenta: #e03875;
      --panel-bg: rgba(10, 8, 24, 0.82);
      --panel-border: rgba(0, 240, 255, 0.35);
      --font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: var(--font-family);
      color: #e5ebff;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: grab;
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* Calibrated Vignette Overlay - Reduced extent/opacity so wizard silhouette is not clipped */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 55%, rgba(4, 3, 12, 0.35) 85%, rgba(2, 1, 8, 0.68) 100%);
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.45);
    }

    /* UI Overlay */
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 30px;
      transition: opacity 0.35s ease;
    }

    .ui-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: auto;
    }

    .title-group {
      text-shadow: 0 0 16px rgba(0, 240, 255, 0.45), 0 2px 6px #000;
    }

    .title-group h1 {
      font-size: 26px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 20%, #9beaff 60%, #00e1ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-group p {
      font-size: 12px;
      letter-spacing: 2px;
      color: #9cb2db;
      margin-top: 4px;
      font-style: italic;
    }

    /* State Badge */
    .state-badge-container {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 30px;
      padding: 8px 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .state-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #7388aa;
      box-shadow: 0 0 8px currentColor;
      transition: all 0.3s ease;
    }

    .state-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      min-width: 80px;
    }

    .state-progress-bar {
      width: 90px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .state-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f0ff, #fff);
      box-shadow: 0 0 8px #00f0ff;
      border-radius: 3px;
      transition: width 0.05s linear;
    }

    /* Center Action Trigger */
    .center-action {
      position: absolute;
      bottom: 125px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .cast-button {
      background: linear-gradient(135deg, rgba(224, 56, 117, 0.88) 0%, rgba(135, 20, 75, 0.95) 100%);
      color: #ffffff;
      border: 2px solid #ff7fae;
      border-radius: 40px;
      padding: 14px 38px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 74, 143, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.3);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .cast-button:hover {
      transform: scale(1.06);
      background: linear-gradient(135deg, #ff4d91 0%, #a81c5f 100%);
      box-shadow: 0 0 35px rgba(255, 90, 160, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.6);
      border-color: #ffffff;
    }

    .cast-button:active {
      transform: scale(0.96);
    }

    .cast-button::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: rgba(255, 255, 255, 0.4);
      transform: rotate(30deg);
      transition: all 0.6s ease;
    }

    .cast-button:hover::after {
      left: 140%;
    }

    .cast-hint {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #9cb2db;
      text-shadow: 0 2px 4px #000;
    }

    /* Help Tooltip - Positioned between center action and footer to prevent overlapping */
    .help-tooltip {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(200, 215, 255, 0.7);
      pointer-events: none;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    /* Footer Controls */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: auto;
      flex-wrap: wrap;
      gap: 16px;
    }

    .control-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 10px 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel-label {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #8da4d0;
      text-transform: uppercase;
      font-weight: 700;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #c9d8f5;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-chip:hover {
      background: rgba(0, 240, 255, 0.25);
      border-color: #00f0ff;
      color: #fff;
    }

    .btn-chip.active {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.35), rgba(76, 0, 255, 0.35));
      border-color: #00f0ff;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #c9d8f5;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 16px;
    }

    .icon-btn:hover {
      background: rgba(0, 240, 255, 0.3);
      border-color: #00f0ff;
      color: #fff;
    }

    .icon-btn.active {
      background: rgba(0, 240, 255, 0.25);
      border-color: #00f0ff;
      color: #00f0ff;
    }

    /* Dev Banner for Render Comparison */
    .render-mode-badge {
      font-size: 11px;
      letter-spacing: 1px;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #9beaff;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 700;
    }

    .render-mode-badge:hover {
      background: rgba(0, 240, 255, 0.3);
      color: #ffffff;
    }

    @media (max-width: 860px) {
      #ui-container { padding: 14px 16px; }
      .title-group h1 { font-size: 18px; }
      .title-group p { display: none; }
      .footer-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .center-action { bottom: 170px; }
      .cast-button { padding: 10px 24px; font-size: 14px; }
      .help-tooltip { display: none; }
    }
  </style>

<body>
  <canvas id="webgl-canvas"></canvas>

  <div id="ui-container">
    <!-- Top Header -->
    <header class="header-bar">

  <!-- V3 Module Script -->
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // Expose THREE globally on window for tooling, inspection, and tests
    window.THREE = THREE;

    // =========================================================================
    // 0. DETERMINISTIC PSEUDO-RANDOM NUMBER GENERATOR (Phase 0)
    // =========================================================================
    class DeterministicRandom {
      constructor(seed = 1337) {
        this.s = seed >>> 0;
      }
      next() {
        // Mulberry32
        let t = (this.s += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      range(min, max) {
        return min + this.next() * (max - min);
      }
    }
    const rng = new DeterministicRandom(42);

    // =========================================================================
    // COLOR UTILITY: Precise ACES Filmic Tone Mapping matching OutputPass
    // =========================================================================
    function computeAcesToneMappedColor(color, exposure = 1.0) {
      let r = color.r * exposure;
      let g = color.g * exposure;
      let b = color.b * exposure;

      const inR = 0.59719 * r + 0.35458 * g + 0.04823 * b;
      const inG = 0.07600 * r + 0.90834 * g + 0.01566 * b;
      const inB = 0.02840 * r + 0.13383 * g + 0.83777 * b;

      const fit = (v) => {
        const num = v * (v + 0.0245786) - 0.000090537;
        const den = v * (0.983729 * v + 0.4329510) + 0.238081;
        return Math.max(0.0, num / den);
      };

      const fitR = fit(inR);
      const fitG = fit(inG);
      const fitB = fit(inB);

      const outR = Math.min(1.0, Math.max(0.0, 1.60475 * fitR - 0.53108 * fitG - 0.07367 * fitB));
      const outG = Math.min(1.0, Math.max(0.0, -0.10208 * fitR + 1.10813 * fitG - 0.00605 * fitB));
      const outB = Math.min(1.0, Math.max(0.0, -0.00327 * fitR - 0.07276 * fitG + 1.07602 * fitB));

      return new THREE.Color(outR, outG, outB);
    }

    // =========================================================================
    // 1. PROCEDURAL SOUND SYNTHESIZER (Web Audio API)
    // =========================================================================
    class ProceduralAudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = false;
        this.masterGain = null;
        this.windGain = null;
        this.chargeOsc = null;
        this.chargeGain = null;
        this.cachedNoiseBuffer = null;
      }

      init() {
        if (this.ctx) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(this.enabled ? 0.75 : 0, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);

          // Pre-allocate reusable noise buffer (Phase 4 requirement)
          const bufLen = this.ctx.sampleRate * 2;
          this.cachedNoiseBuffer = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
          const data = this.cachedNoiseBuffer.getChannelData(0);
          for (let i = 0; i < bufLen; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          this.startWindAmbience();
        } catch (e) {
          console.warn('Web Audio not available:', e);
        }
      }

      handleUserInteraction() {
        if (this.ctx && this.ctx.state === 'suspended' && this.enabled) {
          this.ctx.resume();
        }
      }

      toggle() {
        if (!this.ctx) this.init();
        if (!this.ctx) return false;

        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        this.enabled = !this.enabled;
        if (this.masterGain) {
          this.masterGain.gain.setTargetAtTime(this.enabled ? 0.75 : 0, this.ctx.currentTime, 0.05);
        }
        if (!this.enabled) {
          this.stopChargeVoice();
        }
        return this.enabled;
      }

      onVisibilityChange(visible) {
        if (!this.ctx) return;
        if (!visible) {
          this.stopChargeVoice();
        } else if (this.enabled && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      startWindAmbience() {
        if (!this.ctx || !this.cachedNoiseBuffer) return;
        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = this.cachedNoiseBuffer;
        whiteNoise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(320, this.ctx.currentTime);
        filter.Q.setValueAtTime(2.5, this.ctx.currentTime);

        this.windGain = this.ctx.createGain();
        this.windGain.gain.setValueAtTime(0.18, this.ctx.currentTime);

        whiteNoise.connect(filter);
        filter.connect(this.windGain);
        this.windGain.connect(this.masterGain);

        whiteNoise.start();
      }

      // Phase 4/5 Retained Charge Voice: Follows exact visual energy envelope
      startChargeVoice() {
        if (!this.enabled || !this.ctx) return;
        if (this.chargeOsc) return;

        try {
          const now = this.ctx.currentTime;
          this.chargeOsc = this.ctx.createOscillator();
          this.chargeGain = this.ctx.createGain();

          this.chargeOsc.type = 'triangle';
          this.chargeOsc.frequency.setValueAtTime(110, now);

          this.chargeGain.gain.setValueAtTime(0.001, now);

          this.chargeOsc.connect(this.chargeGain);
          this.chargeGain.connect(this.masterGain);

          this.chargeOsc.start(now);
        } catch (e) {
          console.warn('Error starting charge voice:', e);
        }
      }

      updateChargeVoice(chargeEnergy) {
        if (!this.enabled || !this.ctx) return;
        if (chargeEnergy <= 0.001) {
          this.stopChargeVoice();
          return;
        }
        if (!this.chargeOsc) {
          this.startChargeVoice();
        }
        if (!this.chargeGain || !this.chargeOsc) return;
        const now = this.ctx.currentTime;
        const freq = 110 + chargeEnergy * 560; // 110 Hz up to 670 Hz
        const targetGain = Math.max(0.001, chargeEnergy * 0.32);

        this.chargeOsc.frequency.setTargetAtTime(freq, now, 0.04);
        this.chargeGain.gain.setTargetAtTime(targetGain, now, 0.04);
      }

      stopChargeVoice() {
        if (!this.ctx) return;
        if (this.chargeGain) {
          const now = this.ctx.currentTime;
          this.chargeGain.gain.setTargetAtTime(0.0001, now, 0.03);
          this.chargeGain = null;
        }
        if (this.chargeOsc) {
          const osc = this.chargeOsc;
          this.chargeOsc = null;
          setTimeout(() => {
            try {
              osc.stop();
              osc.disconnect();
            } catch (e) {}
          }, 50);
        }
      }

      playCastBurst() {
        if (!this.enabled || !this.ctx) return;
        this.stopChargeVoice();

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(840, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.32);

        gain.gain.setValueAtTime(0.55, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.32);
      }

      playImpactBoom() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;

        // Sub-bass sine transient
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.65);

        gain.gain.setValueAtTime(0.85, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.65);

        // Crack transient using cached noise buffer
        if (this.cachedNoiseBuffer) {
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.cachedNoiseBuffer;
          const noiseFilter = this.ctx.createBiquadFilter();
          noiseFilter.type = 'bandpass';
          noiseFilter.frequency.setValueAtTime(1200, now);
          noiseFilter.frequency.exponentialRampToValueAtTime(200, now + 0.25);
          noiseFilter.Q.setValueAtTime(3.0, now);

          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.5, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(this.masterGain);

          noise.start(now);
          noise.stop(now + 0.25);
        }
      }
    }

    const audio = new ProceduralAudioEngine();

    // =========================================================================
    // 2. PROCEDURAL TEXTURE GENERATOR (Phase 1 Color Management)
    // =========================================================================
    const Textures = {
      createRuneDisc: function () {
        const size = 1024;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;

        ctx.clearRect(0, 0, size, size);

        ctx.strokeStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 10;

        const radii = [480, 460, 410, 390, 280, 180, 100];
        radii.forEach((r, idx) => {
          ctx.beginPath();
          ctx.lineWidth = idx % 2 === 0 ? 4 : 2;
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
        });

        // 8-Point Mandala
        ctx.beginPath();
        ctx.lineWidth = 2.5;
        for (let i = 0; i < 8; i++) {
          const a = (i * Math.PI * 2) / 8;
          const r1 = 410;
          const r2 = 180;
          ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
          ctx.lineTo(cx + Math.cos(a + Math.PI / 4) * r2, cy + Math.sin(a + Math.PI / 4) * r2);
          ctx.lineTo(cx + Math.cos(a + Math.PI / 2) * r1, cy + Math.sin(a + Math.PI / 2) * r1);
        }
        ctx.stroke();

        // Radial glyphs
        for (let i = 0; i < 24; i++) {
          const a = (i * Math.PI * 2) / 24;
          const x1 = cx + Math.cos(a) * 410;
          const y1 = cy + Math.sin(a) * 410;
          const x2 = cx + Math.cos(a) * 460;
          const y2 = cy + Math.sin(a) * 460;

          ctx.beginPath();

            ctx.fillText(runes[(i / 2) % runes.length], 0, 0);
            ctx.restore();
          }
        }

        ctx.beginPath();
        ctx.arc(cx, cy, 75, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 240, 255, 0.12)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';

        const tex = new THREE.CanvasTexture(canvas);

        tex.anisotropy = 8;

      // Localized Floor Rune Disc with Masked Radial Gradient (Phase 5 requirement)
      createLocalRuneDisc: function () {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;

        ctx.clearRect(0, 0, size, size);

        // Soft radial gradient falloff to mask edges and localize around caster
        const radGrad = ctx.createRadialGradient(cx, cy, 25, cx, cy, 240);
        radGrad.addColorStop(0, 'rgba(0, 240, 255, 0.55)');
        radGrad.addColorStop(0.35, 'rgba(0, 240, 255, 0.32)');
        radGrad.addColorStop(0.70, 'rgba(0, 180, 255, 0.12)');
        radGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = radGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, 245, 0, Math.PI * 2);
        ctx.fill();

        // Concentric focused rings under wizard feet
        ctx.strokeStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 8;
        const rings = [210, 175, 130, 85];
        rings.forEach((r, idx) => {
          ctx.beginPath();
          ctx.lineWidth = idx % 2 === 0 ? 3 : 1.5;
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
        });

        // 6-Point Star runes
        ctx.beginPath();
        ctx.lineWidth = 1.8;
        for (let i = 0; i < 6; i++) {
          const a = (i * Math.PI * 2) / 6;
          const r1 = 175;
          const r2 = 85;
          ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
          ctx.lineTo(cx + Math.cos(a + Math.PI / 6) * r2, cy + Math.sin(a + Math.PI / 6) * r2);
          ctx.lineTo(cx + Math.cos(a + Math.PI / 3) * r1, cy + Math.sin(a + Math.PI / 3) * r1);
        }
        ctx.stroke();

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 8;
        return tex;
      },

      // Weathered Ancient Flagstone Altar Surface (Subdued, coherent variation)
      createStoneTexture: function () {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Dark muted slate base
        ctx.fillStyle = '#212235';
        ctx.fillRect(0, 0, size, size);

        // Coherent, broad stone slabs (larger scale, subdued mortar lines)
        const tileSize = 128;
        for (let y = 0; y < size; y += tileSize) {
          const shift = (y / tileSize) % 2 === 0 ? 0 : tileSize / 2;
          for (let x = -shift; x < size + tileSize; x += tileSize) {
            const seed = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            const shade = Math.floor(30 + (seed - Math.floor(seed)) * 18);
            ctx.fillStyle = `rgb(${shade}, ${shade + 3}, ${shade + 12})`;
            ctx.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);

            // Subtle beveled edge highlight
            ctx.strokeStyle = `rgba(140, 160, 200, 0.10)`;
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
          }
        }

        // Soft grain overlay
        const imgData = ctx.getImageData(0, 0, size, size);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          const n = (rng.next() - 0.5) * 14;
          data[i] = Math.min(255, Math.max(0, data[i] + n));
          data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + n));
          data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + n + 2));
        }
        ctx.putImageData(imgData, 0, 0);

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(3, 3);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      },

      createMoonTexture: function () {

      createSparkleSprite: function () {
        const size = 128;

        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const c = size / 2;

        ctx.clearRect(0, 0, size, size);

        const grad = ctx.createRadialGradient(c, c, 0, c, c, 26);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.4, 'rgba(0, 240, 255, 0.9)');
        grad.addColorStop(1, 'rgba(0, 150, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(c, c, 26, 0, Math.PI * 2);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        for (let i = 0; i < 4; i++) {
          ctx.save();

          ctx.rotate((i * Math.PI) / 2);

          ctx.moveTo(-2, 0);
          ctx.lineTo(0, 56);
          ctx.lineTo(2, 0);

    // =========================================================================
    // 3. WIZARD PROCEDURAL CHARACTER & ADAPTER (Phases 2 & 3)
    // =========================================================================
    // Scratch math objects for zero-allocation procedural updates
    const _hatJointMats = [new THREE.Matrix4(), new THREE.Matrix4(), new THREE.Matrix4(), new THREE.Matrix4(), new THREE.Matrix4()];
    const _hatPVec = new THREE.Vector3();
    const _hatPNext = new THREE.Vector3();

    // Procedural Beard Lock Generator (Closed root dome, graceful taper, smooth normals, vertex color gradient)
    function createBeardLockGeo(length, rootRadiusX, rootRadiusZ, curveZ = 0.08, curveX = 0.0, radialSegs = 8, heightSegs = 8) {
      const geo = new THREE.BufferGeometry();
      const posArr = [];
      const colArr = [];
      const idxArr = [];

      const rootCol = new THREE.Color(0x9aa7bd); // Soft cool roots
      const midCol  = new THREE.Color(0xe2e9f6); // Ivory silver body
      const tipCol  = new THREE.Color(0xffffff); // Radiant ivory tip

      for (let r = 0; r <= heightSegs; r++) {
        const v = r / heightSegs; // 0 at root, 1 at tip
        // Rounded dome cap at root
        const domeY = v < 0.15 ? Math.cos((v / 0.15) * Math.PI * 0.5) * rootRadiusZ * 0.4 : 0;
        const y = -v * length + domeY;
        const zOffset = Math.sin(v * Math.PI * 0.75) * curveZ;
        const xOffset = Math.sin(v * Math.PI * 0.75) * curveX;

        // Smooth organic taper: dome at root, maintaining body width, tapering to sharp tip
        const taper = v < 0.15
          ? Math.sin((v / 0.15) * Math.PI * 0.5) * (1.0 - Math.pow(v, 1.25))
          : Math.max(0, 1.0 - Math.pow(v, 1.25));
        const rx = rootRadiusX * Math.max(0.001, taper);
        const rz = rootRadiusZ * Math.max(0.001, taper);

        const col = v < 0.35
          ? rootCol.clone().lerp(midCol, v / 0.35)
          : midCol.clone().lerp(tipCol, (v - 0.35) / 0.65);

        for (let c = 0; c <= radialSegs; c++) {
          const u = c / radialSegs;
          const angle = u * Math.PI * 2;
          const px = Math.cos(angle) * rx + xOffset;
          const pz = Math.sin(angle) * rz + zOffset;

          posArr.push(px, y, pz);
          colArr.push(col.r, col.g, col.b);
        }
      }

      for (let r = 0; r < heightSegs; r++) {
        for (let c = 0; c < radialSegs; c++) {
          const a = r * (radialSegs + 1) + c;
          const b = (r + 1) * (radialSegs + 1) + c;
          const d = (r + 1) * (radialSegs + 1) + (c + 1);
          const e = r * (radialSegs + 1) + (c + 1);
          idxArr.push(a, b, d);
          idxArr.push(a, d, e);
        }
      }

      geo.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colArr, 3));
      geo.setIndex(idxArr);
      geo.computeVertexNormals();
      return geo;
    }

      buildWizard() {
        // --- Material Identity Table (Phase 2) ---
        // Cloth: rich deep plum/wine, 0 metalness, high roughness, smooth normals
        const matRobeDark = new THREE.MeshStandardMaterial({

        });

        // Antique Gold trim: high metalness, controlled specular highlights
        const matRobeTrim = new THREE.MeshStandardMaterial({
          color: 0xdfb140, // Antique warm gold
          roughness: 0.42,
          metalness: 0.92
        });

        // Silver/ivory beard: non-metallic, smooth normals
        const matBeard = new THREE.MeshStandardMaterial({
          color: 0xe8ecf5, // Ivory silver white

        });

        // Warm peach skin: non-metallic, smooth normals
        const matSkin = new THREE.MeshStandardMaterial({
          color: 0xebb08a, // Warm skin
          roughness: 0.75,
          metalness: 0.0,
          flatShading: false
        });

        // Gnarled aged dark wood: non-metallic, fibrous roughness
        const matWood = new THREE.MeshStandardMaterial({
          color: 0x3d2315, // Dark aged wood
          roughness: 0.85,
          metalness: 0.0,
          flatShading: false
        });

        const matGold = new THREE.MeshStandardMaterial({
          color: 0xe5b842,
          roughness: 0.38,
          metalness: 0.94
        });

        // ---------------------------------------------------------------------
        // 1. Lower Robe / Skirt: 6 Broad Shaped Vertical Folds & Grounded Hem
        // ---------------------------------------------------------------------
        const skirtRings = 12;
        const skirtRadial = 32;
        const skirtHeight = 2.3;
        const skirtGeo = new THREE.CylinderGeometry(0.68, 1.35, skirtHeight, skirtRadial, skirtRings, true);
        const skirtPos = skirtGeo.attributes.position;
        const skirtCols = new Float32Array(skirtPos.count * 3);

        const colRidge = new THREE.Color(0x6e1a42); // Plum highlight on fold crest
        const colValley = new THREE.Color(0x2f081a); // Deep shadow in fold valley

        // Function calculating fold wave with subtle organic asymmetry
        const getFoldOffset = (angle, normY) => {
          const f1 = Math.sin(angle * 6) * 0.14;
          const f2 = Math.sin(angle * 2 + 0.5) * 0.035; // slight organic asymmetry
          return (f1 + f2) * (1.0 - normY * 0.65);
        };

        // Mold 6 broad rhythmic cloth folds that deepen toward the hem
        for (let i = 0; i < skirtPos.count; i++) {
          const x = skirtPos.getX(i);
          const y = skirtPos.getY(i);
          const z = skirtPos.getZ(i);

          const angle = Math.atan2(z, x);
          const normY = (y + skirtHeight / 2) / skirtHeight; // 0 at bottom, 1 at top

          const foldWave = getFoldOffset(angle, normY);
          const currentRadius = Math.sqrt(x * x + z * z) + foldWave;
          const zDrape = (1.0 - normY) * -0.15;
          const yGrounded = normY === 0 ? y + Math.sin(angle * 3) * 0.02 : y;

          skirtPos.setX(i, Math.cos(angle) * currentRadius);
          skirtPos.setY(i, yGrounded);
          skirtPos.setZ(i, Math.sin(angle) * currentRadius + zDrape);

          const foldIntensity = (Math.sin(angle * 6) + 1.0) * 0.5;
          const vertCol = colValley.clone().lerp(colRidge, foldIntensity);
          vertCol.multiplyScalar(0.75 + normY * 0.35);
          skirtCols[i * 3] = vertCol.r;
          skirtCols[i * 3 + 1] = vertCol.g;
          skirtCols[i * 3 + 2] = vertCol.b;
        }
        skirtGeo.setAttribute('color', new THREE.BufferAttribute(skirtCols, 3));
        skirtGeo.computeVertexNormals();

        const matRobeFolded = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          vertexColors: true,
          roughness: 0.88,
          metalness: 0.0,
          flatShading: false
        });

        this.nodes.robeMesh = new THREE.Mesh(skirtGeo, matRobeFolded);
        this.nodes.robeMesh.position.y = 1.15;
        this.nodes.robeMesh.castShadow = true;
        this.nodes.robeMesh.receiveShadow = true;
        this.nodes.body.add(this.nodes.robeMesh);

        // Conforming Gold Hem Ring that hugs the skirt folds with zero gaps or clipping
        const hemSegments = 32;
        const hemRadius = 0.035;
        const hemRadialSeg = 8;
        const hemGeo = new THREE.BufferGeometry();
        const hemPosArr = [];
        const hemIdxArr = [];

        const hemPoints = [];
        for (let i = 0; i <= hemSegments; i++) {
          const a = (i / hemSegments) * Math.PI * 2;
          const foldWave = getFoldOffset(a, 0.0);
          const r = 1.35 + foldWave;
          const zDrape = -0.15;
          const yOffset = 0.015 + Math.sin(a * 3) * 0.02;
          hemPoints.push(new THREE.Vector3(
            Math.cos(a) * r,
            yOffset,
            Math.sin(a) * r + zDrape
          ));
        }

        for (let i = 0; i < hemSegments; i++) {
          const p1 = hemPoints[i];
          const p2 = hemPoints[i + 1];
          const tangent = new THREE.Vector3().subVectors(p2, p1).normalize();
          const up = new THREE.Vector3(0, 1, 0);
          const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
          const binormal = new THREE.Vector3().crossVectors(normal, tangent).normalize();

          for (let j = 0; j <= hemRadialSeg; j++) {
            const phi = (j / hemRadialSeg) * Math.PI * 2;
            const xOff = (Math.cos(phi) * normal.x + Math.sin(phi) * binormal.x) * hemRadius;
            const yOff = (Math.cos(phi) * normal.y + Math.sin(phi) * binormal.y) * hemRadius;
            const zOff = (Math.cos(phi) * normal.z + Math.sin(phi) * binormal.z) * hemRadius;
            hemPosArr.push(p1.x + xOff, p1.y + yOff, p1.z + zOff);
          }
        }

        const stride = hemRadialSeg + 1;
        for (let i = 0; i < hemSegments; i++) {
          const next = (i + 1) % hemSegments;
          for (let j = 0; j < hemRadialSeg; j++) {
            const a = i * stride + j;
            const b = next * stride + j;
            const c = next * stride + j + 1;
            const d = i * stride + j + 1;
            hemIdxArr.push(a, b, d);
            hemIdxArr.push(b, c, d);
          }
        }
        hemGeo.setAttribute('position', new THREE.Float32BufferAttribute(hemPosArr, 3));
        hemGeo.setIndex(hemIdxArr);
        hemGeo.computeVertexNormals();
        const hemMesh = new THREE.Mesh(hemGeo, matRobeTrim);
        this.nodes.body.add(hemMesh);

        // ---------------------------------------------------------------------

        // ---------------------------------------------------------------------

        r1.position.y = 1.6;
        const r2 = new THREE.Mesh(ringGeo, matGold);
        r2.position.y = -0.6;
        this.nodes.staffGroup.add(r1);
        this.nodes.staffGroup.add(r2);

        // Staff Crown: 4 Articulated Inward-Curving Gold Talons cradling the Gem
        const crownBase = new THREE.Group();
        crownBase.position.y = 2.75;
        this.nodes.staffGroup.add(crownBase);

        // Lower socket collar
        const collarGeo = new THREE.CylinderGeometry(0.14, 0.11, 0.12, 12);
        const collarMesh = new THREE.Mesh(collarGeo, matGold);
        collarMesh.position.y = 0.06;
        crownBase.add(collarMesh);

        // 4 Articulated Gold Talons arching around gem equator (R=0.40) and hooking inward over crown
        for (let i = 0; i < 4; i++) {
          const angle = (i * Math.PI) / 2 + Math.PI * 0.25;
          const cosA = Math.cos(angle);
          const sinA = Math.sin(angle);

          const p0 = new THREE.Vector3(cosA * 0.15, 0.08, sinA * 0.15);
          const p1 = new THREE.Vector3(cosA * 0.40, 0.34, sinA * 0.40);
          const p2 = new THREE.Vector3(cosA * 0.20, 0.58, sinA * 0.20);

          const seg1Vec = new THREE.Vector3().subVectors(p1, p0);
          const seg1Len = seg1Vec.length();
          const seg1Mid = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);
          const seg1Geo = new THREE.CylinderGeometry(0.026, 0.040, seg1Len, 6);
          const seg1Mesh = new THREE.Mesh(seg1Geo, matGold);
          seg1Mesh.position.copy(seg1Mid);
          seg1Mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), seg1Vec.normalize());
          seg1Mesh.castShadow = true;
          crownBase.add(seg1Mesh);

          const seg2Vec = new THREE.Vector3().subVectors(p2, p1);
          const seg2Len = seg2Vec.length();
          const seg2Mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
          const seg2Geo = new THREE.CylinderGeometry(0.012, 0.026, seg2Len, 6);
          const seg2Mesh = new THREE.Mesh(seg2Geo, matGold);
          seg2Mesh.position.copy(seg2Mid);
          seg2Mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), seg2Vec.normalize());
          seg2Mesh.castShadow = true;
          crownBase.add(seg2Mesh);
        }

        // Oversized Faceted Arcane Gem (Icosahedron flatShading)
        const gemGeo = new THREE.IcosahedronGeometry(0.33, 0);
        const matGem = new THREE.MeshStandardMaterial({
          color: 0x00d4ee,
          emissive: 0x00e1ff,
          emissiveIntensity: 1.8,
          roughness: 0.18,
          metalness: 0.05,
          flatShading: true
        });
        this.nodes.gemMesh = new THREE.Mesh(gemGeo, matGem);
        this.nodes.gemMesh.position.y = 0.36;
        crownBase.add(this.nodes.gemMesh);

        // Radiant Inner Highlight Core
        const coreGeo = new THREE.IcosahedronGeometry(0.16, 0);
        const matCore = new THREE.MeshBasicMaterial({ color: 0xffffff });
        this.nodes.gemCore = new THREE.Mesh(coreGeo, matCore);
        this.nodes.gemMesh.add(this.nodes.gemCore);

        // Staff Dynamic Point Light (Shadows disabled by default per Phase 2 to prevent acne and 6-face shadow cost)
        this.nodes.gemLight = new THREE.PointLight(0x00f0ff, 1.8, 14, 2.0);
        this.nodes.gemLight.castShadow = false;
        this.nodes.gemMesh.add(this.nodes.gemLight);

        // Orbital Arcane Runic Rings around Gem
        const orbitGeo = new THREE.TorusGeometry(0.48, 0.015, 4, 16);
        const matOrbit = new THREE.MeshBasicMaterial({ color: 0x67ffeb, wireframe: true });
        this.nodes.orbitalRing1 = new THREE.Mesh(orbitGeo, matOrbit);
        this.nodes.orbitalRing1.rotation.x = 0.5;
        this.nodes.gemMesh.add(this.nodes.orbitalRing1);

        this.nodes.orbitalRing2 = new THREE.Mesh(orbitGeo, matOrbit);
        this.nodes.orbitalRing2.rotation.y = 0.8;
        this.nodes.gemMesh.add(this.nodes.orbitalRing2);

        // ---------------------------------------------------------------------
        // 9. Left Arm & Expressive Somatic Channeling Hand
        // ---------------------------------------------------------------------
        this.nodes.leftArm.position.set(0.74, 0.82, 0);
        this.nodes.chest.add(this.nodes.leftArm);

        const lBicepMesh = new THREE.Mesh(bicepGeo, matRobeLight);
        lBicepMesh.position.y = -0.3;
        lBicepMesh.castShadow = true;
        this.nodes.leftArm.add(lBicepMesh);

        this.nodes.leftForearm.position.set(0, -0.6, 0);
        this.nodes.leftArm.add(this.nodes.leftForearm);

        const lSleeveMesh = new THREE.Mesh(sleeveGeo, matRobeDark);
        lSleeveMesh.position.y = -0.3;
        lSleeveMesh.castShadow = true;
        this.nodes.leftForearm.add(lSleeveMesh);

        // Somatic Hand forming an open channeling gesture
        const lHandGroup = new THREE.Group();
        lHandGroup.position.set(0, -0.65, 0);
        this.nodes.leftForearm.add(lHandGroup);
        this.nodes.somaticHand = lHandGroup;

        const somaticPalmGeo = new THREE.BoxGeometry(0.18, 0.20, 0.10);
        const somaticPalmMesh = new THREE.Mesh(somaticPalmGeo, matSkin);
        somaticPalmMesh.rotation.set(0.2, 0.3, 0.1);
        lHandGroup.add(somaticPalmMesh);

        // Open fingers wedge extended forward
        const somaticFingersGeo = new THREE.ConeGeometry(0.08, 0.18, 5);
        somaticFingersGeo.rotateX(Math.PI * 0.85);
        const somaticFingersMesh = new THREE.Mesh(somaticFingersGeo, matSkin);
        somaticFingersMesh.position.set(0.02, -0.12, 0.08);
        lHandGroup.add(somaticFingersMesh);

        const somaticThumbGeo = new THREE.ConeGeometry(0.05, 0.14, 5);
        somaticThumbGeo.rotateZ(-Math.PI * 0.42);
        const somaticThumbMesh = new THREE.Mesh(somaticThumbGeo, matSkin);
        somaticThumbMesh.position.set(-0.10, 0.02, 0.06);
        lHandGroup.add(somaticThumbMesh);

        this.nodes.root.add(this.nodes.body);

        // Initial finite rest pose with breath = 0
        this.setPoseIdle(0, 0);
      }

      updateHatMesh() {
        if (!this.nodes.hatContinuousMesh) return;
        const RINGS = this.HAT_RINGS;
        const RADIAL = this.HAT_RADIAL;
        const positions = this.nodes.hatContinuousMesh.geometry.attributes.position.array;

        // Precompute cumulative joint matrices relative to head using zero-allocation scratch matrices
        for (let i = 0; i < 5; i++) {
          this.nodes.hatSegments[i].updateMatrix();
          if (i === 0) {
            _hatJointMats[0].copy(this.nodes.hatSegments[0].matrix);
          } else {
            _hatJointMats[i].multiplyMatrices(_hatJointMats[i - 1], this.nodes.hatSegments[i].matrix);
          }
        }

        const totalH = 2.20;
        const sLimits = [0, 0.52 / totalH, 1.00 / totalH, 1.44 / totalH, 1.84 / totalH, 1.0];

        for (let r = 0; r <= RINGS; r++) {
          const t = r / RINGS;
          const radius = 0.68 * Math.pow(Math.max(0, 1.0 - t), 0.80) + 0.025;

          // Locate segment
          let s = 0;
          for (let i = 0; i < 5; i++) {
            if (t >= sLimits[i] && t <= sLimits[i + 1]) {
              s = i;
              break;
            }
          }
          if (s >= 5) s = 4;

          const sSpan = sLimits[s + 1] - sLimits[s];
          const u = Math.min(1.0, Math.max(0.0, (t - sLimits[s]) / (sSpan || 0.001)));
          const h = this.hatSpineJoints[s].height;

          for (let c = 0; c <= RADIAL; c++) {
            const angle = (c / RADIAL) * Math.PI * 2;
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);

            _hatPVec.set(cosA * radius, u * h, sinA * radius).applyMatrix4(_hatJointMats[s]);

            if (s < 4 && u > 0.65) {
              const blendW = (u - 0.65) / 0.35;
              const smoothW = blendW * blendW * (3 - 2 * blendW);
              _hatPNext.set(cosA * radius, (u - 1.0) * this.hatSpineJoints[s + 1].height, sinA * radius).applyMatrix4(_hatJointMats[s + 1]);
              _hatPVec.lerp(_hatPNext, smoothW * 0.5);
            }

            const idx = (r * (RADIAL + 1) + c) * 3;
            positions[idx] = _hatPVec.x;
            positions[idx + 1] = _hatPVec.y;
            positions[idx + 2] = _hatPVec.z;
          }
        }

        this.nodes.hatContinuousMesh.geometry.attributes.position.needsUpdate = true;
        this.nodes.hatContinuousMesh.geometry.computeVertexNormals();
      }

      getGemWorldPosition(targetVec) {
        if (this.nodes.gemMesh) {
          this.nodes.gemMesh.getWorldPosition(targetVec);
        } else {
          targetVec.copy(this.nodes.root.position).add(new THREE.Vector3(1, 3.5, 0));
        }
        return targetVec;
      }

      // --- Complete Parametric Posing & Transform Ownership (Phase 4) ---
      setPoseIdle(progress, totalTime, simDt = 1/120) {
        const breath = totalTime;
        const b = Math.sin(breath * 2.2);
        const w = Math.sin(breath * 1.4);

        this.nodes.root.position.copy(this.restPose.rootPos);
        this.nodes.body.position.set(0, b * 0.04, 0);
        this.nodes.chest.rotation.set(0, 0, b * 0.015);
        this.nodes.head.rotation.set(this.restPose.headRot.x + b * 0.02, this.restPose.headRot.y, 0);

        // Cascading gentle beard sway
        this.nodes.beardSegments[0].rotation.set(this.restPose.beard0Rot.x, 0, w * 0.04);
        this.nodes.beardSegments[1].rotation.set(this.restPose.beard1Rot.x, 0, Math.sin(breath * 1.4 - 0.4) * 0.07);
        this.nodes.beardSegments[2].rotation.set(this.restPose.beard2Rot.x, 0, Math.sin(breath * 1.4 - 0.8) * 0.11);

        // Hat rest alignment & tip flutter
        for (let i = 0; i < 5; i++) {
          const restTiltX = this.hatSpineJoints[i] ? this.hatSpineJoints[i].restTiltX : -0.15;
          const restTiltZ = this.hatSpineJoints[i] ? this.hatSpineJoints[i].restTiltZ : 0.05;
          if (i === 3) {
            this.nodes.hatSegments[i].rotation.set(restTiltX, 0, restTiltZ + Math.sin(breath * 1.2) * 0.03);
          } else if (i === 4) {
            this.nodes.hatSegments[i].rotation.set(restTiltX, 0, restTiltZ + Math.sin(breath * 1.2 - 0.5) * 0.06);
          } else {
            this.nodes.hatSegments[i].rotation.set(restTiltX, 0, restTiltZ);
          }
        }

        // Rest transforms for arms and staff
        this.nodes.rightArm.rotation.copy(this.restPose.rightArmRot);
        this.nodes.rightForearm.rotation.copy(this.restPose.rightForearmRot);
        this.nodes.staffGroup.rotation.copy(this.restPose.staffGroupRot);

        this.nodes.leftArm.rotation.copy(this.restPose.leftArmRot);
        this.nodes.leftForearm.rotation.copy(this.restPose.leftForearmRot);

        // Staff Gem Rest Ambient Glow
        const gemPulse = 1.6 + 0.4 * Math.sin(breath * 2.8);
        this.nodes.gemMesh.material.emissiveIntensity = gemPulse;
        this.nodes.gemLight.intensity = gemPulse * 1.0;
        this.nodes.orbitalRing1.rotation.z += 1.0 * simDt;
        this.nodes.orbitalRing2.rotation.x += 1.2 * simDt;

        if (this.nodes.robeMesh) {
          this.nodes.robeMesh.rotation.y = Math.sin(breath * 0.8) * 0.03;
        }

        this.updateHatMesh();
      }

      setPoseCharge(progress, totalTime, simDt = 1/120, chargeEnergy = 0, recoverySnapshot = null) {
        const p = Math.min(1.0, Math.max(0.0, progress));

        if (p < 0.30) {
          // CHARGE 0–30%: Slight body compression, grounded weight, off-hand begins gathering, focus established
          const p0 = p / 0.30;
          const smooth = p0 * p0 * (3.0 - 2.0 * p0);

          const targetRootX = -4.5;
          const targetBodyY = -0.05;
          const targetChestX = -0.06;
          const targetHeadX = this.restPose.headRot.x - 0.08;
          const targetHeadY = this.restPose.headRot.y;

          const targetLeftArmX = this.restPose.leftArmRot.x + 0.20;
          const targetLeftArmY = this.restPose.leftArmRot.y - 0.10;
          const targetLeftArmZ = this.restPose.leftArmRot.z + 0.12;
          const targetLeftForearmX = this.restPose.leftForearmRot.x + 0.10;

          const targetRightArmX = this.restPose.rightArmRot.x + 0.30;
          const targetStaffGroupX = this.restPose.staffGroupRot.x - 0.25;
          const targetStaffGroupZ = this.restPose.staffGroupRot.z - 0.10;

          if (recoverySnapshot) {
            // Retriggered during RECOVER: smoothly blend from recovery pose into 30% charge pose
            this.nodes.root.position.x = recoverySnapshot.rootPos.x + (targetRootX - recoverySnapshot.rootPos.x) * smooth;
            this.nodes.root.position.y = 0;
            this.nodes.root.position.z = 0;
            this.nodes.body.position.set(0, recoverySnapshot.bodyPos.y + (targetBodyY - recoverySnapshot.bodyPos.y) * smooth, 0);

            this.nodes.chest.rotation.set(
              recoverySnapshot.chestRot.x + (targetChestX - recoverySnapshot.chestRot.x) * smooth,
              recoverySnapshot.chestRot.y * (1.0 - smooth),
              0
            );
            this.nodes.head.rotation.set(
              recoverySnapshot.headRot.x + (targetHeadX - recoverySnapshot.headRot.x) * smooth,
              recoverySnapshot.headRot.y + (targetHeadY - recoverySnapshot.headRot.y) * smooth,
              0
            );
            this.nodes.leftArm.rotation.set(
              recoverySnapshot.leftArmRot.x + (targetLeftArmX - recoverySnapshot.leftArmRot.x) * smooth,
              recoverySnapshot.leftArmRot.y + (targetLeftArmY - recoverySnapshot.leftArmRot.y) * smooth,
              recoverySnapshot.leftArmRot.z + (targetLeftArmZ - recoverySnapshot.leftArmRot.z) * smooth
            );
            this.nodes.leftForearm.rotation.set(
              recoverySnapshot.leftForearmRot.x + (targetLeftForearmX - recoverySnapshot.leftForearmRot.x) * smooth,
              0,
              recoverySnapshot.leftForearmRot.z + (0.12 - recoverySnapshot.leftForearmRot.z) * smooth
            );
            this.nodes.rightArm.rotation.set(
              recoverySnapshot.rightArmRot.x + (targetRightArmX - recoverySnapshot.rightArmRot.x) * smooth,
              recoverySnapshot.rightArmRot.y,
              recoverySnapshot.rightArmRot.z
            );
            this.nodes.rightForearm.rotation.set(
              recoverySnapshot.rightForearmRot.x + (this.restPose.rightForearmRot.x - recoverySnapshot.rightForearmRot.x) * smooth,
              0, 0
            );
            this.nodes.staffGroup.rotation.set(
              recoverySnapshot.staffGroupRot.x + (targetStaffGroupX - recoverySnapshot.staffGroupRot.x) * smooth,
              0,
              recoverySnapshot.staffGroupRot.z + (targetStaffGroupZ - recoverySnapshot.staffGroupRot.z) * smooth
            );

            this.nodes.beardSegments[0].rotation.set(this.restPose.beard0Rot.x, 0, 0);
            this.nodes.beardSegments[1].rotation.set(this.restPose.beard1Rot.x, 0, 0);
            this.nodes.beardSegments[2].rotation.set(this.restPose.beard2Rot.x, 0, 0);

            for (let i = 0; i < 5; i++) {
              const restTiltX = this.hatSpineJoints[i].restTiltX;
              const restTiltZ = this.hatSpineJoints[i].restTiltZ;
              this.nodes.hatSegments[i].rotation.set(restTiltX, 0, restTiltZ);
            }
          } else {
            // Normal charge from rest pose
            this.nodes.root.position.copy(this.restPose.rootPos);
            this.nodes.body.position.set(0, -0.05 * p0, 0);
            this.nodes.chest.rotation.set(-0.06 * p0, 0, 0);
            this.nodes.head.rotation.set(this.restPose.headRot.x - 0.08 * p0, this.restPose.headRot.y, 0);

            this.nodes.leftArm.rotation.set(
              this.restPose.leftArmRot.x + 0.20 * p0,
              this.restPose.leftArmRot.y - 0.10 * p0,
              this.restPose.leftArmRot.z + 0.12 * p0
            );
            this.nodes.leftForearm.rotation.set(this.restPose.leftForearmRot.x + 0.10 * p0, 0, 0.12);

            this.nodes.rightArm.rotation.set(
              this.restPose.rightArmRot.x + 0.30 * p0,
              this.restPose.rightArmRot.y,
              this.restPose.rightArmRot.z
            );
            this.nodes.rightForearm.rotation.copy(this.restPose.rightForearmRot);
            this.nodes.staffGroup.rotation.set(
              this.restPose.staffGroupRot.x - 0.25 * p0,
              0,
              this.restPose.staffGroupRot.z - 0.10 * p0
            );

            this.nodes.beardSegments[0].rotation.set(this.restPose.beard0Rot.x, 0, 0);
            this.nodes.beardSegments[1].rotation.set(this.restPose.beard1Rot.x, 0, 0);
            this.nodes.beardSegments[2].rotation.set(this.restPose.beard2Rot.x, 0, 0);

            for (let i = 0; i < 5; i++) {
              const restTiltX = this.hatSpineJoints[i].restTiltX;
              const restTiltZ = this.hatSpineJoints[i].restTiltZ;
              this.nodes.hatSegments[i].rotation.set(restTiltX, 0, restTiltZ);
            }
          }

          const gemPwr = 1.8 + p0 * 1.4;
          this.nodes.gemMesh.material.emissiveIntensity = gemPwr;
          this.nodes.gemLight.intensity = gemPwr * 1.1;
          this.nodes.orbitalRing1.rotation.z += 1.8 * simDt;
          this.nodes.orbitalRing2.rotation.x += 2.0 * simDt;

        } else if (p < 0.80) {
          // CHARGE 30–80%: Torso & staff lift and twist, head follows focus, beard & hat lag, tension increases
          const p1 = (p - 0.30) / 0.50;
          const smooth = p1 * p1 * (3.0 - 2.0 * p1);

          this.nodes.root.position.set(-4.5 - smooth * 0.38, 0, 0);
          this.nodes.body.position.set(0, -0.05 * (1.0 - smooth) + smooth * 0.12, 0);
          this.nodes.chest.rotation.set(-0.06 - smooth * 0.22, smooth * 0.04, 0);
          this.nodes.head.rotation.set(-0.10 - smooth * 0.28, 0.10 * (1.0 - smooth), 0);

          this.nodes.rightArm.rotation.set(
            0.40 + smooth * 1.97,
            -0.15 + smooth * 0.20,
            0.10 - smooth * 0.20
          );
          this.nodes.rightForearm.rotation.set(0.30 - smooth * 0.05, 0, 0);
          this.nodes.staffGroup.rotation.set(
            -0.45 - smooth * 0.95,
            0,
            0.15 - smooth * 0.35
          );

          this.nodes.leftArm.rotation.set(
            0.05 + smooth * 0.75,
            -0.05 - smooth * 0.25,
            -0.20 - smooth * 0.12
          );
          this.nodes.leftForearm.rotation.set(
            0.48 + smooth * 0.42,
            0,
            0.12 + smooth * 0.18
          );

          // Secondary lag: beard and hat lag behind primary body motion
          const flutter = Math.sin(totalTime * 16.0) * (0.05 + smooth * 0.12);
          this.nodes.beardSegments[0].rotation.set(-0.22 - 0.12 * smooth, 0, 0);
          this.nodes.beardSegments[1].rotation.set(-0.12 - 0.20 * smooth + flutter, 0, 0);
          this.nodes.beardSegments[2].rotation.set(0.08 - 0.28 * smooth + flutter * 1.4, 0, 0);

          for (let i = 0; i < 5; i++) {
            const restTiltX = this.hatSpineJoints[i].restTiltX;
            const restTiltZ = this.hatSpineJoints[i].restTiltZ;
            const curveBack = i >= 2 ? (i - 1) * 0.08 * smooth : 0;
            this.nodes.hatSegments[i].rotation.set(restTiltX - curveBack, 0, restTiltZ);
          }

          const gemPwr = 3.2 + smooth * 4.8;
          this.nodes.gemMesh.material.emissiveIntensity = gemPwr;
          this.nodes.gemLight.intensity = gemPwr * 1.2;
          this.nodes.orbitalRing1.rotation.z += (2.2 + smooth * 3.5) * simDt;
          this.nodes.orbitalRing2.rotation.x += (2.5 + smooth * 4.0) * simDt;

        } else {
          // CHARGE 80–100%: Near-held anticipation pose! Large motion slows, energy compresses, tension visibly peaks
          const p2 = (p - 0.80) / 0.20;
          const holdT = Math.sin(p2 * Math.PI * 0.5);

          this.nodes.root.position.set(-4.88 - 0.04 * holdT, 0, 0);
          this.nodes.body.position.set(0, 0.12 + 0.02 * holdT, 0);
          this.nodes.chest.rotation.set(-0.28 - 0.02 * holdT, 0.04, 0);
          this.nodes.head.rotation.set(-0.38 - 0.02 * holdT, 0, 0);

          this.nodes.rightArm.rotation.set(2.37 + 0.03 * holdT, 0.05, -0.10);
          this.nodes.rightForearm.rotation.set(0.25, 0, 0);
          this.nodes.staffGroup.rotation.set(-1.40, 0, -0.20);

          this.nodes.leftArm.rotation.set(0.80 + 0.05 * holdT, -0.30, -0.32);
          this.nodes.leftForearm.rotation.set(0.90, 0, 0.30);

          // Subtle deterministic tension tremor
          const tremor = Math.sin(totalTime * 28.0) * 0.02 * p2;
          this.nodes.beardSegments[0].rotation.set(-0.34, 0, 0);
          this.nodes.beardSegments[1].rotation.set(-0.32 + tremor, 0, 0);
          this.nodes.beardSegments[2].rotation.set(-0.20 + tremor * 1.5, 0, 0);

          for (let i = 0; i < 5; i++) {
            const restTiltX = this.hatSpineJoints[i].restTiltX;
            const restTiltZ = this.hatSpineJoints[i].restTiltZ;
            const curveBack = i >= 2 ? (i - 1) * 0.08 + (i >= 3 ? tremor : 0) : 0;
            this.nodes.hatSegments[i].rotation.set(restTiltX - curveBack, 0, restTiltZ);
          }

          const gemPwr = 8.0 + p2 * 1.5;
          this.nodes.gemMesh.material.emissiveIntensity = gemPwr;
          this.nodes.gemLight.intensity = gemPwr * 1.25;
          this.nodes.orbitalRing1.rotation.z += (5.7 + p2 * 4.0) * simDt;
          this.nodes.orbitalRing2.rotation.x += (6.5 + p2 * 4.5) * simDt;
        }

        if (this.nodes.robeMesh) {
          this.nodes.robeMesh.rotation.y = 0.04 * p;
        }
        this.updateHatMesh();
      }

      setPoseCast(progress, totalTime, simDt = 1/120, blendSnapshot = null) {
        const t = Math.min(1.0, Math.max(0.0, progress));

        if (t < 0.15) {
          // CAST 0–15%: Accelerate through forward strike! Release occurs at exactly 15% (0.195s)
          const snapT = t / 0.15;
          const thrust = Math.sin(snapT * Math.PI * 0.5);

          // Target Strike Apex transforms
          const targetRootX = -3.4;
          const targetBodyY = -0.12;
          const targetChest = { x: 0.32, y: 0, z: 0 };
          const targetHead = { x: 0.15, y: 0.08, z: 0 };
          const targetRightArm = { x: 1.35, y: -0.15, z: 0.05 };
          const targetRightForearm = { x: 0.05, y: 0, z: 0 };
          const targetStaffGroup = { x: -0.15, y: 0, z: 0 };
          const targetLeftArm = { x: -0.75, y: 0, z: -0.42 };
          const targetLeftForearm = { x: 0.30, y: 0, z: 0.10 };

          if (blendSnapshot) {
            // Early manual release: smoothly blend from actual current pose to strike apex
            this.nodes.root.position.x = blendSnapshot.rootPos.x + (targetRootX - blendSnapshot.rootPos.x) * thrust;
            this.nodes.root.position.y = 0;
            this.nodes.root.position.z = 0;
            this.nodes.body.position.set(0, blendSnapshot.bodyPos.y + (targetBodyY - blendSnapshot.bodyPos.y) * thrust, 0);

            this.nodes.chest.rotation.set(
              blendSnapshot.chestRot.x + (targetChest.x - blendSnapshot.chestRot.x) * thrust,
              blendSnapshot.chestRot.y + (targetChest.y - blendSnapshot.chestRot.y) * thrust,
              0
            );
            this.nodes.head.rotation.set(
              blendSnapshot.headRot.x + (targetHead.x - blendSnapshot.headRot.x) * thrust,
              blendSnapshot.headRot.y + (targetHead.y - blendSnapshot.headRot.y) * thrust,
              0
            );
            this.nodes.rightArm.rotation.set(
              blendSnapshot.rightArmRot.x + (targetRightArm.x - blendSnapshot.rightArmRot.x) * thrust,
              blendSnapshot.rightArmRot.y + (targetRightArm.y - blendSnapshot.rightArmRot.y) * thrust,
              blendSnapshot.rightArmRot.z + (targetRightArm.z - blendSnapshot.rightArmRot.z) * thrust
            );
            this.nodes.rightForearm.rotation.set(
              blendSnapshot.rightForearmRot.x + (targetRightForearm.x - blendSnapshot.rightForearmRot.x) * thrust,
              0, 0
            );
            this.nodes.staffGroup.rotation.set(
              blendSnapshot.staffGroupRot.x + (targetStaffGroup.x - blendSnapshot.staffGroupRot.x) * thrust,
              0,
              blendSnapshot.staffGroupRot.z * (1.0 - thrust)
            );
            this.nodes.leftArm.rotation.set(
              blendSnapshot.leftArmRot.x + (targetLeftArm.x - blendSnapshot.leftArmRot.x) * thrust,
              0,
              blendSnapshot.leftArmRot.z + (targetLeftArm.z - blendSnapshot.leftArmRot.z) * thrust
            );
            this.nodes.leftForearm.rotation.set(
              blendSnapshot.leftForearmRot.x + (targetLeftForearm.x - blendSnapshot.leftForearmRot.x) * thrust,
              0,
              blendSnapshot.leftForearmRot.z + (targetLeftForearm.z - blendSnapshot.leftForearmRot.z) * thrust
            );

            this.nodes.beardSegments[0].rotation.set(blendSnapshot.beard0Rot.x + (0.13 - blendSnapshot.beard0Rot.x) * thrust, 0, 0);
            this.nodes.beardSegments[1].rotation.set(blendSnapshot.beard1Rot.x + (0.43 - blendSnapshot.beard1Rot.x) * thrust, 0, 0);
            this.nodes.beardSegments[2].rotation.set(blendSnapshot.beard2Rot.x + (0.83 - blendSnapshot.beard2Rot.x) * thrust, 0, 0);

            for (let i = 0; i < 5; i++) {
              const startX = blendSnapshot.hatRots[i] ? blendSnapshot.hatRots[i].x : this.hatSpineJoints[i].restTiltX;
              const restZ = this.hatSpineJoints[i].restTiltZ;
              const whip = i >= 2 ? (i - 1) * 0.10 * thrust : 0;
              this.nodes.hatSegments[i].rotation.set(startX - whip, 0, restZ);
            }
          } else {
            // Standard transition from full anticipation charge pose to strike apex
            this.nodes.root.position.set(-4.9 + thrust * 1.5, 0, 0);
            this.nodes.body.position.set(0, 0.12 - thrust * 0.24, 0);
            this.nodes.chest.rotation.set(-0.28 + thrust * 0.60, 0.04 * (1.0 - thrust), 0);
            this.nodes.head.rotation.set(-0.38 + thrust * 0.53, 0.08 * thrust, 0);

            this.nodes.rightArm.rotation.set(
              2.37 - thrust * 1.02,
              0.05 - thrust * 0.20,
              -0.10 + thrust * 0.15
            );
            this.nodes.rightForearm.rotation.set(0.25 - thrust * 0.20, 0, 0);
            this.nodes.staffGroup.rotation.set(-1.40 + thrust * 1.25, 0, -0.20 * (1.0 - thrust));

            this.nodes.leftArm.rotation.set(0.80 - thrust * 1.55, -0.30 * (1.0 - thrust), -0.32 - thrust * 0.10);
            this.nodes.leftForearm.rotation.set(0.90 - thrust * 0.60, 0, 0.30 - thrust * 0.20);

            // Beard whips along forward strike
            this.nodes.beardSegments[0].rotation.set(-0.34 + 0.47 * thrust, 0, 0);
            this.nodes.beardSegments[1].rotation.set(-0.32 + 0.75 * thrust, 0, 0);
            this.nodes.beardSegments[2].rotation.set(-0.20 + 1.03 * thrust, 0, 0);

            for (let i = 0; i < 5; i++) {
              const restTiltX = this.hatSpineJoints[i].restTiltX;
              const restTiltZ = this.hatSpineJoints[i].restTiltZ;
              const whip = i >= 2 ? (i - 1) * 0.10 * thrust : 0;
              this.nodes.hatSegments[i].rotation.set(restTiltX - whip, 0, restTiltZ);
            }
          }

          // Explosive Flash Peak at release
          const gemPwr = 9.5 + thrust * 8.5; // up to 18.0 at release
          this.nodes.gemMesh.material.emissiveIntensity = gemPwr;
          this.nodes.gemLight.intensity = gemPwr * 1.2;

        } else if (t < 0.35) {
          // CAST 15–35%: Follow-through & character recoil begins, light falls rapidly, projectile travels
          const ft = (t - 0.15) / 0.20;
          const recoil = Math.sin(ft * Math.PI * 0.5);

          this.nodes.root.position.set(-3.4 - recoil * 0.2, 0, 0);
          this.nodes.body.position.set(0, -0.12 + recoil * 0.04, 0);
          this.nodes.chest.rotation.set(0.32 - recoil * 0.08, 0, 0);
          this.nodes.head.rotation.set(0.15 - recoil * 0.05, 0.08, 0);

          this.nodes.rightArm.rotation.set(1.35, -0.15, 0.05);
          this.nodes.rightForearm.rotation.set(0.05, 0, 0);
          this.nodes.staffGroup.rotation.set(-0.15, 0, 0);

          this.nodes.leftArm.rotation.set(-0.75, 0, -0.42);
          this.nodes.leftForearm.rotation.set(0.30, 0, 0.10);

          this.nodes.beardSegments[0].rotation.set(0.13 - 0.15 * ft, 0, 0);
          this.nodes.beardSegments[1].rotation.set(0.43 - 0.25 * ft, 0, 0);
          this.nodes.beardSegments[2].rotation.set(0.83 - 0.40 * ft, 0, 0);

          for (let i = 0; i < 5; i++) {
            const restTiltX = this.hatSpineJoints[i].restTiltX;
            const restTiltZ = this.hatSpineJoints[i].restTiltZ;
            const whip = i >= 2 ? (i - 1) * 0.10 * (1.0 - ft * 0.4) : 0;
            this.nodes.hatSegments[i].rotation.set(restTiltX - whip, 0, restTiltZ);
          }

          // Light falls from peak
          const gemPwr = 18.0 * (1.0 - ft) + 4.5 * ft;
          this.nodes.gemMesh.material.emissiveIntensity = gemPwr;
          this.nodes.gemLight.intensity = gemPwr * 1.1;

        } else {
          // CAST 35–100%: Character relaxes from strike, projectile / impact aftermath continues independently
          const relaxT = (t - 0.35) / 0.65;
          const recoilDecay = Math.exp(-relaxT * 3.0);

          this.nodes.root.position.set(-3.6, 0, 0);
          this.nodes.body.position.set(0, -0.08 * (1.0 - relaxT * 0.5), 0);
          this.nodes.chest.rotation.set(0.24 * (1.0 - relaxT * 0.3), 0, 0);
          this.nodes.head.rotation.set(0.10 * (1.0 - relaxT * 0.3), 0.08, 0);

          this.nodes.rightArm.rotation.set(1.35, -0.15, 0.05);
          this.nodes.rightForearm.rotation.set(0.05, 0, 0);
          this.nodes.staffGroup.rotation.set(-0.15, 0, 0);

          this.nodes.leftArm.rotation.set(-0.75, 0, -0.42);
          this.nodes.leftForearm.rotation.set(0.30, 0, 0.10);

          const ripple = Math.sin(totalTime * 12.0) * recoilDecay * 0.12;
          this.nodes.beardSegments[0].rotation.set(-0.02 - 0.20 * (1.0 - recoilDecay), 0, 0);
          this.nodes.beardSegments[1].rotation.set(0.18 - 0.30 * (1.0 - recoilDecay) + ripple, 0, 0);
          this.nodes.beardSegments[2].rotation.set(0.43 - 0.35 * (1.0 - recoilDecay) + ripple * 1.4, 0, 0);

          for (let i = 0; i < 5; i++) {
            const restTiltX = this.hatSpineJoints[i].restTiltX;
            const restTiltZ = this.hatSpineJoints[i].restTiltZ;
            const whip = i >= 2 ? (i - 1) * 0.06 * recoilDecay : 0;
            this.nodes.hatSegments[i].rotation.set(restTiltX - whip, 0, restTiltZ);
          }

          const gemPwr = Math.max(1.8, 4.5 * (1.0 - relaxT) + 1.8 * relaxT);
          this.nodes.gemMesh.material.emissiveIntensity = gemPwr;
          this.nodes.gemLight.intensity = gemPwr * 1.0;
        }

        this.nodes.orbitalRing1.rotation.z += 1.8 * simDt;
        this.nodes.orbitalRing2.rotation.x += 2.2 * simDt;

        if (this.nodes.robeMesh) {
          this.nodes.robeMesh.rotation.y = 0.02;
        }
        this.updateHatMesh();
      }

      setPoseRecover(progress, totalTime, simDt = 1/120) {
        const p = Math.min(1.0, Math.max(0.0, progress));

        if (p < 0.60) {
          // RECOVER 0–60%: Torso, staff, arms move steadily back toward rest
          const u = p / 0.60;
          const smoothU = u * u * (3.0 - 2.0 * u);

          this.nodes.root.position.set(-3.6 * (1.0 - smoothU) + this.restPose.rootPos.x * smoothU, 0, 0);
          this.nodes.body.position.set(0, -0.04 * (1.0 - smoothU) + this.restPose.bodyPos.y * smoothU, 0);
          this.nodes.chest.rotation.set(0.168 * (1.0 - smoothU) + this.restPose.chestRot.x * smoothU, 0, 0);
          this.nodes.head.rotation.set(
            0.07 * (1.0 - smoothU) + this.restPose.headRot.x * smoothU,
            0.08 * (1.0 - smoothU) + this.restPose.headRot.y * smoothU,
            0
          );

          this.nodes.rightArm.rotation.set(
            1.35 * (1.0 - smoothU) + this.restPose.rightArmRot.x * smoothU,
            -0.15 * (1.0 - smoothU) + this.restPose.rightArmRot.y * smoothU,
            0.05 * (1.0 - smoothU) + this.restPose.rightArmRot.z * smoothU
          );
          this.nodes.rightForearm.rotation.set(
            0.05 * (1.0 - smoothU) + this.restPose.rightForearmRot.x * smoothU,
            0, 0
          );
          this.nodes.staffGroup.rotation.set(
            -0.15 * (1.0 - smoothU) + this.restPose.staffGroupRot.x * smoothU,
            0,
            this.restPose.staffGroupRot.z * smoothU
          );

          this.nodes.leftArm.rotation.set(
            -0.75 * (1.0 - smoothU) + this.restPose.leftArmRot.x * smoothU,
            0.0 * (1.0 - smoothU) + this.restPose.leftArmRot.y * smoothU,
            -0.42 * (1.0 - smoothU) + this.restPose.leftArmRot.z * smoothU
          );
          this.nodes.leftForearm.rotation.set(
            0.30 * (1.0 - smoothU) + this.restPose.leftForearmRot.x * smoothU,
            0,
            0.10 * (1.0 - smoothU) + this.restPose.leftForearmRot.z * smoothU
          );

          this.nodes.beardSegments[0].rotation.set(this.restPose.beard0Rot.x, 0, 0);
          this.nodes.beardSegments[1].rotation.set(this.restPose.beard1Rot.x + 0.15 * (1.0 - smoothU), 0, 0);
          this.nodes.beardSegments[2].rotation.set(this.restPose.beard2Rot.x + 0.25 * (1.0 - smoothU), 0, 0);

          for (let i = 0; i < 5; i++) {
            const restTiltX = this.hatSpineJoints[i].restTiltX;
            const restTiltZ = this.hatSpineJoints[i].restTiltZ;
            const resWhip = i >= 2 ? (i - 1) * 0.03 * (1.0 - smoothU) : 0;
            this.nodes.hatSegments[i].rotation.set(restTiltX - resWhip, 0, restTiltZ);
          }

        } else {
          // RECOVER 60–100%: Beard, hat tip, and secondary motion finish settling into exact rest
          const v = (p - 0.60) / 0.40;
          const smoothV = v * v * (3.0 - 2.0 * v);
          const settleDecay = 1.0 - smoothV;
          const settle = Math.sin(v * Math.PI * 3.0) * 0.06 * settleDecay;

          // Body & limbs strictly at rest
          this.nodes.root.position.copy(this.restPose.rootPos);
          this.nodes.body.position.set(0, 0, 0);
          this.nodes.chest.rotation.set(0, 0, 0);
          this.nodes.head.rotation.copy(this.restPose.headRot);

          this.nodes.rightArm.rotation.copy(this.restPose.rightArmRot);
          this.nodes.rightForearm.rotation.copy(this.restPose.rightForearmRot);
          this.nodes.staffGroup.rotation.copy(this.restPose.staffGroupRot);

          this.nodes.leftArm.rotation.copy(this.restPose.leftArmRot);
          this.nodes.leftForearm.rotation.copy(this.restPose.leftForearmRot);

          // Subtle tip settling
          this.nodes.beardSegments[0].rotation.set(this.restPose.beard0Rot.x, 0, 0);
          this.nodes.beardSegments[1].rotation.set(this.restPose.beard1Rot.x + settle, 0, 0);
          this.nodes.beardSegments[2].rotation.set(this.restPose.beard2Rot.x + settle * 1.4, 0, 0);

          for (let i = 0; i < 5; i++) {
            const restTiltX = this.hatSpineJoints[i].restTiltX;
            const restTiltZ = this.hatSpineJoints[i].restTiltZ;
            const tipSettle = i >= 3 ? Math.sin(v * Math.PI * 2.5) * 0.03 * settleDecay : 0;
            this.nodes.hatSegments[i].rotation.set(restTiltX - tipSettle, 0, restTiltZ);
          }
        }

        const gemPwr = 1.8 + Math.sin(totalTime * 2.0) * 0.2;
        this.nodes.gemMesh.material.emissiveIntensity = gemPwr;
        this.nodes.gemLight.intensity = gemPwr * 1.0;
        this.nodes.orbitalRing1.rotation.z += 1.0 * simDt;
        this.nodes.orbitalRing2.rotation.x += 1.2 * simDt;

        if (this.nodes.robeMesh) {
          this.nodes.robeMesh.rotation.y = 0;
        }
        this.updateHatMesh();
      }
    }

    // Narrow Character Adapter boundary for Phase 4+ and GLB interoperability
    class CharacterAdapter {
      constructor(character) {
        this.character = character;
      }

      applyPose(sample, simDt, blendSnapshot = null, recoverySnapshot = null) {
        if (!sample) return;
        const state = sample.state;
        const progress = sample.progress;
        const totalTime = sample.totalTime;
        const chargeEnergy = sample.chargeEnergy;

        if (state === 0) { // IDLE
          this.character.setPoseIdle(progress, totalTime, simDt);
        } else if (state === 1) { // CHARGE
          this.character.setPoseCharge(progress, totalTime, simDt, chargeEnergy, recoverySnapshot);
        } else if (state === 2) { // CAST
          this.character.setPoseCast(progress, totalTime, simDt, blendSnapshot);
        } else if (state === 3) { // RECOVER
          this.character.setPoseRecover(progress, totalTime, simDt);
        }
      }

      capturePoseSnapshot() {
        return this.character.capturePoseSnapshot();
      }

      resetToRest() {
        this.character.resetToRest();
      }

      getGemWorldPosition(outVec) {
        return this.character.getGemWorldPosition(outVec);
      }

      getSpellDirection(outVec, targetPos) {
        this.character.getGemWorldPosition(outVec);
        return outVec.subVectors(targetPos, outVec).normalize();
      }

      getAttachment(name, outTransform) {
        if (name === 'gem' && this.character.nodes.gemMesh) {
          outTransform.copy(this.character.nodes.gemMesh.matrixWorld);
        } else if (name === 'head' && this.character.nodes.head) {
          outTransform.copy(this.character.nodes.head.matrixWorld);
        }
        return outTransform;
      }

      getBounds(outBox) {
        outBox.setFromObject(this.character.group);
        return outBox;
      }

      dispose() {
        this.character.group.traverse((obj) => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
            else obj.material.dispose();
          }
        });
      }
    }

    // =========================================================================
    // 4. ENVIRONMENT & TARGET MONOLITH BUILDER (Phases 1 & 2)
    // =========================================================================
    class EnvironmentBuilder {
      constructor(scene) {
        this.scene = scene;
        this.runesMesh = null;
        this.localRunesMesh = null;
        this.monolithRunes = [];
        this.monolithLight = null;
        this.targetMonolith = null;
        this.mistPlanes = [];
        this.starsMesh = null;
        this.stoneTex = null;
        this.runeTex = null;
        this.localRuneTex = null;
        this.moonTex = null;

        this.buildEnvironment();

          { x: -9.5, z: -5.5, h: 5.8, rot: 0.08 },

        // --- 4. The Target Monolith ---
        this.targetMonolith = new THREE.Group();

        const monoGeo = new THREE.CylinderGeometry(0.8, 1.5, 7.5, 6);

        // Glowing Arcane Ward Sigils on Monolith Face
        for (let i = 0; i < 4; i++) {

        // --- 5. Massive Radiant Moon ---
        this.moonTex = Textures.createMoonTexture();
        const moonGeo = new THREE.SphereGeometry(7.5, 32, 32);
        const matMoon = new THREE.MeshBasicMaterial({

        });
        const moonMesh = new THREE.Mesh(moonGeo, matMoon);
        moonMesh.position.set(-8.5, 15.5, -36.0);
        this.scene.add(moonMesh);

        // Soft Moon Atmospheric Halo
        const haloGeo = new THREE.SphereGeometry(8.6, 32, 32);
        const matHalo = new THREE.MeshBasicMaterial({
          color: 0x608ad8,
          transparent: true,
          opacity: 0.18,
          blending: THREE.AdditiveBlending,
          side: THREE.BackSide
        });
        const haloMesh = new THREE.Mesh(haloGeo, matHalo);
        haloMesh.position.copy(moonMesh.position);
        this.scene.add(haloMesh);

        // --- 6. Distant Mountain Silhouette Ranges ---
        const mountainMats = [
          new THREE.MeshBasicMaterial({ color: 0x121428 }),
          new THREE.MeshBasicMaterial({ color: 0x090a16 })
        ];

        for (let m = 0; m < 2; m++) {
          const numPeaks = 9;
          const dist = m === 0 ? 55 : 85;
          const yBase = m === 0 ? -12 : -18;
          for (let p = 0; p < numPeaks; p++) {
            const peakGeo = new THREE.ConeGeometry(14 + p * 3, 26 + (p % 4) * 8, 4);
            const peakMesh = new THREE.Mesh(peakGeo, mountainMats[m]);
            const angle = ((p - numPeaks / 2) * 0.28);
            peakMesh.position.set(
              Math.sin(angle) * dist,
              yBase + (p % 3) * 3,
              -Math.cos(angle) * dist
            );
            peakMesh.rotation.y = p * 0.8;
            this.scene.add(peakMesh);
          }
        }

        // --- 7. Twinkling Starfield ---
        const starCount = 1400;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        const paletteStars = [
          new THREE.Color(0xffffff),
          new THREE.Color(0xb2d4ff),
          new THREE.Color(0x8ee8ff),
          new THREE.Color(0xffd5a3)
        ];

        for (let i = 0; i < starCount; i++) {
          const theta = rng.next() * Math.PI * 2;
          const phi = Math.acos(rng.next() * 0.95);
          const r = 95 + rng.next() * 15;

          starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          starPositions[i * 3 + 1] = r * Math.cos(phi) - 2;
          starPositions[i * 3 + 2] = -Math.abs(r * Math.sin(phi) * Math.sin(theta));

          const col = paletteStars[Math.floor(rng.next() * paletteStars.length)];
          starColors[i * 3] = col.r;
          starColors[i * 3 + 1] = col.g;
          starColors[i * 3 + 2] = col.b;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const matStar = new THREE.PointsMaterial({
          size: 1.3,
          vertexColors: true,
          transparent: true,
          opacity: 0.82,
          map: Textures.createSparkleSprite(),
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        this.starsMesh = new THREE.Points(starGeo, matStar);
        this.scene.add(this.starsMesh);

        // --- 8. Ground Mist Layers ---
        for (let i = 0; i < 3; i++) {
          const mistGeo = new THREE.PlaneGeometry(36, 36);
          const matMist = new THREE.MeshBasicMaterial({
            color: 0x141e38,
            transparent: true,
            opacity: 0.10 - i * 0.025,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const mistPlane = new THREE.Mesh(mistGeo, matMist);
          mistPlane.rotation.x = -Math.PI / 2;
          mistPlane.position.set(0, 0.1 + i * 0.35, 0);
          this.scene.add(mistPlane);
          this.mistPlanes.push(mistPlane);
        }
      }

      getStrikeTarget(outVec = new THREE.Vector3()) {
        return outVec.set(10.2, 3.4, 0.0);
      }

      getStrikeNormal(outVec = new THREE.Vector3()) {
        return outVec.set(-1.0, 0.0, 0.0);
      }

      update(time, floorRuneResponse, simDt = 1/120) {
        if (this.runesMesh) {
          this.runesMesh.rotation.z += 0.04 * simDt;
          const baseAlpha = 0.18 + 0.04 * Math.sin(time * 2.0);
          this.runesMesh.material.opacity = baseAlpha; // Broad dais remains quiet and subordinate
        }

        if (this.localRunesMesh) {
          this.localRunesMesh.rotation.z -= 0.06 * simDt;
          this.localRunesMesh.material.opacity = floorRuneResponse; // Localized gradient response near wizard
        }

        this.mistPlanes.forEach((plane, idx) => {
          plane.rotation.z += (0.015 + idx * 0.01) * simDt;
        });

        if (this.starsMesh) {
          this.starsMesh.material.size = 1.2 + 0.25 * Math.sin(time * 3.5);
        }
      }

      triggerImpactFlash() {
        if (this.monolithLight) {
          this.monolithLight.intensity = 26.0;
          this.monolithLight.position.set(9.8, 3.4, 0.0);
        }
        this.monolithRunes.forEach((r) => {
          r.material.emissiveIntensity = 8.5;
        });
      }

      decayImpactLight(dt) {
        const decay = Math.exp(-6.5 * dt);
        if (this.monolithLight) {
          this.monolithLight.intensity *= decay;
          if (this.monolithLight.intensity < 0.01) this.monolithLight.intensity = 0.0;
        }
        this.monolithRunes.forEach((r) => {
          if (r.material.emissiveIntensity > 1.2) {
            r.material.emissiveIntensity = 1.2 + (r.material.emissiveIntensity - 1.2) * decay;
          }
        });
      }

      dispose() {
        if (this.stoneTex) this.stoneTex.dispose();
        if (this.runeTex) this.runeTex.dispose();
        if (this.localRuneTex) this.localRuneTex.dispose();
        if (this.moonTex) this.moonTex.dispose();
