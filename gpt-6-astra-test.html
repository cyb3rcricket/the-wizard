<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Moonlit Spell</title>
  <style>
    :root { background: #120f2b; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #120f2b;
    }
    body {
      display: grid;
      place-items: center;
    }
    canvas {
      display: block;
      width: 128px;
      height: 96px;
      image-rendering: pixelated;
      background: #120f2b;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="A pixel art wizard casting a spell under a moonlit sky"></canvas>
  <script>
  (() => {
    'use strict';

    const canvas = document.getElementById('scene');
    const logicalCanvas = document.createElement('canvas');
    logicalCanvas.width = 128;
    logicalCanvas.height = 96;
    const ctx = logicalCanvas.getContext('2d', { alpha: false });
    const displayCtx = canvas.getContext('2d', { alpha: false });
    ctx.imageSmoothingEnabled = false;
    displayCtx.imageSmoothingEnabled = false;

    // One compact, deliberately limited 16-bit palette. Every visible pixel is painted from here.
    const palette = [
      '#120f2b', '#1d1740', '#2a2058', '#3a2f75', '#52428d', '#7a65b0',
      '#b7a6df', '#f3d7b1', '#d69a7b', '#5a304f', '#7b3d5d', '#a95061',
      '#d16b63', '#eb9870', '#f7bd7a', '#f8db92', '#f6ebc9', '#e7f4ee',
      '#58ddd1', '#2da6bd', '#6b66ff', '#b765ff', '#f7d34f', '#3d5270'
    ];

    const IDLE = 0;
    const CHARGE = 1;
    const CAST = 2;
    const RECOVER = 3;

    const IDLE_TICKS = 78;
    const CHARGE_TICKS = 54;
    const CAST_TICKS = 84;
    const RECOVER_TICKS = 42;
    const POOL_SIZE = 96;

    const particleActive = new Uint8Array(POOL_SIZE);
    const particleX = new Float32Array(POOL_SIZE);
    const particleY = new Float32Array(POOL_SIZE);
    const particleVX = new Float32Array(POOL_SIZE);
    const particleVY = new Float32Array(POOL_SIZE);
    const particleLife = new Uint8Array(POOL_SIZE);
    const particleMaxLife = new Uint8Array(POOL_SIZE);
    const particleKind = new Uint8Array(POOL_SIZE);
    const particleSize = new Uint8Array(POOL_SIZE);
    const particleOrbit = new Uint8Array(POOL_SIZE);
    const particleOrbitAngle = new Float32Array(POOL_SIZE);
    const particleOrbitRadius = new Float32Array(POOL_SIZE);
    let particleCursor = 0;

    let phase = IDLE;
    let stateTick = 0;
    let worldTick = 0;
    let poseFrame = 0;
    let rngState = 0x27a93d;
    let projectileActive = 0;
    let projectileX = 0;
    let projectileY = 0;
    let projectileTick = 0;
    let shakeTicks = 0;
    let shakeX = 0;
    let shakeY = 0;
    let renderScale = 1;
    let renderOffsetX = 0;
    let renderOffsetY = 0;
    let spriteMode = 0;

    // Pose values ease every 60 Hz simulation step; rendering samples them at 10 Hz for sprite snap.
    let staffAngle = -1.08;
    let armRaise = 0;
    let headTilt = 0;
    let robeSway = 0;
    let drawStaffAngle = staffAngle;
    let drawArmRaise = armRaise;
    let drawHeadTilt = headTilt;
    let drawRobeSway = robeSway;

    let lastTime = 0;
    let accumulator = 0;
    const STEP_MS = 1000 / 60;

    function resize() {
      const viewportWidth = Math.max(1, window.innerWidth | 0);
      const viewportHeight = Math.max(1, window.innerHeight | 0);
      const scaleX = Math.floor(viewportWidth / 128);
      const scaleY = Math.floor(viewportHeight / 96);
      renderScale = Math.max(1, Math.min(scaleX || 1, scaleY || 1));
      renderOffsetX = Math.floor((viewportWidth - 128 * renderScale) * 0.5);
      renderOffsetY = Math.floor((viewportHeight - 96 * renderScale) * 0.5);
      canvas.width = viewportWidth;
      canvas.height = viewportHeight;
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      displayCtx.imageSmoothingEnabled = false;
    }

    function nextRandom() {
      rngState = (rngState * 1664525 + 1013904223) >>> 0;
      return rngState / 4294967296;
    }

    function clearParticles() {
      let i = 0;
      while (i < POOL_SIZE) {
        particleActive[i] = 0;
        particleOrbit[i] = 0;
        i++;
      }
    }

    function spawnParticle(x, y, vx, vy, life, kind, size) {
      let i = particleCursor;
      let checked = 0;
      while (checked < POOL_SIZE && particleActive[i]) {
        i = (i + 1) % POOL_SIZE;
        checked++;
      }
      particleCursor = (i + 1) % POOL_SIZE;
      particleActive[i] = 1;
      particleX[i] = x;
      particleY[i] = y;
      particleVX[i] = vx;
      particleVY[i] = vy;
      particleLife[i] = life;
      particleMaxLife[i] = life;
      particleKind[i] = kind;
      particleSize[i] = size;
      particleOrbit[i] = 0;
      return i;
    }

    function spawnChargeSpark() {
      const tipX = getGemX();
      const tipY = getGemY(true);
      const a = nextRandom() * Math.PI * 2;
      const radius = 5 + nextRandom() * 8;
      const px = tipX + Math.cos(a) * radius;
      const py = tipY + Math.sin(a) * radius * 0.62;
      const dx = tipX - px;
      const dy = tipY - py;
      const tangent = a + Math.PI * 0.5;
      const slot = spawnParticle(px, py, dx * 0.075 + Math.cos(tangent) * 0.18, dy * 0.075 + Math.sin(tangent) * 0.18, 18 + ((worldTick * 7) % 13), worldTick & 1, 1);
      particleOrbit[slot] = 1;
      particleOrbitAngle[slot] = a;
      particleOrbitRadius[slot] = radius;
    }

    function spawnCastBurst() {
      const tipX = getGemX();
      const tipY = getGemY(true);
      let i = 0;
      while (i < 30) {
        const a = nextRandom() * Math.PI * 2;
        const speed = 0.28 + nextRandom() * 0.8;
        spawnParticle(tipX, tipY, Math.cos(a) * speed, Math.sin(a) * speed * 0.72, 18 + ((i * 3) % 19), i % 3, i % 4 === 0 ? 2 : 1);
        i++;
      }
      projectileActive = 1;
      projectileTick = 0;
      projectileX = tipX;
      projectileY = tipY;
      shakeTicks = 8;
    }

    function getWizardSway() {
      return Math.round(drawRobeSway * 1.2);
    }

    function getHandX() {
      return 36 + getWizardSway() + 15 + Math.round(drawArmRaise * 2);
    }

    function getHandY() {
      return 57 - Math.round(drawArmRaise * 8) + (poseFrame ? 0 : -1);
    }

    // Compress only authored wizard rows around the grounded feet: 48 source pixels become 32 logical pixels.
    function compressSpriteY(y) {
      return 77 - Math.round((77 - y) * 0.68);
    }

    function getGemX() {
      return Math.round(getHandX() + Math.cos(drawStaffAngle) * 23);
    }

    function getGemY(displayY) {
      const rawY = Math.round(getHandY() + Math.sin(drawStaffAngle) * 23);
      return displayY ? compressSpriteY(rawY) : rawY;
    }

    function enterPhase(nextPhase) {
      phase = nextPhase;
      stateTick = 0;
      if (nextPhase === CAST) {
        spawnCastBurst();
      } else if (nextPhase === RECOVER) {
        projectileActive = 0;
      } else if (nextPhase === IDLE) {
        clearParticles();
      }
    }

    function updateParticles() {
      let i = 0;
      while (i < POOL_SIZE) {
        if (particleActive[i]) {
          if (particleOrbit[i]) {
            particleOrbitAngle[i] += 0.34;
            particleOrbitRadius[i] *= 0.91;
            particleX[i] = getGemX() + Math.cos(particleOrbitAngle[i]) * particleOrbitRadius[i];
            particleY[i] = getGemY(true) + Math.sin(particleOrbitAngle[i]) * particleOrbitRadius[i] * 0.62;
            if (particleOrbitRadius[i] < 1.2) particleOrbit[i] = 0;
          } else {
            particleX[i] += particleVX[i];
            particleY[i] += particleVY[i];
            particleVX[i] *= 0.982;
            particleVY[i] = particleVY[i] * 0.982 + 0.006;
          }
          particleLife[i]--;
          if (particleLife[i] === 0 || particleX[i] < -4 || particleX[i] > 132 || particleY[i] < -4 || particleY[i] > 100) {
            particleActive[i] = 0;
          }
        }
        i++;
      }
    }

    function updatePose() {
      let targetAngle = -1.08;
      let targetArm = 0;
      let targetHead = 0;
      let targetRobe = 0;
      if (phase === CHARGE) {
        const p = stateTick / CHARGE_TICKS;
        targetAngle = -1.08 - Math.min(1, p) * 0.44;
        targetArm = Math.min(1, p * 1.22);
        targetHead = -0.8 * Math.min(1, p * 1.3);
        targetRobe = Math.sin(worldTick * 0.11) * 0.6;
      } else if (phase === CAST) {
        targetAngle = -1.54 + Math.sin(stateTick * 0.16) * 0.05;
        targetArm = 1;
        targetHead = -0.8;
        targetRobe = Math.sin(worldTick * 0.13) * 0.9;
      } else if (phase === RECOVER) {
        const p = stateTick / RECOVER_TICKS;
        targetAngle = -1.54 + Math.min(1, p) * 0.46;
        targetArm = Math.max(0, 1 - p * 1.2);
        targetHead = -0.8 + Math.min(1, p) * 0.8;
        targetRobe = Math.sin(worldTick * 0.1) * 0.45;
      } else {
        targetRobe = Math.sin(worldTick * 0.075) * 0.7;
      }
      staffAngle += (targetAngle - staffAngle) * 0.18;
      armRaise += (targetArm - armRaise) * 0.2;
      headTilt += (targetHead - headTilt) * 0.17;
      robeSway += (targetRobe - robeSway) * 0.2;
      if ((worldTick % 6) === 0) {
        poseFrame = (poseFrame + 1) & 1;
        drawStaffAngle = staffAngle;
        drawArmRaise = armRaise;
        drawHeadTilt = headTilt;
        drawRobeSway = robeSway;
      }
    }

    function update() {
      worldTick++;
      stateTick++;
      updatePose();

      if (phase === IDLE) {
        if ((worldTick % 19) === 0) {
          spawnParticle(75 + nextRandom() * 40, 65 + nextRandom() * 11, -0.015, -0.04, 24, 2, 1);
        }
        if (stateTick >= IDLE_TICKS) enterPhase(CHARGE);
      } else if (phase === CHARGE) {
        if ((stateTick % 3) === 0) spawnChargeSpark();
        if (stateTick >= CHARGE_TICKS) enterPhase(CAST);
      } else if (phase === CAST) {
        if (projectileActive) {
          projectileTick++;
          projectileX += 0.96;
          projectileY += Math.sin(projectileTick * 0.22) * 0.08;
          if ((projectileTick % 2) === 0) {
            spawnParticle(projectileX - 2, projectileY, -0.13, (nextRandom() - 0.5) * 0.08, 12 + ((projectileTick * 5) % 9), projectileTick % 3, 1);
          }
          if (projectileX > 119) projectileActive = 0;
        }
        if (shakeTicks > 0) shakeTicks--;
        if (stateTick >= CAST_TICKS) enterPhase(RECOVER);
      } else if (phase === RECOVER) {
        if ((stateTick % 9) === 0) spawnParticle(61 + nextRandom() * 10, 48 + nextRandom() * 6, 0.08, -0.08, 15, 1, 1);
        if (stateTick >= RECOVER_TICKS) enterPhase(IDLE);
      }

      updateParticles();
      if (shakeTicks > 0) {
        shakeX = ((worldTick * 13) & 3) - 1;
        shakeY = ((worldTick * 7) & 3) - 1;
      } else {
        shakeX = 0;
        shakeY = 0;
      }
    }

    function box(x, y, w, h, color) {
      if (spriteMode) {
        const top = compressSpriteY(y);
        const bottom = compressSpriteY(y + h);
        y = top;
        h = Math.max(1, bottom - top);
      }
      ctx.fillStyle = palette[color];
      ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
    }

    function line(x0, y0, x1, y1, color, width) {
      if (spriteMode) {
        y0 = compressSpriteY(y0);
        y1 = compressSpriteY(y1);
      }
      ctx.fillStyle = palette[color];
      let dx = Math.abs(x1 - x0);
      let sx = x0 < x1 ? 1 : -1;
      let dy = -Math.abs(y1 - y0);
      let sy = y0 < y1 ? 1 : -1;
      let error = dx + dy;
      while (true) {
        ctx.fillRect(x0, y0, width, width);
        if (x0 === x1 && y0 === y1) break;
        const twice = error * 2;
        if (twice >= dy) { error += dy; x0 += sx; }
        if (twice <= dx) { error += dx; y0 += sy; }
      }
    }

    function drawSky() {
      const twinkle = ((worldTick / 12) | 0) & 1;
      box(0, 0, 128, 96, 0);
      box(0, 28, 128, 51, 1);
      box(0, 49, 128, 30, 2);
      box(0, 66, 128, 13, 3);

      // Sparse square stars and two tiny nebula runs.
      box(8, 13, 1, 1, twinkle ? 17 : 6); box(16, 29, 1, 1, 5); box(28, 9, 2, 1, twinkle ? 6 : 17);
      box(41, 18, 1, 1, 5); box(57, 8, 1, 1, twinkle ? 17 : 6); box(68, 24, 2, 1, 5);
      box(80, 11, 1, 1, twinkle ? 6 : 17); box(114, 8, 1, 1, 6); box(119, 30, 2, 1, 5);
      box(7, 41, 1, 1, 5); box(94, 35, 1, 1, 6); box(104, 25, 1, 1, 5);
      box(73, 14, 1, 1, 4); box(86, 44, 2, 1, 4);
      box(2, 23, 1, 1, 4); box(23, 21, 1, 1, 3); box(109, 48, 1, 1, 4);

      // Blocky moon with a cool edge and warm face.
      box(99, 13, 7, 1, 5); box(96, 14, 12, 2, 5); box(94, 16, 15, 7, 5);
      box(96, 23, 11, 3, 5); box(99, 26, 6, 1, 5);
      box(97, 16, 11, 7, 7); box(99, 14, 7, 1, 16); box(96, 18, 2, 3, 15);
      box(104, 19, 3, 3, 15); box(101, 23, 3, 1, 8);

      // Far hills and a few glowing horizon windows.
      box(0, 67, 17, 12, 2); box(14, 64, 17, 15, 2); box(28, 68, 15, 11, 2);
      box(89, 66, 15, 13, 2); box(102, 62, 17, 17, 2); box(117, 68, 11, 11, 2);
      box(21, 72, 2, 2, 5); box(26, 70, 1, 3, 5); box(105, 69, 2, 2, 5); box(112, 67, 1, 3, 5);
    }

    function drawFloor() {
      box(0, 79, 128, 17, 1);
      box(0, 82, 128, 14, 2);
      box(0, 88, 128, 8, 1);
      // Staggered floor stones: short runs keep the ground hand-pixeled.
      box(2, 83, 19, 1, 3); box(26, 82, 12, 2, 4); box(43, 84, 22, 1, 3); box(70, 82, 18, 2, 4); box(94, 84, 29, 1, 3);
      box(0, 90, 10, 1, 4); box(14, 88, 18, 2, 3); box(37, 90, 15, 1, 4); box(58, 88, 24, 2, 3); box(87, 90, 13, 1, 4); box(106, 88, 21, 2, 3);
      box(5, 94, 24, 1, 3); box(34, 93, 13, 2, 4); box(53, 95, 22, 1, 3); box(80, 93, 22, 2, 4); box(108, 95, 16, 1, 3);
    }

    function drawParticles() {
      let i = 0;
      while (i < POOL_SIZE) {
        if (particleActive[i]) {
          const life = particleLife[i];
          const max = particleMaxLife[i];
          let color = 3;
          if (life > max * 0.72) {
            color = 17;
          } else if (life > max * 0.25) {
            const kind = particleKind[i];
            color = kind === 0 ? 18 : (kind === 1 ? 20 : 22);
          } else {
            color = particleKind[i] === 2 ? 10 : 3;
          }
          box(Math.round(particleX[i]), Math.round(particleY[i]), particleSize[i], particleSize[i], color);
        }
        i++;
      }
    }

    function drawGem(x, y, bright) {
      box(x - 2, y, 5, 3, 2);
      box(x - 1, y - 1, 3, 5, 2);
      box(x - 1, y, 3, 3, bright ? 22 : 20);
      box(x, y, 1, 1, 17);
      // The right-facing rim catches the charge and cast light.
      box(x + 2, y, 1, 2, bright ? 17 : 19);
      box(x - 1, y + 2, 1, 1, bright ? 15 : 19);
    }

    function drawSpellSpiral() {
      if (phase !== CHARGE) return;
      const cx = getGemX();
      const cy = getGemY(true);
      const step = (worldTick / 6) | 0;
      const wobble = step & 1;
      box(cx - 7, cy - 1 + wobble, 2, 1, 20);
      box(cx - 5, cy - 3, 2, 1, 21);
      box(cx - 2, cy - 5, 2, 1, 18);
      box(cx + 1, cy - 4, 2, 1, 21);
      box(cx + 4, cy - 2, 2, 1, 18);
      box(cx + 5, cy + 1, 2, 1, 20);
      box(cx + 2, cy + 3, 2, 1, 21);
      box(cx - 1, cy + 4, 2, 1, 18);
      if (wobble) box(cx - 6, cy + 3, 1, 1, 17);
    }

    function drawCastBurst() {
      if (phase !== CAST || stateTick > 14) return;
      const cx = getGemX();
      const cy = getGemY(true);
      const pulse = stateTick & 1;
      box(cx - 6 - pulse, cy, 3, 1, 17);
      box(cx + 4, cy, 3 + pulse, 1, 22);
      box(cx, cy - 6 - pulse, 1, 3, 17);
      box(cx, cy + 4, 1, 3 + pulse, 22);
      box(cx - 3, cy - 3, 1, 1, 22);
      box(cx + 3, cy - 3, 1, 1, 17);
      box(cx - 3, cy + 3, 1, 1, 18);
      box(cx + 3, cy + 3, 1, 1, 22);
    }

    function drawProjectile() {
      if (!projectileActive) return;
      const x = Math.round(projectileX);
      const y = Math.round(projectileY);
      box(x - 4, y, 3, 1, 20);
      box(x - 2, y - 2, 5, 5, 2);
      box(x - 1, y - 1, 3, 3, 21);
      box(x, y, 1, 1, 17);
      if ((projectileTick & 2) === 0) box(x + 3, y - 1, 1, 2, 22);
    }

    function drawWizard() {
      spriteMode = 1;
      const bob = poseFrame ? 0 : -1;
      const sway = getWizardSway();
      const bx = 36 + sway;
      const by = bob;
      const headLean = Math.round(drawHeadTilt);
      const headX = bx + 7 + headLean;
      const headY = 47 + Math.round(drawHeadTilt * 0.5) + by;
      const handX = getHandX();
      const handY = getHandY();
      const tipX = Math.round(handX + Math.cos(drawStaffAngle) * 23);
      const tipY = getGemY(false);
      const charged = phase === CHARGE || phase === CAST;

      // Ground contact shadow.
      box(bx - 3, 77, 22, 3, 0);
      box(bx + 1, 76, 15, 2, 9);

      // Staff: two integer raster lines, no transformed canvas state.
      line(handX, handY, tipX, tipY, 9, 2);
      line(handX, handY, tipX, tipY, 13, 1);
      box(handX - 2, handY - 2, 4, 4, 9);
      box(handX - 1, handY - 1, 2, 2, 14);
      drawGem(tipX, tipY, charged);

      // Robe dark outline and warm folded interior.
      box(bx + 2, 57 + by, 13, 3, 9);
      box(bx, 60 + by, 18, 14, 9);
      box(bx - 2, 70 + by, 22, 4, 9);
      box(bx + 3, 57 + by, 10, 17, 11);
      box(bx + 1, 64 + by, 5, 9, 12);
      box(bx + 8, 60 + by, 5, 13, 13);
      box(bx + 14, 64 + by, 3, 9, 10);
      box(bx + 2, 71 + by, 5, 3, 12);
      box(bx + 9, 73 + by, 8, 2, 11);
      box(bx + 5, 58 + by, 2, 14, 14);
      box(bx + 7, 59 + by, 1, 11, 15);
      box(bx + 2, 73 + by, 6, 2, 9); box(bx + 12, 73 + by, 6, 2, 9);

      // The staff continues below the casting hand and plants into the floor shadow.
      line(handX, handY, bx + 16, 76, 9, 2);
      line(handX, handY, bx + 16, 76, 13, 1);

      // Raised arm and hand, then the robe cuff.
      const elbowY = 60 - Math.round(drawArmRaise * 6) + by;
      box(bx + 12, elbowY, 5, 3, 9);
      box(bx + 15, handY - 1, 4, 4, 8);
      box(bx + 17, handY, 2, 2, 7);
      box(bx + 13, elbowY + 2, 3, 2, 12);

      // Face, long beard, and the one-pixel eye under the brim.
      box(headX - 4, headY - 2, 10, 9, 9);
      box(headX - 3, headY - 2, 8, 7, 8);
      box(headX - 1, headY - 1, 6, 5, 7);
      box(headX + 3, headY + 1, 2, 2, 8);
      box(headX + 3, headY + 1, 1, 1, 0);
      box(headX - 2, headY + 3, 7, 8, 16);
      box(headX - 4, headY + 6, 10, 4, 16);
      box(headX - 1, headY + 10, 5, 2, 16);
      box(headX - 3, headY + 6, 2, 3, 6);
      box(headX + 4, headY + 6, 2, 3, 6);
      box(headX + 1, headY + 10 + (poseFrame ? 0 : 1), 2, 2, 7);

      // Bent pointed hat: stepped triangular crown with a hooked tip.
      box(headX - 7, headY - 5, 18, 3, 9);
      box(headX - 5, headY - 7, 15, 2, 9);
      box(headX - 4, headY - 7, 13, 1, 2);
      box(headX - 4, headY - 9, 11, 2, 2);
      box(headX - 3, headY - 11, 9, 2, 2);
      box(headX - 1, headY - 13, 7, 2, 2);
      box(headX + 2, headY - 14, 5, 2, 9);
      box(headX + 5, headY - 15, 4, 2, 9);
      box(headX + 8, headY - 16, 3, 2, 9);
      box(headX - 3, headY - 8, 10, 1, 4);
      box(headX - 2, headY - 10, 8, 1, 3);
      box(headX, headY - 12, 6, 1, 4);
      box(headX + 3, headY - 14, 4, 1, 3);
      box(headX - 8, headY - 4, 20, 2, 9);
      box(headX - 6, headY - 2, 17, 1, 10);
      box(headX + 5, headY - 4, 4, 1, 5);
      if (phase === CAST && (worldTick & 1) === 0) {
        box(headX + 1, headY - 11, 2, 1, 6);
      }
      if (charged) {
        // One-pixel rim on the gem-facing side of the wizard silhouette.
        box(headX + 6, headY + 2, 1, 5, 17);
        box(headX + 6, headY + 7, 1, 2, 16);
        box(bx + 17, 63 + by, 1, 9, 15);
        box(bx + 18, 70 + by, 1, 3, 16);
      }
      spriteMode = 0;
    }

    function draw() {
      // Paint the logical scene once, then nearest-neighbor blit it into the fullscreen display canvas.
      ctx.fillStyle = palette[0];
      ctx.fillRect(0, 0, 128, 96);
      ctx.save();
      ctx.translate(shakeX, shakeY);
      drawSky();
      drawFloor();
      drawParticles();
      drawSpellSpiral();
      drawCastBurst();
      drawWizard();
      drawProjectile();
      ctx.restore();

      displayCtx.fillStyle = palette[0];
      displayCtx.fillRect(0, 0, canvas.width, canvas.height);
      displayCtx.drawImage(logicalCanvas, renderOffsetX, renderOffsetY, 128 * renderScale, 96 * renderScale);
    }

    function frame(now) {
      if (!lastTime) lastTime = now;
      let elapsed = now - lastTime;
      lastTime = now;
      if (elapsed > 250) elapsed = 250;
      accumulator += elapsed;
      while (accumulator >= STEP_MS) {
        update();
        accumulator -= STEP_MS;
      }
      draw();
      window.requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();
    clearParticles();
    draw();
    window.requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
